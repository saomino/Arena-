<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena — Bestiaire</title>
<meta name="description" content="Tous les animaux d'Arena, les événements à venir, les mythiques et les types.">
<meta name="theme-color" content="#12162b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12162b; --surface:#1b2140; --surface-2:#252c52; --line:#343c6b;
  --text:#eceffc; --muted:#a3abd0;
  --terre:#d6a45e; --air:#8fd5f6; --eau:#5f90ff; --mythic:#ffc857;
  --atk:#ff8a6b; --def:#6fb7ff; --sup:#6fe0a6;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gutter:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.5 var(--font-body);
  background-image:radial-gradient(1200px 500px at 85% -10%,#2a3270 0%,transparent 60%);background-repeat:no-repeat;
  padding-bottom:84px;min-height:100vh}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--mythic);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gutter)}

/* header */
header{padding:18px 0 6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:30px;font-weight:800}
.brand span{color:var(--muted);font-size:14px}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang select{appearance:none;-webkit-appearance:none;border:0;background:none;padding:6px 14px;border-radius:999px;font:700 14px var(--font-body);color:var(--text);cursor:pointer}
.lang select option{background:var(--surface);color:var(--text)}


/* navigation: bottom bar on phones, inline tabs on wide screens */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,22,43,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;min-width:56px;padding-left:8px!important;padding-right:8px!important}
nav.tabs button{background:none;border:0;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:700}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--text);background:var(--surface-2)}
@media(min-width:800px){
  body{padding-bottom:40px}
  nav.tabs{position:static;background:none;border:0;backdrop-filter:none;display:flex;gap:6px;padding:10px 0 0;max-width:1080px;margin:0 auto}
  nav.tabs button{flex-direction:row;gap:8px;padding:9px 16px;font-size:15px}
  nav.tabs button .ic{font-size:18px}
  nav.tabs-wrap{padding:0 var(--gutter)}
}

section.view{padding:18px 0 28px}
.lead{color:var(--muted);margin:6px 0 18px;max-width:60ch}
h2.title{font-size:26px;font-weight:800}

/* filters */
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--text);font:inherit;margin-bottom:12px}
.search::placeholder{color:var(--muted)}
.filters{display:grid;gap:8px;margin-bottom:14px}
.frow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.frow::-webkit-scrollbar{display:none}
.frow .lab{color:var(--muted);font-size:13px;flex:0 0 auto;min-width:56px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.count{color:var(--muted);font-size:14px;margin:4px 0 12px}

/* animal cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{--tc:var(--muted);position:relative;text-align:left;background:var(--surface);border:2px solid color-mix(in srgb,var(--tc) 55%,var(--surface));border-radius:18px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card[data-type=terre]{--tc:var(--terre)} .card[data-type=air]{--tc:var(--air)} .card[data-type=eau]{--tc:var(--eau)}
.card.mythic{border-color:var(--mythic);box-shadow:0 0 0 1px var(--mythic),0 8px 28px -8px rgba(255,200,87,.45)}
.art{aspect-ratio:4/5;position:relative;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 38%,var(--surface)),var(--surface-2))}
.art img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.art svg{width:100%;height:100%;display:block}
.hero svg{height:100%;width:auto;max-width:100%;position:relative}
.art .emo{font-size:64px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.tag{position:absolute;top:8px;left:8px;background:rgba(18,22,43,.78);border-radius:999px;padding:3px 9px;font-size:13px;font-weight:700;backdrop-filter:blur(4px)}
.tag.r{left:auto;right:8px}
.meta{padding:10px 12px 12px}
.meta b{font-family:var(--font-display);font-size:17px;display:block;line-height:1.15}
.meta small{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* role colors */
.role-defense{color:var(--def)} .role-attaque{color:var(--atk)} .role-soutien{color:var(--sup)}

/* detail dialog */
dialog{border:0;padding:0;background:var(--ink);color:var(--text);width:min(720px,100vw);max-width:100vw;height:100dvh;max-height:100dvh;margin:0 0 0 auto;overflow:hidden}
@media(min-width:800px){dialog{height:min(92vh,880px);margin:auto;border-radius:24px;border:1px solid var(--line)}}
dialog::backdrop{background:rgba(5,7,18,.72)}
.sheet{height:100%;overflow-y:auto;overscroll-behavior:contain}
.close{position:sticky;top:10px;float:right;margin:10px 10px -50px 0;z-index:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,43,.85);font-size:20px}
.hero{--tc:var(--muted);display:flex;justify-content:center;align-items:center;width:100%;height:min(44vh,400px);overflow:hidden;position:relative;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 45%,var(--surface)),var(--surface-2))}
.hero[data-type=terre]{--tc:var(--terre)} .hero[data-type=air]{--tc:var(--air)} .hero[data-type=eau]{--tc:var(--eau)}
.hero img{height:100%;width:auto;max-width:100%;object-fit:contain;position:relative;display:block}
.hero .bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(24px) saturate(1.2);opacity:.55}
.hero .emo{font-size:110px;position:relative;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4))}
.body{padding:18px var(--gutter) 40px}
.body h2{font-size:32px;font-weight:800}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.pill.t-terre{border-color:var(--terre);color:var(--terre)} .pill.t-air{border-color:var(--air);color:var(--air)} .pill.t-eau{border-color:var(--eau);color:var(--eau)}
.pill.myth{border-color:var(--mythic);color:var(--mythic)}
.how{background:var(--surface);border-left:4px solid var(--tc,var(--line));border-radius:12px;padding:12px 14px;margin:14px 0}
.how b{display:block;margin-bottom:2px}
h3.sec{font-size:20px;font-weight:800;margin:26px 0 10px}
.skill{background:var(--surface);border-radius:14px;padding:11px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.skill .nm{font-weight:700}
.skill .nums{color:var(--muted);font-size:14px;text-align:right;white-space:nowrap}
.skill .fx{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fxc{background:var(--surface-2);border-radius:8px;padding:2px 8px;font-size:13px}
.weapon{display:grid;grid-template-columns:110px 1fr;gap:14px;background:linear-gradient(135deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:12px}
.weapon img{width:100%;border-radius:10px;display:block}
.weapon .emo{font-size:56px;display:grid;place-items:center}
.weapon h4{margin:0 0 4px;font-family:var(--font-display);font-size:18px}
.copy{margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
details.gloss{margin-top:14px;color:var(--muted);font-size:14px}
details.gloss summary{cursor:pointer;font-weight:700;color:var(--text)}
details.gloss dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
details.gloss dt{font-weight:700;color:var(--text)} details.gloss dd{margin:0}
.hint{color:var(--muted);font-size:14px}

/* events */
.eblock{margin-bottom:26px}
.ehead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.ehead h3{font-size:22px;font-weight:800}
.status{border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;background:var(--surface-2)}
.status.live{background:#1f6b46;color:#c6f7de} .status.soon{background:#6b4f12;color:#ffe3a3}
.dates{color:var(--muted);font-size:14px;width:100%}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.past{opacity:.6}
.group-t{font-family:var(--font-display);font-size:14px;color:var(--muted);margin:22px 0 10px;font-weight:600}

/* mythics */
.mgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.mgrid{grid-template-columns:1fr 1fr}}
.mcard{display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--surface);border:2px solid var(--mythic);border-radius:20px;padding:12px;text-align:left;width:100%}
.mcard .art{aspect-ratio:3/4;border-radius:12px}
.mcard h3{font-size:21px;font-weight:800;margin:2px 0 6px}
.mcard p{margin:8px 0 0;color:var(--text)}

/* types */
.tri{display:block;margin:6px auto 12px;max-width:420px;width:100%}
.rules{display:grid;gap:12px}
@media(min-width:700px){.rules{grid-template-columns:1fr 1fr}}
.rule{background:var(--surface);border-radius:16px;padding:14px 16px}
.rule h3{font-size:18px;font-weight:800;margin-bottom:6px}
.trios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.trio{border-radius:14px;padding:12px;background:var(--surface-2);text-align:center;border:2px solid var(--tc)}
.trio b{font-family:var(--font-display);font-size:26px;display:block}
.trio.terre{--tc:var(--terre)} .trio.air{--tc:var(--air)} .trio.eau{--tc:var(--eau)}
footer{color:var(--muted);font-size:13px;padding:6px 0 10px;text-align:center}

/* profile */
.card.locked .art{filter:grayscale(.9) brightness(.55)}
.card.locked{border-color:var(--line);box-shadow:none}
.card.locked .meta b,.card.locked .meta small{opacity:.6}
.own-mark{position:absolute;left:8px;bottom:8px;background:rgba(18,22,43,.85);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700;color:var(--mythic)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px}
.tile b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1}
.tile span{color:var(--muted);font-size:13px}

.itabs{display:flex;gap:8px;margin:14px 0}
.itabs .chip{flex:1;text-align:center}
.trio-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin:0 0 12px}
.trio-card.best{border-color:var(--tc,var(--line));box-shadow:0 0 0 1px var(--tc,var(--line)) inset}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:none;border:0;padding:0;text-align:center;color:var(--text)}
.slot .mini{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative}
.slot .mini img,.slot .mini svg{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.slot .mini .emo{font-size:40px}
.slot.miss .mini{filter:grayscale(.9) brightness(.55)}
.slot small{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.slot b{display:block;font-size:14px;line-height:1.2}
.slot .lk{position:absolute;right:4px;top:4px;font-size:14px}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface-2)}
.pill.ok{border-color:#3f9d5c;color:#9be8b4}.pill.mid{border-color:#c79a2e;color:#ffd97a}.pill.no{color:var(--muted)}
.tip{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:14px;color:var(--muted)}

.wg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:0 0 10px}
.wg h4{margin:0 0 4px;font-family:var(--font-display);font-size:17px}
.wg p{margin:0;color:var(--muted);font-size:14.5px}
.wg code{background:var(--surface-2);border-radius:6px;padding:1px 6px;font-size:13px;color:var(--text)}
.wcard{display:grid;grid-template-columns:96px 1fr;gap:12px;width:100%;text-align:left;background:linear-gradient(135deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:10px;margin:0 0 10px;color:var(--text)}
.wcard.mine{border-color:var(--mythic)}
.wcard .wi{border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--ink);display:grid;place-items:center}
.wcard .wi img{width:100%;height:100%;object-fit:cover;display:block}
.wcard .wi .emo{font-size:46px}
.wcard h4{margin:0;font-family:var(--font-display);font-size:17px;line-height:1.15}
.wcard .who{font-size:13px;color:var(--muted);margin:2px 0 6px}
.wcard .ws{font-size:13.5px}.wcard .ws b{display:block}.wcard .ws span{color:var(--muted)}
.wcard .st{display:inline-block;margin-top:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface-2)}
.wcard .st.ok{border-color:#3f9d5c;color:#9be8b4}

.fact{background:linear-gradient(135deg,#1f3b2f,var(--surface));border:1px solid #2f6a4f;border-radius:14px;padding:12px 14px;margin:0 0 14px}
.fact.myth{background:linear-gradient(135deg,#3a2d52,var(--surface));border-color:#6a4fa0}
.fact b{display:block;margin-bottom:4px;font-family:var(--font-display);font-size:16px}
.fact p{margin:0;font-size:15px}
.fact small{display:block;margin-top:8px;color:var(--muted);font-size:12px}
.subnav{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.subnav .chip{flex:1 0 auto}
.todo{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:8px}
.todo li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.bsel{display:grid;gap:10px;margin:0 0 12px}
.bsel label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.bsel select{width:100%;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px}
.brow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.btn2{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 13px;font-weight:700;font-size:14px;color:var(--text)}
.rbar{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:6px 0}

.bslot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.bsub{display:grid;grid-template-columns:92px 1fr;gap:8px}
.bsel select{font-size:15px}
.pbar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--tc,var(--text));border-radius:999px}
.prog{background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.prog .row{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-weight:700}
.prog .row span:last-child{color:var(--muted);font-weight:400}
.prog.done{border:1px solid var(--mythic)}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot .lab{font-size:13px;margin-bottom:4px;font-weight:700}
.note{background:var(--surface);border-left:4px solid var(--mythic);border-radius:12px;padding:12px 14px;margin:14px 0}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px}
.items{display:grid;gap:8px}
.item{background:var(--surface);border-radius:12px;padding:10px 14px;display:grid;gap:2px}
.item small{color:var(--muted)}
.lvl-tag{background:var(--surface-2);border-radius:8px;padding:1px 8px;font-size:12px;margin-left:6px;color:var(--muted);font-weight:400}
.progress-block{background:linear-gradient(135deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* boutique */
.wallet{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0}
.wallet .big{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1}
.wallet small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin:12px 0 20px}
.fcard{--tc:var(--muted);background:var(--surface);border:2px solid color-mix(in srgb,var(--tc) 55%,var(--surface));border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative}
.fcard.t-gift{--tc:var(--sup)}.fcard.t-rare{--tc:var(--air)}.fcard.t-legendary{--tc:var(--mythic)}
.fcard.t-legendary{box-shadow:0 0 22px -8px var(--mythic)}
.fcard.equipped{background:color-mix(in srgb,var(--tc) 14%,var(--surface))}
.fimg{height:132px;display:flex;align-items:center;justify-content:center}
.fimg img{max-width:100%;max-height:100%;object-fit:contain;animation:floaty 3.4s ease-in-out infinite}
.fcard.soon .fimg img{filter:grayscale(1) brightness(.55);animation:none;opacity:.7}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.fimg img{animation:none}}
.fmeta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fmeta b{font-family:var(--font-display);font-size:18px}
.ftier{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--tc);border:1px solid var(--tc);border-radius:999px;padding:1px 8px}
.fpers{margin:0;color:var(--muted);font-size:13.5px}
.fquote{margin:0;font-size:13px;font-style:italic;color:var(--text);opacity:.85;min-height:2.6em}
.fbuy{margin-top:auto;padding-top:6px;display:grid;gap:6px}
.fbuy .btn{width:100%}
.fbuy .btn[disabled]{opacity:.55;cursor:default}
.fbuy .btn.buy{background:var(--tc);color:#12162b;border-color:transparent}
.fbuy .btn.on{border-color:var(--sup);color:#9be8b4}
.fbuy .need{font-size:12px;color:var(--muted);text-align:center}
.fimg.scene{height:auto;aspect-ratio:1/1;border-radius:14px;overflow:hidden}
.fimg.scene img{width:100%;height:100%;max-height:none;object-fit:cover;animation:none}
.fcard.isev{box-shadow:0 0 22px -10px var(--tc)}
.fcard.isev .fmeta{flex-direction:column;align-items:flex-start;gap:4px}
.fcard.isev .ftier{white-space:nowrap}
.evnote{font-size:12px;font-weight:700;color:var(--tc);text-align:center}
.shopmsg{background:var(--surface-2);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
/* ---------- battle page ---------- */
.back{color:var(--muted);font-size:14px;text-decoration:none}.back:hover{color:var(--text)}
.bthead{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin:4px 0 14px}
.bthead.win{border-color:color-mix(in srgb,var(--sup) 60%,var(--line))}.bthead.loss{border-color:color-mix(in srgb,var(--atk) 60%,var(--line))}
.bthead .bte{font-size:46px;line-height:1}
.bthead h2{margin:0 0 8px;font-family:var(--font-display);font-size:clamp(19px,5vw,26px);line-height:1.15}
.bthead h2 span{color:var(--muted);font-weight:500;font-size:.7em}
.btbadges{display:flex;flex-wrap:wrap;gap:6px}
.btstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 6px}
.btstats>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.btstats b{display:block;font-family:var(--font-display);font-size:28px;line-height:1}
.btstats span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.btstats small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.btbox{max-width:780px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 14px}
.btchart{width:100%;height:auto;display:block}
.btleg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.btleg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.btteam{display:grid;gap:8px}
.btf{display:grid;grid-template-columns:minmax(120px,170px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.btf.ko{opacity:.6}.btf em{font-style:normal;font-size:11px}.btf b{color:var(--atk);font-size:12px}
.btf small{color:var(--muted);min-width:70px;text-align:right}
.bbar{display:block;height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bbar i{display:block;height:100%;background:var(--sup);border-radius:6px}
.bbar.boss i{background:var(--atk)}
.bttl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.bttl>li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.bth{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.bth b{font-family:var(--font-display)}.bth small{color:var(--muted)}
.bevs{list-style:none;margin:10px 0 4px;padding:0;display:grid;gap:6px}
.bev{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:14px}
.bev.c-attaque{border-color:var(--atk)}.bev.c-defense{border-color:var(--def)}.bev.c-soutien{border-color:var(--sup)}
.bev small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.bst{margin:6px 0 0;color:#c4b5fd;font-size:13px}
.bhit{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:#ffb3a1}
.bhit.dodge{color:#9bdcff}.bhit b{color:var(--atk)}
@media(max-width:480px){.btf{grid-template-columns:1fr auto}.btf .bbar{grid-column:1/-1;order:3}}

/* weapons: equipped vs. not equipped */
.item.eq{border:2px solid var(--mythic);background:color-mix(in srgb,var(--mythic) 13%,var(--surface));box-shadow:0 0 18px -8px var(--mythic)}
.eqb{justify-self:start;background:var(--mythic);color:#1a1405;font-weight:700;font-size:.78rem;padding:2px 10px;border-radius:999px;margin-bottom:4px}
.items.off .item{opacity:.8}
.eqh{margin:18px 0 8px;font-size:.95rem;letter-spacing:.02em;color:var(--muted)}
.eqh.on{color:var(--mythic)}

/* weapon thumbnails */
.item.w{display:flex;gap:12px;align-items:center}
.wbody{display:grid;gap:2px;min-width:0;flex:1}
.wbody small{overflow-wrap:anywhere}
.wth{flex:none;width:68px;height:68px;border-radius:14px;overflow:hidden;display:grid;place-items:center;border:2px solid var(--tc,#888);background:linear-gradient(145deg,color-mix(in srgb,var(--tc,#888) 35%,#0d0d18),#0d0d18);font-size:32px}
.wth img{width:100%;height:100%;object-fit:cover;display:block}
.wth.t-bronze{--tc:#c98b5a}.wth.t-silver{--tc:#cfd8e6}.wth.t-gold{--tc:#ffc857}.wth.t-legendary{--tc:#b983ff;box-shadow:0 0 16px -6px #b983ff}
.item.eq .wth{box-shadow:0 0 0 2px var(--mythic),0 0 16px -4px var(--mythic)}
.sg{margin:0 0 18px}
.sgc{margin:0 0 14px}
.sgc h4{margin:10px 0 4px;font-size:16px}
.sgw{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.5}
.sgw li{margin:2px 0}.sgw b{color:var(--text)}
.sgsub{display:block;font-size:12px;opacity:.92;margin-top:3px;line-height:1.45}.sgw li{margin-bottom:8px}.skins{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scroll-snap-type:x proximity}
.skins img{height:96px;width:auto;border-radius:10px;border:2px solid var(--line);flex:0 0 auto;scroll-snap-align:start;cursor:zoom-in;transition:height .2s}
.skins img.big{height:220px;cursor:zoom-out}
</style>
</head>

</main>

<script>const FACTS_X={};
;
FACTS_X.es={pegase:"En la mitología griega, Pegaso nació de la sangre de Medusa cuando Perseo le cortó la cabeza. El héroe Belerofonte lo montó después para vencer a la Quimera. Zeus acabó convirtiéndolo en una constelación.",kraken:"El Kraken viene de los relatos de los marineros escandinavos: un monstruo marino gigante que arrastraba los barcos al fondo. Muchos creen que se inspiró en los calamares gigantes, que sí existen.",minotaure:"El Minotauro, mitad hombre y mitad toro, estaba encerrado en el Laberinto del rey Minos, en Creta. El héroe Teseo lo mató gracias al hilo de Ariadna.",oiseau_tonnerre:"El Pájaro Trueno es un espíritu-ave gigante en las tradiciones de varios pueblos indígenas de Norteamérica. El batir de sus alas crea el trueno y de sus ojos salen relámpagos.",tortue_monde:"En varias tradiciones antiguas (hindú, china, algunos relatos de pueblos indígenas americanos), el mundo descansa sobre el lomo de una tortuga gigante.",qilin:"El qilin es una criatura bondadosa de la tradición china. Se decía que su aparición anunciaba a un gobernante sabio o el nacimiento de un sabio. Es tan bueno que, según la leyenda, ni pisa la hierba viva.",sphinx:"En la mitología griega, la Esfinge planteaba un acertijo a los viajeros y devoraba a quienes fallaban. Edipo halló la respuesta: el Hombre, que va a cuatro patas por la mañana, a dos al mediodía y a tres por la tarde.",sirene:"En la mitología griega, las sirenas atraían a los marineros con sus cantos. Ulises se hizo atar al mástil de su barco para escucharlas sin peligro.",basilic:"Basilisco viene del griego «pequeño rey». En los bestiarios medievales mataba con la mirada o con el aliento. Su único enemigo conocido era la comadreja.",wyverne:"La wyvern es un dragón de dos patas que aparece sobre todo en la heráldica europea, en los escudos de armas. Su nombre viene del francés antiguo para «víbora».",cerbere:"En la mitología griega, Cerbero custodiaba las puertas del Inframundo: ningún vivo entraba y ningún muerto salía. Heracles lo capturó en su duodécimo trabajo.",kelpie:"El kelpie es un espíritu del agua cambiaformas del folclore escocés, a menudo un caballo junto a lagos y ríos. Quien se sube a su lomo ya no puede bajarse.",dragon_celeste:"En la tradición china, el dragón celestial (Tianlong) custodia los palacios de los dioses en el cielo.",eikthyrnir:"En la mitología nórdica, el ciervo Eikthyrnir se alza sobre el tejado del Valhalla y come las hojas del árbol Læraðr. De sus astas gotean las aguas que alimentan muchos ríos.",jormungandr:"En la mitología nórdica, Jörmungandr es la Serpiente del Mundo, tan larga que rodea toda la Tierra y se muerde la cola. Thor está destinado a enfrentarla en el Ragnarök.",
 tigre:"Hace un siglo había unos 100 000 tigres salvajes. Hoy quedan menos de 6 000, por la caza furtiva y la pérdida de sus bosques. Aun así, India y Nepal han visto crecer sus poblaciones en los últimos años.",
 lion:"Quedan unos 20 000–25 000 leones salvajes en África, un descenso de alrededor del 40 % en dos décadas. La UICN lo clasifica como Vulnerable.",
 chien:"El perro fue el primer animal domesticado por los humanos, hace al menos 15 000 años, mucho antes de la agricultura.",
 chat:"Los gatos fueron domesticados hace unos 10 000 años en Oriente Próximo, probablemente porque cazaban roedores cerca de los primeros almacenes de grano.",
 boeuf:"El ganado vacuno desciende del uro, cuyo último ejemplar murió en Polonia en 1627. Hoy hay más de mil millones de bovinos en el mundo.",
 renard:"El zorro rojo es el carnívoro salvaje más extendido del mundo: vive desde el Ártico hasta Oriente Medio, e incluso en las ciudades.",
 ours:"El oso pardo desapareció de muchas zonas de Europa occidental. Gracias a la protección y a las reintroducciones (como en los Pirineos) está volviendo, aunque algunas poblaciones siguen siendo muy frágiles.",
 loup:"Exterminado de casi toda Europa occidental en el siglo XX, el lobo regresó a Francia en 1992 desde Italia, por el macizo del Mercantour.",
 aigle:"En Estados Unidos, el águila calva cayó a menos de 500 parejas reproductoras en 1963, afectada sobre todo por el pesticida DDT. Tras su prohibición, hoy hay más de 70 000 parejas.",
 serpent:"Hay unas 3 900 especies de serpientes y solo una minoría es peligrosa. Aun así, las mordeduras siguen causando decenas de miles de muertes al año, sobre todo en el sur de Asia y en África.",
 herisson:"El erizo europeo fue clasificado como Casi Amenazado por la UICN en 2024. Las carreteras, los cortacéspedes robot, los pesticidas y la desaparición de los setos hacen caer sus poblaciones.",
 poulpe:"El pulpo tiene tres corazones y sangre azul. Cerca de dos tercios de sus neuronas están en sus brazos, que pueden «decidir» en parte por sí solos.",
 chauve_souris:"Los murciélagos son aproximadamente una quinta parte de todas las especies de mamíferos. Una enfermedad fúngica, el síndrome de la nariz blanca, ha matado a millones en Norteamérica.",
 dauphin:"El delfín del río Yangtsé (baiji) fue declarado funcionalmente extinto en 2006, víctima de la pesca, el tráfico fluvial y la contaminación: uno de los primeros grandes cetáceos perdidos por culpa de los humanos.",
 tortue:"Seis de las siete especies de tortugas marinas están catalogadas como amenazadas. Las redes de pesca, el plástico y la iluminación de las playas (que desorienta a las crías) están entre las causas.",
 rhinoceros:"Quedan unos 27 000 rinocerontes en el mundo, frente a unos 500 000 hace un siglo. Los cazan furtivamente por su cuerno, que es solo queratina, como nuestras uñas.",
 crabe:"Cada año, decenas de millones de cangrejos rojos de la isla Christmas migran del bosque al mar para reproducirse: una de las mayores migraciones de animales terrestres. El cangrejo araña gigante de Japón puede superar los 3,5 m de envergadura.",
 requin:"Alrededor del 37 % de las especies de tiburones y rayas están amenazadas de extinción. Se estima que cada año se capturan decenas de millones de tiburones, a menudo por sus aletas.",
 crocodile:"El linaje de los cocodrilianos sobrevivió a la extinción que acabó con los dinosaurios. El cocodrilo marino de Australia, cazado hasta unos 3 000 ejemplares en los años 70, se ha recuperado hasta más de 100 000.",
 elephant:"En 2021, la UICN catalogó al elefante de sabana africano como En Peligro y al elefante de bosque como En Peligro Crítico. Los elefantes de bosque perdieron más del 80 % de su población en tres décadas, sobre todo por la caza furtiva del marfil.",
 hibou:"Los búhos y lechuzas vuelan casi sin hacer ruido gracias a sus plumas con flecos. Viven en todos los continentes salvo la Antártida.",
 gorille:"Los gorilas de montaña pasaron de En Peligro Crítico a En Peligro en 2018 tras décadas de protección: quedan algo más de 1 000. Los demás gorilas siguen amenazados por la caza furtiva, las enfermedades y la deforestación.",
 paon:"El pavo real azul es el ave nacional de la India. Su primo, el pavo real verde del sudeste asiático, está En Peligro. Solo el macho tiene la famosa cola, hecha de plumas y no de la cola en sí.",
 renard_voyageur:"Un zorro ártico recorrió unos 3 500 km en 76 días, desde Svalbard hasta Canadá cruzando el hielo marino: uno de los viajes más largos registrados para un animal de su tamaño.",
 hibou_sage:"El cárabo lapón puede oír a un topillo oculto bajo más de 50 cm de nieve y lanzarse a por él.",
 loup_gardien:"En 1995 se reintrodujeron lobos en el Parque de Yellowstone, 70 años después de su desaparición. Su regreso cambió el comportamiento de los alces, luego la vegetación e incluso algunos ríos: un famoso ejemplo de «cascada trófica».",
 blaireau_sorciere:"Las tejoneras las excavan y amplían generaciones sucesivas de tejones: algunas llevan más de un siglo ocupadas.",
 lapin_citrouille:"El conejo europeo está catalogado En Peligro en la península ibérica (UICN, 2018) por enfermedades (mixomatosis y enfermedad hemorrágica vírica). Y el lince ibérico depende casi por completo de él para alimentarse.",
 serpent_squelette:"Algunas serpientes tienen hasta 400 vértebras, cada una con un par de costillas. Sin patas, pero con esqueleto de contorsionista.",
 renne_grelot:"Las manadas de renos y caribús de la tundra han caído alrededor de un 56 % en dos o tres décadas, con un clima que se calienta y trastoca su alimento.",
 ours_pere_noel:"Quedan unos 26 000 osos polares, catalogados como Vulnerables. Dependen del hielo marino para cazar focas, y cada verano retrocede.",
 pingouin_bonnet:"El pingüino emperador está catalogado como Casi Amenazado. En 2022 y 2023, casi todos los polluelos de varias colonias del mar de Bellingshausen murieron: el hielo marino se rompió antes de que supieran nadar.",
 dragon_imperial:"En la China imperial, el dragón de cinco garras estaba reservado al emperador. El dragón chino, ligado al agua y a la lluvia, trae suerte, al contrario que el dragón occidental.",
 belier_jade:"La oveja fue uno de los primeros animales domesticados, hace unos 10 000 años en Oriente Próximo. En el zodiaco chino, la cabra, la oveja y el carnero comparten un mismo signo.",
 carpe_koi:"Los koi son carpas criadas en Japón desde el siglo XIX por sus colores. Pueden vivir más de 50 años, y su nombre también evoca la suerte en Japón.",
 cygne_cupidon:"Los cisnes vulgares forman parejas que a menudo siguen juntas toda la vida, de ahí su simbolismo romántico.",
 loutre_main_dans_la_main:"Las nutrias marinas se agarran de las patas al dormir para no separarse a la deriva. Cazadas por su piel, cayeron por debajo de 2 000 en 1911; hoy se cuentan por decenas de miles.",
 perruche_inseparable:"Los inseparables deben su nombre al fuerte vínculo entre parejas. Hay nueve especies, todas originarias de África y Madagascar.",
 leopard_glacier:"Quedan unos 4 000–6 500 leopardos de las nieves en Asia central. Catalogados como Vulnerables, los amenazan la caza furtiva, el conflicto con los pastores y la reducción de su hábitat.",
 pangolin_blinde:"El pangolín es el mamífero salvaje más traficado del mundo, por sus escamas y su carne. Sus ocho especies están protegidas.",
 abeille_reine:"Una abeja reina puede poner hasta 2 000 huevos al día. Aproximadamente una de cada diez especies de abejas silvestres europeas está amenazada de extinción, aunque polinizan buena parte de nuestros cultivos.",
 guepard_zenith:"El guepardo es el animal terrestre más rápido, más de 100 km/h en punta. Quedan unos 7 000 en libertad, y ha desaparecido de la mayor parte de Asia.",
 hippopotame_marais:"Quedan unos 115 000–130 000 hipopótamos en África, catalogados como Vulnerables. Se los caza por su carne y por el marfil de sus caninos.",
 suricate_sentinelle:"Entre los suricatos, uno hace de centinela de pie en un punto alto mientras los demás buscan comida, y avisa con gritos distintos según el peligro (águila, serpiente…).",
 narval_etoile:"El «cuerno» del narval es en realidad un diente, un colmillo que puede alcanzar 3 m y que es sensible a su entorno. En la Edad Media se vendía como cuerno de unicornio.",
 lama_andin:"Las llamas se domestican en los Andes desde hace unos 5 000 años. Cargaban las caravanas mucho antes de que llegara el caballo a América.",
 luciole_lune:"La contaminación lumínica altera las señales de las luciérnagas, que se mandan destellos para encontrarse. Un estudio de 2021 estima que alrededor de una de cada siete especies norteamericanas está amenazada.",
 mammouth_ancestral:"Los últimos mamuts lanudos vivieron en la isla de Wrangel, en el Ártico, hasta hace unos 4 000 años: por la época en que se construían las pirámides de Egipto.",
 phenix:"El fénix renace de sus cenizas. El mito viene del antiguo Egipto (el ave Bennu) y de Grecia, y simboliza la renovación.",
 leviathan:"El Leviatán es un monstruo marino que aparece en la Biblia (libros de Job y de los Salmos). Su nombre se ha convertido en una palabra para todo lo gigantesco.",
 griffon:"El grifo, mitad águila y mitad león, custodiaba tesoros en los relatos griegos. Según una hipótesis, los fósiles de dinosaurios del desierto de Gobi pudieron inspirar esos relatos.",
 licorne_saisons:"La primera descripción del unicornio es de un médico griego, Ctesias, hacia el 400 a. C., que habla de un asno salvaje con cuerno procedente de la India. En la Edad Media, los «cuernos de unicornio» eran en realidad colmillos de narval.",
 hydre:"La hidra de Lerna, con cabezas que vuelven a crecer, es vencida por Heracles en sus doce trabajos. En la naturaleza real, la hidra es un diminuto animal de agua dulce capaz de regenerar todo su cuerpo.",
 ouroboros:"La serpiente que se muerde la cola es uno de los símbolos más antiguos del mundo. Ya aparece en el antiguo Egipto y representa un ciclo sin fin, la vida que se renueva."
};
FACTS_X.pt={pegase:"Na mitologia grega, Pégaso nasceu do sangue da Medusa quando Perseu lhe cortou a cabeça. O herói Belerofonte o montou depois para vencer a Quimera. Zeus acabou transformando-o numa constelação.",kraken:"O Kraken vem dos relatos dos marinheiros escandinavos: um monstro marinho gigante que arrastava os navios para o fundo. Muitos acreditam que foi inspirado nas lulas-gigantes, que existem de verdade.",minotaure:"O Minotauro, metade homem e metade touro, vivia preso no Labirinto do rei Minos, em Creta. O herói Teseu o matou graças ao fio de Ariadne.",oiseau_tonnerre:"O Pássaro-Trovão é um espírito-ave gigante nas tradições de vários povos indígenas da América do Norte. O bater de suas asas faz o trovão, e relâmpagos saem de seus olhos.",tortue_monde:"Em várias tradições antigas (hindu, chinesa, alguns relatos dos povos indígenas americanos), o mundo repousa sobre o casco de uma tartaruga gigante.",qilin:"O qilin é uma criatura gentil da tradição chinesa. Dizia-se que sua aparição anunciava um governante sábio ou o nascimento de um sábio. É tão bondoso que, segundo a lenda, nem pisa na grama viva.",sphinx:"Na mitologia grega, a Esfinge propunha um enigma aos viajantes e devorava quem errava. Édipo achou a resposta: o Homem, que anda de quatro pela manhã, de dois ao meio-dia e de três à tarde.",sirene:"Na mitologia grega, as sereias atraíam os marinheiros com seus cantos. Ulisses mandou amarrá-lo ao mastro do navio para ouvi-las sem perigo.",basilic:"Basilisco vem do grego «pequeno rei». Nos bestiários medievais, matava com o olhar ou o hálito. Seu único inimigo conhecido era a doninha.",wyverne:"A wyvern é um dragão de duas patas visto sobretudo na heráldica europeia, nos brasões. O nome vem do francês antigo para «víbora».",cerbere:"Na mitologia grega, Cérbero guardava os portões do Mundo dos Mortos: nenhum vivo entrava e nenhum morto saía. Héracles o capturou em seu décimo segundo trabalho.",kelpie:"O kelpie é um espírito da água metamorfo do folclore escocês, muitas vezes um cavalo junto a lagos e rios. Quem sobe em suas costas não consegue mais descer.",dragon_celeste:"Na tradição chinesa, o dragão celeste (Tianlong) guarda os palácios dos deuses no céu.",eikthyrnir:"Na mitologia nórdica, o cervo Eikthyrnir fica sobre o telhado de Valhala e come as folhas da árvore Læraðr. De suas galhadas pingam as águas que alimentam muitos rios.",jormungandr:"Na mitologia nórdica, Jörmungandr é a Serpente do Mundo, tão longa que rodeia toda a Terra e morde a própria cauda. Thor está destinado a enfrentá-la no Ragnarök.",
 tigre:"Há um século havia cerca de 100 000 tigres selvagens. Hoje restam menos de 6 000, por causa da caça ilegal e da perda das suas florestas. Mesmo assim, Índia e Nepal viram suas populações crescer nos últimos anos.",
 lion:"Restam cerca de 20 000 a 25 000 leões selvagens na África, uma queda de cerca de 40% em duas décadas. A UICN o classifica como Vulnerável.",
 chien:"O cão foi o primeiro animal domesticado pelos humanos, há pelo menos 15 000 anos, muito antes da agricultura.",
 chat:"Os gatos foram domesticados há cerca de 10 000 anos no Oriente Próximo, provavelmente porque caçavam roedores perto dos primeiros estoques de grãos.",
 boeuf:"O gado descende do auroque, cujo último indivíduo morreu na Polônia em 1627. Hoje há mais de um bilhão de bovinos no mundo.",
 renard:"A raposa-vermelha é o carnívoro selvagem mais difundido do mundo: vive do Ártico ao Oriente Médio, e até nas cidades.",
 ours:"O urso-pardo desapareceu de muitas regiões da Europa Ocidental. Graças à proteção e às reintroduções (como nos Pirenéus), ele está voltando, mas algumas populações continuam muito frágeis.",
 loup:"Exterminado da maior parte da Europa Ocidental no século XX, o lobo voltou à França em 1992, vindo da Itália, pelo maciço do Mercantour.",
 aigle:"Nos Estados Unidos, a águia-de-cabeça-branca caiu para menos de 500 casais reprodutores em 1963, atingida principalmente pelo pesticida DDT. Depois da proibição, hoje são mais de 70 000 casais.",
 serpent:"Existem cerca de 3 900 espécies de cobras e só uma minoria é perigosa. Ainda assim, as picadas causam dezenas de milhares de mortes por ano, sobretudo no Sul da Ásia e na África.",
 herisson:"O ouriço-europeu foi classificado como Quase Ameaçado pela UICN em 2024. Estradas, cortadores de grama robôs, pesticidas e o desaparecimento das sebes derrubam suas populações.",
 poulpe:"O polvo tem três corações e sangue azul. Cerca de dois terços dos seus neurônios ficam nos braços, que podem «decidir» em parte por conta própria.",
 chauve_souris:"Os morcegos representam cerca de um quinto de todas as espécies de mamíferos. Uma doença fúngica, a síndrome do nariz branco, matou milhões deles na América do Norte.",
 dauphin:"O golfinho-do-yangtzé (baiji) foi declarado funcionalmente extinto em 2006, vítima da pesca, do tráfego de barcos e da poluição: um dos primeiros grandes cetáceos perdidos por causa dos humanos.",
 tortue:"Seis das sete espécies de tartarugas marinhas estão classificadas como ameaçadas. Redes de pesca, plástico e iluminação das praias (que desorienta os filhotes) estão entre as causas.",
 rhinoceros:"Restam cerca de 27 000 rinocerontes no mundo, contra cerca de 500 000 há um século. Eles são caçados ilegalmente pelo chifre, que é só queratina, como as nossas unhas.",
 crabe:"Todos os anos, dezenas de milhões de caranguejos-vermelhos da Ilha Christmas migram da floresta para o mar para se reproduzir: uma das maiores migrações de animais terrestres. O caranguejo-aranha-gigante do Japão pode passar de 3,5 m de envergadura.",
 requin:"Cerca de 37% das espécies de tubarões e raias estão ameaçadas de extinção. Estima-se que dezenas de milhões de tubarões sejam capturados por ano, muitas vezes pelas barbatanas.",
 crocodile:"A linhagem dos crocodilianos sobreviveu à extinção que eliminou os dinossauros. O crocodilo-de-água-salgada da Austrália, caçado até cerca de 3 000 indivíduos nos anos 1970, se recuperou para mais de 100 000.",
 elephant:"Em 2021, a UICN classificou o elefante-da-savana africano como Em Perigo e o elefante-da-floresta como Criticamente em Perigo. Os elefantes-da-floresta perderam mais de 80% de sua população em três décadas, sobretudo pela caça ilegal de marfim.",
 hibou:"Corujas e mochos voam quase em silêncio graças às penas franjadas. Vivem em todos os continentes, exceto a Antártida.",
 gorille:"Os gorilas-das-montanhas passaram de Criticamente em Perigo para Em Perigo em 2018, após décadas de proteção: restam pouco mais de 1 000. Os demais gorilas continuam ameaçados pela caça ilegal, por doenças e pelo desmatamento.",
 paon:"O pavão-azul é a ave nacional da Índia. Seu primo, o pavão-verde do Sudeste Asiático, está Em Perigo. Só o macho tem a famosa cauda, feita de penas e não da cauda propriamente dita.",
 renard_voyageur:"Uma raposa-do-ártico percorreu cerca de 3 500 km em 76 dias, de Svalbard ao Canadá, atravessando o gelo marinho: uma das viagens mais longas já rastreadas para um animal desse tamanho.",
 hibou_sage:"A coruja-cinzenta consegue ouvir um arganaz escondido sob mais de 50 cm de neve e mergulhar para pegá-lo.",
 loup_gardien:"Em 1995, lobos foram reintroduzidos no Parque de Yellowstone, 70 anos depois de desaparecerem. O retorno mudou o comportamento dos alces, depois a vegetação e até alguns rios: um famoso exemplo de «cascata trófica».",
 blaireau_sorciere:"As tocas dos texugos são escavadas e ampliadas por gerações sucessivas: algumas são ocupadas há mais de um século.",
 lapin_citrouille:"O coelho-europeu está classificado como Em Perigo na Península Ibérica (UICN, 2018) por causa de doenças (mixomatose e doença hemorrágica viral). E o lince-ibérico depende quase totalmente dele para se alimentar.",
 serpent_squelette:"Algumas cobras têm até 400 vértebras, cada uma com um par de costelas. Sem patas, mas com esqueleto de contorcionista.",
 renne_grelot:"As manadas de renas e caribus da tundra caíram cerca de 56% em duas ou três décadas, com um clima que esquenta e bagunça a alimentação.",
 ours_pere_noel:"Restam cerca de 26 000 ursos-polares, classificados como Vulneráveis. Eles dependem do gelo marinho para caçar focas, e ele recua a cada verão.",
 pingouin_bonnet:"O pinguim-imperador está classificado como Quase Ameaçado. Em 2022 e 2023, quase todos os filhotes de várias colônias do mar de Bellingshausen morreram: o gelo marinho se quebrou antes de aprenderem a nadar.",
 dragon_imperial:"Na China imperial, o dragão de cinco garras era reservado ao imperador. O dragão chinês, ligado à água e à chuva, traz sorte, ao contrário do dragão ocidental.",
 belier_jade:"A ovelha foi um dos primeiros animais domesticados, há cerca de 10 000 anos no Oriente Próximo. No zodíaco chinês, cabra, ovelha e carneiro compartilham um mesmo signo.",
 carpe_koi:"Os kois são carpas criadas no Japão desde o século XIX por suas cores. Podem viver mais de 50 anos, e o nome também evoca sorte no Japão.",
 cygne_cupidon:"Os cisnes-mudos formam casais que muitas vezes ficam juntos a vida toda, daí o simbolismo romântico.",
 loutre_main_dans_la_main:"As lontras-marinhas dão as patas ao dormir para não se separarem à deriva. Caçadas pela pele, caíram abaixo de 2 000 em 1911; hoje somam dezenas de milhares.",
 perruche_inseparable:"Os agapornis devem o nome ao forte vínculo entre os parceiros. Existem nove espécies, todas originárias da África e de Madagascar.",
 leopard_glacier:"Restam cerca de 4 000 a 6 500 leopardos-das-neves na Ásia Central. Classificados como Vulneráveis, são ameaçados pela caça ilegal, pelo conflito com pastores e pela redução do habitat.",
 pangolin_blinde:"O pangolim é o mamífero selvagem mais traficado do mundo, por suas escamas e sua carne. Suas oito espécies são todas protegidas.",
 abeille_reine:"Uma abelha-rainha pode pôr até 2 000 ovos por dia. Cerca de uma em cada dez espécies de abelhas silvestres europeias está ameaçada de extinção, embora polinizem boa parte das nossas lavouras.",
 guepard_zenith:"O guepardo é o animal terrestre mais rápido, mais de 100 km/h no pico. Restam cerca de 7 000 na natureza, e ele desapareceu da maior parte da Ásia.",
 hippopotame_marais:"Restam cerca de 115 000 a 130 000 hipopótamos na África, classificados como Vulneráveis. São caçados pela carne e pelo marfim dos caninos.",
 suricate_sentinelle:"Entre os suricatos, um fica de sentinela em pé num ponto alto enquanto os outros procuram comida, e avisa com gritos diferentes conforme o perigo (águia, cobra…).",
 narval_etoile:"O «chifre» do narval é na verdade um dente, uma presa que pode chegar a 3 m e é sensível ao ambiente. Na Idade Média, era vendido como chifre de unicórnio.",
 lama_andin:"As lhamas são domesticadas nos Andes há cerca de 5 000 anos. Carregavam as caravanas muito antes de o cavalo chegar às Américas.",
 luciole_lune:"A poluição luminosa embaralha os sinais dos vaga-lumes, que trocam lampejos para se encontrar. Um estudo de 2021 estima que cerca de uma em cada sete espécies norte-americanas esteja ameaçada.",
 mammouth_ancestral:"Os últimos mamutes-lanosos viveram na ilha Wrangel, no Ártico, até cerca de 4 000 anos atrás: na época em que as pirâmides do Egito eram construídas.",
 phenix:"A fênix renasce das próprias cinzas. O mito vem do Egito antigo (a ave Benu) e da Grécia, e simboliza renovação.",
 leviathan:"O Leviatã é um monstro marinho que aparece na Bíblia (livros de Jó e dos Salmos). Seu nome virou uma palavra para tudo o que é gigantesco.",
 griffon:"O grifo, metade águia e metade leão, guardava tesouros nos relatos gregos. Segundo uma hipótese, fósseis de dinossauros do deserto de Gobi podem ter inspirado essas histórias.",
 licorne_saisons:"A primeira descrição do unicórnio vem de um médico grego, Ctésias, por volta de 400 a.C., que fala de um asno selvagem com chifre vindo da Índia. Na Idade Média, os «chifres de unicórnio» eram na verdade presas de narval.",
 hydre:"A hidra de Lerna, cujas cabeças voltam a crescer, é derrotada por Héracles nos seus doze trabalhos. Na natureza real, a hidra é um minúsculo animal de água doce capaz de regenerar o corpo inteiro.",
 ouroboros:"A serpente que morde a própria cauda é um dos símbolos mais antigos do mundo. Já aparece no Egito antigo e representa um ciclo sem fim, a vida que se renova."
};
FACTS_X.it={pegase:"Nella mitologia greca, Pegaso nacque dal sangue di Medusa quando Perseo le tagliò la testa. L'eroe Bellerofonte lo cavalcò poi per sconfiggere la Chimera. Zeus infine lo trasformò in una costellazione.",kraken:"Il Kraken nasce dai racconti dei marinai scandinavi: un mostro marino gigante che trascinava le navi sul fondo. Molti pensano che sia stato ispirato dai calamari giganti, che esistono davvero.",minotaure:"Il Minotauro, metà uomo e metà toro, era rinchiuso nel Labirinto del re Minosse, a Creta. L'eroe Teseo lo uccise grazie al filo di Arianna.",oiseau_tonnerre:"L'Uccello del Tuono è uno spirito-uccello gigante nelle tradizioni di vari popoli nativi del Nord America. Il battito delle sue ali crea il tuono e dai suoi occhi escono fulmini.",tortue_monde:"In diverse tradizioni antiche (indù, cinese, alcuni racconti dei nativi americani), il mondo poggia sul dorso di una tartaruga gigante.",qilin:"Il qilin è una creatura gentile della tradizione cinese. Si diceva che la sua comparsa annunciasse un sovrano saggio o la nascita di un saggio. È così buono che, secondo la leggenda, non calpesta nemmeno l'erba viva.",sphinx:"Nella mitologia greca, la Sfinge poneva un enigma ai viaggiatori e divorava chi sbagliava. Edipo trovò la risposta: l'Uomo, che al mattino va a quattro zampe, a mezzogiorno su due e la sera su tre.",sirene:"Nella mitologia greca, le sirene attiravano i marinai con il loro canto. Ulisse si fece legare all'albero della nave per ascoltarle senza rischi.",basilic:"Basilisco viene dal greco «piccolo re». Nei bestiari medievali uccideva con lo sguardo o con il fiato. Il suo unico nemico noto era la donnola.",wyverne:"La viverna è un drago a due zampe che si vede soprattutto nell'araldica europea, sugli stemmi. Il suo nome deriva dall'antico francese per «vipera».",cerbere:"Nella mitologia greca, Cerbero custodiva le porte degli Inferi: nessun vivo entrava e nessun morto usciva. Eracle lo catturò come dodicesima fatica.",kelpie:"Il kelpie è uno spirito dell'acqua mutaforma del folklore scozzese, spesso un cavallo vicino a laghi e fiumi. Chi sale sul suo dorso non riesce più a scendere.",dragon_celeste:"Nella tradizione cinese, il drago celeste (Tianlong) custodisce i palazzi degli dèi nel cielo.",eikthyrnir:"Nella mitologia norrena, il cervo Eikthyrnir sta sul tetto del Valhalla e mangia le foglie dell'albero Læraðr. Dalle sue corna gocciolano le acque che alimentano molti fiumi.",jormungandr:"Nella mitologia norrena, Jörmungandr è il Serpente del Mondo, così lungo da circondare tutta la Terra e mordersi la coda. Thor è destinato ad affrontarlo nel Ragnarök.",
 tigre:"Un secolo fa c'erano circa 100 000 tigri selvatici. Oggi ne restano meno di 6 000, a causa del bracconaggio e della perdita delle foreste. India e Nepal, però, hanno visto crescere le popolazioni negli ultimi anni.",
 lion:"Restano circa 20 000–25 000 leoni selvatici in Africa, un calo di circa il 40% in due decenni. La IUCN lo classifica come Vulnerabile.",
 chien:"Il cane è stato il primo animale addomesticato dall'uomo, almeno 15 000 anni fa, ben prima dell'agricoltura.",
 chat:"I gatti sono stati addomesticati circa 10 000 anni fa nel Vicino Oriente, probabilmente perché cacciavano i roditori vicino ai primi depositi di granaglie.",
 boeuf:"I bovini discendono dall'uro, il cui ultimo esemplare morì in Polonia nel 1627. Oggi nel mondo ci sono più di un miliardo di bovini.",
 renard:"La volpe rossa è il carnivoro selvatico più diffuso al mondo: dall'Artico al Medio Oriente, e persino in città.",
 ours:"L'orso bruno è scomparso da molte zone dell'Europa occidentale. Grazie alla protezione e alle reintroduzioni (come nei Pirenei) sta tornando, ma alcune popolazioni restano fragilissime.",
 loup:"Sterminato quasi ovunque nell'Europa occidentale nel XX secolo, il lupo è tornato in Francia nel 1992 dall'Italia, attraverso il massiccio del Mercantour.",
 aigle:"Negli Stati Uniti l'aquila di mare testabianca era scesa a meno di 500 coppie nidificanti nel 1963, colpita soprattutto dal pesticida DDT. Dopo il divieto, oggi le coppie sono più di 70 000.",
 serpent:"Esistono circa 3 900 specie di serpenti e solo una minoranza è pericolosa. Eppure i morsi causano ancora decine di migliaia di morti all'anno, soprattutto in Asia meridionale e in Africa.",
 herisson:"Il riccio europeo è stato classificato Quasi Minacciato dalla IUCN nel 2024. Strade, tagliaerba robot, pesticidi e siepi scomparse ne fanno crollare le popolazioni.",
 poulpe:"Il polpo ha tre cuori e il sangue blu. Circa due terzi dei suoi neuroni sono nei tentacoli, che possono in parte «decidere» da soli.",
 chauve_souris:"I pipistrelli sono circa un quinto di tutte le specie di mammiferi. Una malattia fungina, la sindrome del naso bianco, ne ha uccisi milioni in Nord America.",
 dauphin:"Il delfino del fiume Azzurro (baiji) è stato dichiarato funzionalmente estinto nel 2006, vittima di pesca, traffico fluviale e inquinamento: uno dei primi grandi cetacei perduti per colpa dell'uomo.",
 tortue:"Sei delle sette specie di tartarughe marine sono classificate come minacciate. Reti da pesca, plastica e illuminazione delle spiagge (che disorienta i piccoli) sono tra le cause.",
 rhinoceros:"Restano circa 27 000 rinoceronti al mondo, contro circa 500 000 un secolo fa. Sono bracconati per il corno, che è solo cheratina, come le nostre unghie.",
 crabe:"Ogni anno decine di milioni di granchi rossi dell'isola di Natale migrano dalla foresta al mare per riprodursi: una delle più grandi migrazioni di animali terrestri. Il granchio ragno gigante giapponese può superare i 3,5 m di apertura.",
 requin:"Circa il 37% delle specie di squali e razze è minacciato di estinzione. Si stima che ogni anno vengano pescati decine di milioni di squali, spesso per le pinne.",
 crocodile:"La linea dei coccodrilli è sopravvissuta all'estinzione che spazzò via i dinosauri. Il coccodrillo marino australiano, cacciato fino a circa 3 000 esemplari negli anni '70, è risalito a oltre 100 000.",
 elephant:"Nel 2021 la IUCN ha classificato l'elefante di savana africano In Pericolo e l'elefante di foresta In Pericolo Critico. Gli elefanti di foresta hanno perso oltre l'80% della popolazione in tre decenni, soprattutto per il bracconaggio dell'avorio.",
 hibou:"Gufi e civette volano quasi senza rumore grazie alle penne frangiate. Vivono su tutti i continenti tranne l'Antartide.",
 gorille:"I gorilla di montagna sono passati da In Pericolo Critico a In Pericolo nel 2018 dopo decenni di protezione: ne restano poco più di 1 000. Gli altri gorilla sono ancora minacciati da bracconaggio, malattie e deforestazione.",
 paon:"Il pavone blu è l'uccello nazionale dell'India. Suo cugino, il pavone verde del Sud-est asiatico, è In Pericolo. Solo il maschio ha il famoso strascico, fatto di penne e non della coda vera e propria.",
 renard_voyageur:"Una volpe artica ha percorso circa 3 500 km in 76 giorni, dalle Svalbard al Canada attraversando il ghiaccio marino: uno dei viaggi più lunghi mai tracciati per un animale di quella taglia.",
 hibou_sage:"L'allocco di Lapponia sente un'arvicola nascosta sotto più di 50 cm di neve e si tuffa per afferrarla.",
 loup_gardien:"Nel 1995 i lupi sono stati reintrodotti nel parco di Yellowstone, 70 anni dopo la loro scomparsa. Il loro ritorno ha cambiato il comportamento degli alci, poi la vegetazione e persino alcuni fiumi: un famoso esempio di «cascata trofica».",
 blaireau_sorciere:"Le tane dei tassi sono scavate e ampliate da generazioni successive: alcune sono occupate da più di un secolo.",
 lapin_citrouille:"Il coniglio selvatico europeo è classificato In Pericolo nella penisola iberica (IUCN, 2018) a causa di malattie (mixomatosi e malattia emorragica virale). E la lince iberica dipende quasi interamente da lui per nutrirsi.",
 serpent_squelette:"Alcuni serpenti hanno fino a 400 vertebre, ciascuna con un paio di costole. Niente zampe, ma uno scheletro da contorsionista.",
 renne_grelot:"Le mandrie di renne e caribù della tundra sono calate di circa il 56% in due-tre decenni, con un clima che si scalda e sconvolge il loro cibo.",
 ours_pere_noel:"Restano circa 26 000 orsi polari, classificati Vulnerabili. Dipendono dal ghiaccio marino per cacciare le foche, e ogni estate si ritira.",
 pingouin_bonnet:"Il pinguino imperatore è classificato Quasi Minacciato. Nel 2022 e 2023 quasi tutti i pulcini di diverse colonie del mare di Bellingshausen sono morti: il ghiaccio marino si è spezzato prima che sapessero nuotare.",
 dragon_imperial:"Nella Cina imperiale il drago a cinque artigli era riservato all'imperatore. Il drago cinese, legato all'acqua e alla pioggia, porta fortuna, al contrario del drago occidentale.",
 belier_jade:"La pecora è tra i primi animali addomesticati, circa 10 000 anni fa nel Vicino Oriente. Nello zodiaco cinese capra, pecora e montone condividono lo stesso segno.",
 carpe_koi:"I koi sono carpe allevate in Giappone dall'Ottocento per i loro colori. Possono vivere oltre 50 anni, e il loro nome evoca anche la fortuna in Giappone.",
 cygne_cupidon:"I cigni reali formano coppie che spesso restano unite tutta la vita, da cui il simbolismo romantico.",
 loutre_main_dans_la_main:"Le lontre marine si tengono per la zampa mentre dormono per non allontanarsi alla deriva. Cacciate per la pelliccia, nel 1911 erano scese sotto le 2 000; oggi sono decine di migliaia.",
 perruche_inseparable:"Gli inseparabili devono il nome al forte legame tra i partner. Esistono nove specie, tutte originarie di Africa e Madagascar.",
 leopard_glacier:"Restano circa 4 000–6 500 leopardi delle nevi in Asia centrale. Classificati Vulnerabili, sono minacciati da bracconaggio, conflitti con i pastori e riduzione dell'habitat.",
 pangolin_blinde:"Il pangolino è il mammifero selvatico più trafficato al mondo, per le squame e la carne. Tutte e otto le sue specie sono protette.",
 abeille_reine:"Un'ape regina può deporre fino a 2 000 uova al giorno. Circa una specie di ape selvatica europea su dieci è minacciata di estinzione, eppure impollinano gran parte delle nostre colture.",
 guepard_zenith:"Il ghepardo è l'animale terrestre più veloce, oltre 100 km/h di punta. Ne restano circa 7 000 allo stato selvatico ed è scomparso da gran parte dell'Asia.",
 hippopotame_marais:"Restano circa 115 000–130 000 ippopotami in Africa, classificati Vulnerabili. Sono cacciati per la carne e per l'avorio dei canini.",
 suricate_sentinelle:"Tra i suricati, uno fa da sentinella in piedi su un punto alto mentre gli altri cercano cibo, e avvisa con grida diverse a seconda del pericolo (aquila, serpente…).",
 narval_etoile:"Il «corno» del narvalo è in realtà un dente, una zanna che può raggiungere i 3 m ed è sensibile all'ambiente. Nel Medioevo veniva venduto come corno di unicorno.",
 lama_andin:"I lama sono addomesticati sulle Ande da circa 5 000 anni. Portavano i carichi delle carovane ben prima che il cavallo arrivasse nelle Americhe.",
 luciole_lune:"L'inquinamento luminoso disturba i segnali delle lucciole, che si scambiano lampi per ritrovarsi. Uno studio del 2021 stima che circa una specie nordamericana su sette sia minacciata.",
 mammouth_ancestral:"Gli ultimi mammut lanosi vissero sull'isola di Wrangel, nell'Artico, fino a circa 4 000 anni fa: all'epoca in cui si costruivano le piramidi d'Egitto.",
 phenix:"La fenice rinasce dalle proprie ceneri. Il mito viene dall'antico Egitto (l'uccello Bennu) e dalla Grecia, e simboleggia la rinascita.",
 leviathan:"Il Leviatano è un mostro marino che compare nella Bibbia (libri di Giobbe e dei Salmi). Il suo nome è diventato una parola per tutto ciò che è gigantesco.",
 griffon:"Il grifone, metà aquila e metà leone, custodiva tesori nei racconti greci. Secondo un'ipotesi, i fossili di dinosauri del deserto del Gobi potrebbero aver ispirato quei racconti.",
 licorne_saisons:"La prima descrizione dell'unicorno è di un medico greco, Ctesia, verso il 400 a.C., che parla di un asino selvatico cornuto proveniente dall'India. Nel Medioevo i «corni di unicorno» erano in realtà zanne di narvalo.",
 hydre:"L'idra di Lerna, con teste che ricrescono, viene sconfitta da Eracle nelle sue dodici fatiche. In natura l'idra è un minuscolo animale d'acqua dolce capace di rigenerare tutto il corpo.",
 ouroboros:"Il serpente che si morde la coda è uno dei simboli più antichi del mondo. Compare già nell'antico Egitto e rappresenta un ciclo senza fine, la vita che si rinnova."
};
FACTS_X.de={pegase:"In der griechischen Mythologie entsprang Pegasus dem Blut der Medusa, als Perseus sie enthauptete. Der Held Bellerophon ritt ihn später, um die Chimäre zu besiegen. Zeus verwandelte ihn schließlich in ein Sternbild.",kraken:"Der Kraken stammt aus den Erzählungen skandinavischer Seeleute: ein riesiges Meeresungeheuer, das Schiffe in die Tiefe ziehen soll. Viele glauben, dass echte Riesenkalmare ihn inspiriert haben.",minotaure:"Der Minotaurus, halb Mensch und halb Stier, war im Labyrinth des Königs Minos auf Kreta eingesperrt. Der Held Theseus tötete ihn mithilfe von Ariadnes Faden.",oiseau_tonnerre:"Der Donnervogel ist in den Überlieferungen mehrerer indigener Völker Nordamerikas ein riesiger Geistervogel. Sein Flügelschlag erzeugt den Donner, und aus seinen Augen zucken Blitze.",tortue_monde:"In mehreren alten Überlieferungen (hinduistisch, chinesisch, einige indigene Erzählungen Amerikas) ruht die Welt auf dem Rücken einer Riesenschildkröte.",qilin:"Das Qilin ist ein sanftes Wesen der chinesischen Überlieferung. Sein Erscheinen soll einen weisen Herrscher oder die Geburt eines Weisen angekündigt haben. Es soll so gütig sein, dass es nicht einmal lebendes Gras betritt.",sphinx:"In der griechischen Mythologie stellte die Sphinx Reisenden ein Rätsel und verschlang, wer scheiterte. Ödipus fand die Antwort: der Mensch, der morgens auf vier Beinen krabbelt, mittags auf zwei geht und abends auf dreien.",sirene:"In der griechischen Mythologie lockten Sirenen Seeleute mit ihrem Gesang an. Odysseus ließ sich an den Mast seines Schiffes binden, um ihnen gefahrlos zu lauschen.",basilic:"Basilisk kommt vom griechischen Wort für „kleiner König“. In mittelalterlichen Bestiarien tötete er mit seinem Blick oder Atem. Sein einziger bekannter Feind war das Wiesel.",wyverne:"Die Wyvern ist ein zweibeiniger Drache, der vor allem in der europäischen Heraldik auf Wappen vorkommt. Ihr Name stammt vom altfranzösischen Wort für „Viper“.",cerbere:"In der griechischen Mythologie bewachte Kerberos die Tore der Unterwelt: Kein Lebender kam hinein, kein Toter heraus. Herakles fing ihn bei seiner zwölften Arbeit ein.",kelpie:"Der Kelpie ist ein gestaltwandelnder Wassergeist der schottischen Folklore, oft ein Pferd an Seen und Flüssen. Wer auf seinen Rücken steigt, kommt nicht mehr herunter.",dragon_celeste:"In der chinesischen Überlieferung bewacht der Himmelsdrache (Tianlong) die Paläste der Götter am Himmel.",eikthyrnir:"In der nordischen Mythologie steht der Hirsch Eikthyrnir auf dem Dach von Walhall und frisst die Blätter des Baumes Læraðr. Von seinem Geweih tropft das Wasser, das viele Flüsse speist.",jormungandr:"In der nordischen Mythologie ist Jörmungandr die Midgardschlange, so lang, dass sie die ganze Welt umspannt und sich in den eigenen Schwanz beißt. Thor ist dazu bestimmt, sie im Ragnarök zu bekämpfen.",
 tigre:"Vor einem Jahrhundert gab es etwa 100 000 wilde Tiger. Heute sind es weniger als 6 000, wegen Wilderei und dem Verlust ihrer Wälder. Indien und Nepal verzeichneten in den letzten Jahren dennoch wieder steigende Bestände.",
 lion:"In Afrika leben noch etwa 20 000–25 000 wilde Löwen, ein Rückgang von rund 40 % in zwei Jahrzehnten. Die IUCN stuft ihn als gefährdet ein.",
 chien:"Der Hund war das erste vom Menschen domestizierte Tier, vor mindestens 15 000 Jahren, lange vor der Landwirtschaft.",
 chat:"Katzen wurden vor etwa 10 000 Jahren im Nahen Osten domestiziert, wahrscheinlich weil sie bei den ersten Getreidelagern Nagetiere jagten.",
 boeuf:"Rinder stammen vom Auerochsen ab, dessen letztes Tier 1627 in Polen starb. Heute gibt es weltweit über eine Milliarde Rinder.",
 renard:"Der Rotfuchs ist das am weitesten verbreitete wilde Raubtier der Welt: von der Arktis bis in den Nahen Osten, sogar in Städten.",
 ours:"Der Braunbär ist aus vielen Teilen Westeuropas verschwunden. Dank Schutz und Wiederansiedlungen (etwa in den Pyrenäen) kehrt er zurück, doch manche Bestände bleiben sehr fragil.",
 loup:"Im 20. Jahrhundert aus dem größten Teil Westeuropas ausgerottet, kehrte der Wolf 1992 aus Italien über das Mercantour-Massiv nach Frankreich zurück.",
 aigle:"In den USA fiel der Weißkopfseeadler 1963 auf unter 500 Brutpaare, vor allem wegen des Pestizids DDT. Nach dessen Verbot gibt es heute über 70 000 Paare.",
 serpent:"Es gibt etwa 3 900 Schlangenarten, nur eine Minderheit ist gefährlich. Trotzdem fordern Bisse noch immer Zehntausende Todesopfer pro Jahr, vor allem in Südasien und Afrika.",
 herisson:"Der Europäische Igel wurde 2024 von der IUCN als potenziell gefährdet eingestuft. Straßen, Mähroboter, Pestizide und verschwundene Hecken lassen seine Bestände sinken.",
 poulpe:"Ein Oktopus hat drei Herzen und blaues Blut. Etwa zwei Drittel seiner Neuronen sitzen in den Armen, die teilweise selbst «entscheiden» können.",
 chauve_souris:"Fledermäuse machen etwa ein Fünftel aller Säugetierarten aus. Eine Pilzkrankheit, das Weißnasensyndrom, hat in Nordamerika Millionen von ihnen getötet.",
 dauphin:"Der Jangtse-Flussdelfin (Baiji) wurde 2006 für funktional ausgestorben erklärt, ein Opfer von Fischerei, Schiffsverkehr und Verschmutzung: einer der ersten großen Wale, die durch den Menschen verloren gingen.",
 tortue:"Sechs der sieben Meeresschildkrötenarten gelten als bedroht. Fischernetze, Plastik und Strandbeleuchtung (die Jungtiere desorientiert) gehören zu den Ursachen.",
 rhinoceros:"Weltweit gibt es noch etwa 27 000 Nashörner, vor einem Jahrhundert waren es rund 500 000. Sie werden wegen ihres Horns gewildert, das nur aus Keratin besteht, wie unsere Fingernägel.",
 crabe:"Jedes Jahr wandern Dutzende Millionen Weihnachtsinsel-Rotkrabben vom Wald zum Meer, um sich fortzupflanzen: eine der größten Wanderungen von Landtieren. Die Japanische Riesenkrabbe kann über 3,5 m Spannweite erreichen.",
 requin:"Etwa 37 % der Hai- und Rochenarten sind vom Aussterben bedroht. Schätzungen zufolge werden jedes Jahr Dutzende Millionen Haie gefangen, oft wegen ihrer Flossen.",
 crocodile:"Die Linie der Krokodile überlebte das Aussterben, das die Dinosaurier auslöschte. Das Australische Leistenkrokodil, in den 1970ern bis auf etwa 3 000 Tiere gejagt, hat sich auf über 100 000 erholt.",
 elephant:"2021 stufte die IUCN den Afrikanischen Savannenelefanten als stark gefährdet und den Waldelefanten als vom Aussterben bedroht ein. Waldelefanten verloren in drei Jahrzehnten über 80 % ihres Bestands, vor allem durch Elfenbein-Wilderei.",
 hibou:"Eulen fliegen dank ihrer gefransten Federn fast lautlos. Man findet sie auf allen Kontinenten außer der Antarktis.",
 gorille:"Berggorillas wurden 2018 nach Jahrzehnten des Schutzes von «vom Aussterben bedroht» auf «stark gefährdet» herabgestuft: Es gibt noch etwas über 1 000. Andere Gorillas bleiben durch Wilderei, Krankheiten und Abholzung bedroht.",
 paon:"Der Blaue Pfau ist Indiens Nationalvogel. Sein Verwandter, der Grüne Pfau Südostasiens, ist stark gefährdet. Nur das Männchen hat die berühmte Schleppe, die aus Federn besteht, nicht aus dem Schwanz selbst.",
 renard_voyageur:"Ein Polarfuchs legte in 76 Tagen rund 3 500 km zurück, von Spitzbergen nach Kanada über das Meereis: eine der längsten je verfolgten Reisen eines Tieres dieser Größe.",
 hibou_sage:"Der Bartkauz kann eine unter über 50 cm Schnee versteckte Wühlmaus hören und kopfüber hineinstoßen, um sie zu fangen.",
 loup_gardien:"1995 wurden im Yellowstone-Nationalpark Wölfe wiederangesiedelt, 70 Jahre nach ihrem Verschwinden. Ihre Rückkehr veränderte das Verhalten der Hirsche, dann die Vegetation und sogar manche Flüsse: ein berühmtes Beispiel für eine «trophische Kaskade».",
 blaireau_sorciere:"Dachsbauten werden von aufeinanderfolgenden Generationen gegraben und erweitert: manche sind seit über einem Jahrhundert bewohnt.",
 lapin_citrouille:"Das Wildkaninchen gilt auf der Iberischen Halbinsel als stark gefährdet (IUCN, 2018), wegen Krankheiten (Myxomatose und Chinaseuche). Der Iberische Luchs ist fast vollständig auf es als Nahrung angewiesen.",
 serpent_squelette:"Manche Schlangen haben bis zu 400 Wirbel, jeder mit einem Rippenpaar. Keine Beine, aber ein Schlangenmenschen-Skelett.",
 renne_grelot:"Die Rentier- und Karibuherden der Tundra sind in zwei bis drei Jahrzehnten um etwa 56 % geschrumpft, in einem sich erwärmenden Klima, das ihre Nahrung durcheinanderbringt.",
 ours_pere_noel:"Es gibt noch etwa 26 000 Eisbären, als gefährdet eingestuft. Sie sind auf Meereis angewiesen, um Robben zu jagen, und es schwindet jeden Sommer.",
 pingouin_bonnet:"Der Kaiserpinguin gilt als potenziell gefährdet. 2022 und 2023 starben fast alle Küken mehrerer Kolonien in der Bellingshausensee: Das Meereis brach auf, bevor sie schwimmen konnten.",
 dragon_imperial:"Im kaiserlichen China war der fünfklauige Drache dem Kaiser vorbehalten. Der chinesische Drache, mit Wasser und Regen verbunden, bringt Glück, anders als der westliche Drache.",
 belier_jade:"Das Schaf gehört zu den ersten domestizierten Tieren, vor etwa 10 000 Jahren im Nahen Osten. Im chinesischen Tierkreis teilen sich Ziege, Schaf und Widder ein Zeichen.",
 carpe_koi:"Kois sind Karpfen, die in Japan seit dem 19. Jahrhundert wegen ihrer Farben gezüchtet werden. Sie können über 50 Jahre alt werden, und ihr Name steht in Japan auch für Glück.",
 cygne_cupidon:"Höckerschwäne bilden Paare, die oft ein Leben lang zusammenbleiben, daher ihre romantische Symbolik.",
 loutre_main_dans_la_main:"Seeotter halten beim Schlafen Pfoten, um nicht auseinanderzutreiben. Wegen ihres Fells gejagt, sank ihr Bestand 1911 unter 2 000; heute sind es Zehntausende.",
 perruche_inseparable:"Unzertrennliche verdanken ihren Namen der engen Bindung zwischen den Partnern. Es gibt neun Arten, alle stammen aus Afrika und Madagaskar.",
 leopard_glacier:"In Zentralasien gibt es noch etwa 4 000–6 500 Schneeleoparden. Als gefährdet eingestuft, werden sie durch Wilderei, Konflikte mit Hirten und schrumpfenden Lebensraum bedroht.",
 pangolin_blinde:"Das Schuppentier ist das am meisten gehandelte wilde Säugetier der Welt, wegen seiner Schuppen und seines Fleisches. Alle acht Arten sind geschützt.",
 abeille_reine:"Eine Bienenkönigin kann bis zu 2 000 Eier pro Tag legen. Etwa eine von zehn europäischen Wildbienenarten ist vom Aussterben bedroht, obwohl sie einen großen Teil unserer Kulturen bestäuben.",
 guepard_zenith:"Der Gepard ist das schnellste Landtier, über 100 km/h in der Spitze. Etwa 7 000 leben noch in freier Wildbahn, und er ist aus dem größten Teil Asiens verschwunden.",
 hippopotame_marais:"In Afrika gibt es noch etwa 115 000–130 000 Flusspferde, als gefährdet eingestuft. Sie werden wegen des Fleisches und des Elfenbeins ihrer Eckzähne gejagt.",
 suricate_sentinelle:"Bei Erdmännchen hält eines auf einem erhöhten Punkt Wache, während die anderen Nahrung suchen, und warnt je nach Gefahr (Adler, Schlange…) mit unterschiedlichen Rufen.",
 narval_etoile:"Das «Horn» des Narwals ist in Wahrheit ein Zahn, ein Stoßzahn, der bis zu 3 m lang werden kann und empfindlich auf seine Umgebung reagiert. Im Mittelalter wurde er als Einhornhorn verkauft.",
 lama_andin:"Lamas werden in den Anden seit etwa 5 000 Jahren domestiziert. Sie trugen die Lasten der Karawanen, lange bevor das Pferd nach Amerika kam.",
 luciole_lune:"Lichtverschmutzung stört die Signale der Glühwürmchen, die sich mit Lichtblitzen finden. Eine Studie von 2021 schätzt, dass etwa eine von sieben nordamerikanischen Arten bedroht ist.",
 mammouth_ancestral:"Die letzten Wollhaarmammuts lebten bis vor etwa 4 000 Jahren auf der arktischen Wrangelinsel: zu der Zeit, als die Pyramiden Ägyptens gebaut wurden.",
 phenix:"Der Phönix steigt aus seiner Asche wieder auf. Der Mythos stammt aus dem alten Ägypten (der Bennu-Vogel) und aus Griechenland und steht für Erneuerung.",
 leviathan:"Der Leviathan ist ein Meeresungeheuer aus der Bibel (Bücher Hiob und Psalmen). Sein Name ist zum Wort für alles Gigantische geworden.",
 griffon:"Der Greif, halb Adler, halb Löwe, bewachte in griechischen Erzählungen Schätze. Einer Hypothese zufolge könnten Dinosaurierfossilien aus der Wüste Gobi diese Erzählungen inspiriert haben.",
 licorne_saisons:"Die erste Beschreibung des Einhorns stammt von einem griechischen Arzt, Ktesias, um 400 v. Chr., der von einem gehörnten Wildesel aus Indien berichtet. Im Mittelalter waren «Einhornhörner» in Wahrheit Narwalzähne.",
 hydre:"Die Lernäische Hydra, deren Köpfe nachwachsen, wird von Herakles in seinen zwölf Taten besiegt. In der Natur ist die Hydra ein winziges Süßwassertier, das seinen ganzen Körper regenerieren kann.",
 ouroboros:"Die Schlange, die sich in den Schwanz beißt, ist eines der ältesten Symbole der Welt. Schon im alten Ägypten zu finden, steht sie für einen endlosen Kreislauf, das sich erneuernde Leben."
};
FACTS_X.nl={pegase:"In de Griekse mythologie ontsprong Pegasus aan het bloed van Medusa toen Perseus haar onthoofdde. De held Bellerophon reed hem later om de Chimaera te verslaan. Zeus veranderde hem uiteindelijk in een sterrenbeeld.",kraken:"De Kraken komt uit de verhalen van Scandinavische zeelieden: een gigantisch zeemonster dat schepen naar de bodem trok. Velen denken dat echte reuzeninktvissen hem inspireerden.",minotaure:"De Minotaurus, half mens en half stier, zat opgesloten in het Labyrint van koning Minos op Kreta. De held Theseus doodde hem met behulp van Ariadnes draad.",oiseau_tonnerre:"De Dondervogel is een gigantische geestvogel in de tradities van verschillende inheemse volken van Noord-Amerika. Zijn vleugelslag maakt de donder en uit zijn ogen schieten bliksemschichten.",tortue_monde:"In verschillende oude tradities (hindoeïstisch, Chinees, sommige verhalen van inheemse Amerikanen) rust de wereld op de rug van een gigantische schildpad.",qilin:"De qilin is een zachtaardig wezen uit de Chinese traditie. Zijn verschijning kondigde volgens de verhalen een wijze heerser of de geboorte van een wijze aan. Hij is zo goed dat hij naar verluidt zelfs geen levend gras vertrapt.",sphinx:"In de Griekse mythologie stelde de Sfinx reizigers een raadsel en verslond wie faalde. Oedipus vond het antwoord: de mens, die 's ochtends op vier poten kruipt, 's middags op twee loopt en 's avonds op drie.",sirene:"In de Griekse mythologie lokten sirenen zeelieden met hun zang. Odysseus liet zich aan de mast van zijn schip binden om veilig te kunnen luisteren.",basilic:"Basilisk komt van het Griekse woord voor \"kleine koning\". In middeleeuwse bestiaria doodde hij met zijn blik of adem. Zijn enige bekende vijand was de wezel.",wyverne:"De wyvern is een tweepotige draak die vooral voorkomt in de Europese heraldiek, op wapenschilden. De naam komt van het Oudfranse woord voor \"adder\".",cerbere:"In de Griekse mythologie bewaakte Cerberus de poorten van de Onderwereld: geen levende kwam binnen, geen dode kwam eruit. Heracles ving hem als zijn twaalfde werk.",kelpie:"De kelpie is een van gedaante wisselende watergeest uit de Schotse folklore, vaak een paard bij meren en rivieren. Wie op zijn rug klimt, kan er niet meer af.",dragon_celeste:"In de Chinese traditie bewaakt de hemelse draak (Tianlong) de paleizen van de goden in de hemel.",eikthyrnir:"In de Noordse mythologie staat het hert Eikthyrnir op het dak van Walhalla en eet de bladeren van de boom Læraðr. Van zijn gewei druipt het water dat vele rivieren voedt.",jormungandr:"In de Noordse mythologie is Jörmungandr de Wereldslang, zo lang dat hij de hele wereld omringt en in zijn eigen staart bijt. Thor is voorbestemd hem te bevechten tijdens Ragnarök.",
tigre:"Een eeuw geleden leefden er ongeveer 100.000 wilde tijgers. Nu zijn het er minder dan 6.000, door stroperij en verlies van leefgebied. India en Nepal zien hun aantallen de laatste jaren toch weer stijgen.",
lion:"In Afrika leven nog zo'n 20.000–25.000 wilde leeuwen, ongeveer 40% minder in twintig jaar. De IUCN noemt hem Kwetsbaar.",
chien:"De hond was het eerste door de mens gedomesticeerde dier, minstens 15.000 jaar geleden, ruim voor de landbouw.",
chat:"Katten werden zo'n 10.000 jaar geleden in het Nabije Oosten gedomesticeerd, waarschijnlijk omdat ze jaagden op knaagdieren bij de eerste graanvoorraden.",
boeuf:"Runderen stammen af van de oeros, waarvan het laatste exemplaar in 1627 in Polen stierf. Wereldwijd zijn er nu meer dan een miljard runderen.",
renard:"De rode vos is het meest wijdverspreide wilde roofdier ter wereld: van het noordpoolgebied tot het Midden-Oosten, zelfs in steden.",
ours:"De bruine beer verdween uit grote delen van West-Europa. Dankzij bescherming en herintroducties (zoals in de Pyreneeën) keert hij terug, al blijven sommige populaties erg kwetsbaar.",
loup:"In de 20e eeuw bijna overal in West-Europa uitgeroeid, keerde de wolf in 1992 vanuit Italië via het Mercantour-gebergte terug in Frankrijk.",
aigle:"In de Verenigde Staten zakte de zeearend in 1963 tot minder dan 500 nestelende paren, onder meer door het pesticide DDT. Na het verbod zijn het er nu meer dan 70.000.",
serpent:"Er bestaan zo'n 3.900 slangensoorten en slechts een minderheid is gevaarlijk. Toch eisen slangenbeten jaarlijks tienduizenden doden, vooral in Zuid-Azië en Afrika.",
