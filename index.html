 ein.","nl":"Wendbaar en onvoorspelbaar, slaat snel toe maar kan geen klap incasseren.","pl":"Zwinny i nieprzewidywalny, uderza szybko, ale nie znosi ciosów.","ru":"Ловкий и непредсказуемый, бьёт быстро, но не держит удар.","tr":"Çevik ve öngörülemez, hızlı vurur ama darbe kaldıramaz."},"boeuf":{"fr":"Un mur vivant. Peu d'attaque mais presque indestructible.","es":"Un muro viviente. Poco ataque, pero casi indestructible.","pt":"Uma parede viva. Pouco ataque, mas quase indestrutível.","it":"Un muro vivente. Poco attacco ma quasi indistruttibile.","de":"Eine lebende Mauer. Wenig Angriff, aber nahezu unzerstörbar.","nl":"Een levende muur. Weinig aanval maar bijna onverwoestbaar.","pl":"Żywy mur. Mało ataku, ale prawie niezniszczalny.","ru":"Живая стена. Слабая атака, но почти неуязвим.","tr":"Yaşayan bir duvar. Saldırısı az ama neredeyse yıkılmaz."},"renard":{"fr":"Rusé et insaisissable, compte sur les astuces plutôt que sur la force brute.","es":"Astuto y escurridizo, confía en los trucos más que en la fuerza bruta.","pt":"Astuto e escorregadio, conta com truques mais do que com força bruta.","it":"Astuto e sfuggente, si affida ai trucchi più che alla forza bruta.","de":"Listig und flink, setzt auf Tricks statt auf rohe Gewalt.","nl":"Sluw en ongrijpbaar, vertrouwt op trucs in plaats van brute kracht.","pl":"Przebiegły i nieuchwytny, polega na sztuczkach, nie na brutalnej sile.","ru":"Хитрый и неуловимый, полагается на уловки, а не на грубую силу.","tr":"Kurnaz ve kaçamak, kaba güç yerine hilelere güvenir."},"ours":{"fr":"Force brute et endurance : frappe fort et encaisse presque tout.","es":"Fuerza bruta y resistencia: golpea fuerte y aguanta casi todo.","pt":"Força bruta e resistência: bate forte e aguenta quase tudo.","it":"Forza bruta e resistenza: colpisce duro e incassa quasi tutto.","de":"Rohe Kraft und Ausdauer: schlägt hart zu und steckt fast alles weg.","nl":"Brute kracht en uithoudingsvermogen: slaat hard en incasseert bijna alles.","pl":"Brutalna siła i wytrzymałość: mocno uderza i znosi prawie wszystko.","ru":"Грубая сила и выносливость: бьёт сильно и переносит почти всё.","tr":"Kaba güç ve dayanıklılık: sert vurur, hemen her şeye dayanır."},"loup":{"fr":"Chasseur de meute : ne brille jamais seul, mais porte l'équipe.","es":"Cazador de manada: nunca brilla solo, pero lleva al equipo.","pt":"Caçador de matilha: nunca brilha sozinho, mas carrega a equipa.","it":"Cacciatore di branco: non brilla mai da solo, ma porta la squadra.","de":"Rudeljäger: glänzt nie allein, trägt aber das Team.","nl":"Roedeljager: schittert nooit alleen, maar draagt het team.","pl":"Łowca stadny: nigdy nie błyszczy sam, ale niesie zespół.","ru":"Охотник стаи: никогда не блистает в одиночку, но тянет команду.","tr":"Sürü avcısı: tek başına parlamaz ama takımı taşır."},"aigle":{"fr":"Prédateur aérien : dégâts explosifs, mais le moindre coup le met en danger.","es":"Depredador aéreo: daño explosivo, pero cualquier golpe lo pone en peligro.","pt":"Predador aéreo: dano explosivo, mas qualquer golpe o põe em perigo.","it":"Predatore aereo: danni esplosivi, ma ogni colpo lo mette in pericolo.","de":"Luftraubtier: explosiver Schaden, aber jeder Treffer bringt es in Gefahr.","nl":"Luchtjager: explosieve schade, maar elke treffer brengt hem in gevaar.","pl":"Drapieżnik z powietrza: wybuchowe obrażenia, ale każdy cios stawia go w niebezpieczeństwie.","ru":"Воздушный хищник: взрывной урон, но любой удар ставит его под угрозу.","tr":"Havadan avcı: patlayıcı hasar, ama her darbe onu tehlikeye sokar."},"serpent":{"fr":"Venimeux et précis : le frappeur le plus mortel de l'arène, mais survit à peine aux ripostes.","es":"Venenoso y preciso: el atacante más letal de la arena, pero apenas sobrevive a una réplica.","pt":"Venenoso e preciso: o atacante mais mortífero da arena, mas mal sobrevive à resposta.","it":"Velenoso e preciso: l'attaccante più letale dell'arena, ma sopravvive a malapena ai contraccolpi.","de":"Giftig und präzise: der tödlichste Angreifer der Arena, überlebt aber kaum einen Gegentreffer.","nl":"Giftig en precies: de dodelijkste aanvaller van de arena, maar overleeft een tegenaanval amper.","pl":"Jadowity i precyzyjny: najgroźniejszy napastnik areny, ale ledwo przeżywa kontrę.","ru":"Ядовитый и точный: самый смертоносный атакующий арены, но едва переживает ответный удар.","tr":"Zehirli ve isabetli: arenanın en ölümcül vurucusu, ama karşılık darbeye zor dayanır."},"herisson":{"fr":"Une forteresse compacte : se roule en boule hérissée presque à chaque tour, et laisse rarement passer un coup proprement.","es":"Una fortaleza compacta: se enrolla en una bola de púas casi cada turno y rara vez deja pasar un golpe limpio.","pt":"Uma fortaleza compacta: enrola-se numa bola de espinhos quase todos os turnos e raramente deixa passar um golpe limpo.","it":"Una fortezza compatta: si arrotola in una palla di spine quasi a ogni turno e raramente lascia passare un colpo pulito.","de":"Eine kompakte Festung: rollt sich fast jede Runde zur Stachelkugel zusammen und lässt selten einen Treffer sauber durch.","nl":"Een compacte vesting: rolt bijna elke beurt op tot een stekelbal en laat zelden een treffer zuiver door.","pl":"Zwarta forteca: niemal co turę zwija się w kolczastą kulę i rzadko przepuszcza cios czysto.","ru":"Компактная крепость: почти каждый ход сворачивается в колючий шар и редко пропускает удар чисто.","tr":"Kompakt bir kale: neredeyse her tur dikenli bir topa dönüşür ve bir darbeyi nadiren temiz geçirir."},"poulpe":{"fr":"Vif d'esprit et adaptable : trouve la bonne réponse à chaque ouverture, et récupère remarquablement vite quand il est blessé.","es":"De mente aguda y adaptable: encuentra la respuesta justa a cada hueco y se recupera con rapidez notable cuando lo hieren.","pt":"Perspicaz e adaptável: encontra a resposta certa para cada abertura e recupera de forma notável quando ferido.","it":"Sveglio e adattabile: trova la risposta giusta a ogni apertura e si riprende in modo notevole quando è ferito.","de":"Scharfsinnig und anpassungsfähig: findet auf jede Lücke die richtige Antwort und erholt sich bemerkenswert schnell.","nl":"Scherpzinnig en aanpasbaar: vindt het juiste antwoord op elke opening en herstelt opmerkelijk snel als hij gewond is.","pl":"Bystry i zdolny do adaptacji: znajduje właściwą odpowiedź na każdą lukę i szybko dochodzi do siebie po ranach.","ru":"Сообразительный и приспосабливающийся: находит верный ответ на любую лазейку и удивительно быстро восстанавливается после ран.","tr":"Çabuk kavrayan ve uyumlu: her açıklığa doğru cevabı bulur ve yaralandığında şaşırtıcı hızda toparlanır."},"chauve_souris":{"fr":"Erratique et acharnée : frappe sans cesse pour des dégâts modestes plutôt que de viser un gros coup.","es":"Errático e incansable: golpea sin parar con daño modesto en lugar de buscar un gran golpe.","pt":"Errático e implacável: ataca constantemente com dano modesto em vez de apostar num grande golpe.","it":"Irregolare e implacabile: colpisce di continuo con danni modesti invece di puntare a un grosso colpo.","de":"Unberechenbar und unermüdlich: schlägt ständig für mäßigen Schaden zu, statt auf einen großen Treffer zu setzen.","nl":"Grillig en meedogenloos: slaat voortdurend toe voor bescheiden schade in plaats van voor één grote klap te gaan.","pl":"Chaotyczny i nieustępliwy: bije bez przerwy za skromne obrażenia, zamiast celować w jeden wielki cios.","ru":"Беспорядочный и неутомимый: постоянно бьёт скромным уроном вместо одного большого удара.","tr":"Düzensiz ve amansız: tek büyük vuruş yerine sürekli ve mütevazı hasarla vurur."},"dauphin":{"fr":"Le coéquipier ultime : la coordination du banc et le sonar en font le tacticien le plus affûté de l'arène.","es":"El compañero definitivo: la coordinación de la manada y el sonar lo convierten en el estratega más afilado de la arena.","pt":"O companheiro supremo: a coordenação do grupo e o sonar fazem dele o tático mais afiado da arena.","it":"Il compagno ideale: il coordinamento del branco e il sonar ne fanno il tattico più acuto dell'arena.","de":"Der ultimative Teamspieler: Gruppenkoordination und Sonar machen ihn zum schärfsten Taktiker der Arena.","nl":"De ultieme teamspeler: roedelcoördinatie en sonar maken hem de scherpste tacticus van de arena.","pl":"Najlepszy gracz zespołowy: koordynacja stada i sonar czynią go najostrzejszym taktykiem areny.","ru":"Идеальный командный игрок: слаженность стаи и сонар делают его самым острым тактиком арены.","tr":"Nihai takım oyuncusu: sürü koordinasyonu ve sonar onu arenanın en keskin taktikçisi yapar."},"tortue":{"fr":"Le mur ultime — lente à frapper mais presque impossible à abattre.","es":"El muro definitivo: lenta al golpear, pero casi imposible de derribar.","pt":"A parede suprema: lenta a atacar, mas quase impossível de derrubar.","it":"Il muro definitivo: lenta a colpire ma quasi impossibile da abbattere.","de":"Die ultimative Mauer — langsam im Zuschlagen, aber kaum zu Fall zu bringen.","nl":"De ultieme muur — traag met slaan maar bijna niet neer te halen.","pl":"Najlepszy mur — wolny w ataku, ale prawie nie do powalenia.","ru":"Идеальная стена — медлит с ударом, но свалить почти невозможно.","tr":"Nihai duvar — vurması yavaş ama devirmek neredeyse imkânsız."},"rhinoceros":{"fr":"Un mastodonte blindé : lent à s'énerver, mais une fois lancé, rien ne l'arrête.","es":"Un juggernaut blindado: tarda en enfadarse, pero una vez en carga nada lo detiene.","pt":"Um colosso blindado: demora a irritar-se, mas, uma vez em carga, nada o trava.","it":"Un colosso corazzato: lento a infuriarsi, ma una volta lanciato nulla lo ferma.","de":"Ein gepanzerter Koloss: langsam zu reizen, aber im Anlauf hält ihn nichts auf.","nl":"Een gepantserde kolos: traag boos, maar eenmaal op stoom houdt niets hem tegen.","pl":"Opancerzony kolos: powoli się złości, ale gdy ruszy, nic go nie zatrzyma.","ru":"Бронированный колосс: долго злится, но, разогнавшись, его уже не остановить.","tr":"Zırhlı bir dev: geç öfkelenir ama bir kez hücuma kalkınca hiçbir şey onu durduramaz."},"crabe":{"fr":"De côté et têtu : une carapace solide devant, des pinces tranchantes prêtes à claquer.","es":"De lado y terco: caparazón duro por delante, pinzas afiladas listas para cerrarse.","pt":"De lado e teimoso: carapaça dura à frente, pinças afiadas prontas a fechar.","it":"Di lato e testardo: guscio duro davanti, chele affilate pronte a scattare.","de":"Seitwärts und stur: vorne ein harter Panzer, scharfe Scheren bereit zuzuschnappen.","nl":"Zijwaarts en koppig: een harde schaal voor, scherpe scharen klaar om dicht te klappen.","pl":"Bokiem i uparty: twardy pancerz z przodu, ostre kleszcze gotowe do zatrzaśnięcia.","ru":"Боком и упрямо: прочный панцирь спереди, острые клешни готовы сомкнуться.","tr":"Yan yan ve inatçı: önde sert bir kabuk, kapanmaya hazır keskin kıskaçlar."},"requin":{"fr":"Un superprédateur : implacable et précis, sa morsure devient plus mortelle à mesure que le combat dure.","es":"Un superdepredador: implacable y preciso, su mordisco es más letal cuanto más dura el combate.","pt":"Um superpredador: implacável e preciso, a sua mordida fica mais mortífera quanto mais o combate dura.","it":"Un superpredatore: implacabile e preciso, il suo morso diventa più letale quanto più dura lo scontro.","de":"Ein Spitzenräuber: unerbittlich und präzise, sein Biss wird tödlicher, je länger der Kampf dauert.","nl":"Een toproofdier: meedogenloos en precies, zijn beet wordt dodelijker naarmate het gevecht langer duurt.","pl":"Szczytowy drapieżnik: bezlitosny i precyzyjny, jego ugryzienie jest tym groźniejsze, im dłużej trwa walka.","ru":"Вершина пищевой цепи: беспощадная и точная, её укус становится всё смертоноснее по ходу боя.","tr":"Zirve avcı: amansız ve isabetli, ısırığı savaş uzadıkça daha ölümcül olur."},"crocodile":{"fr":"Un patient guetteur : presque invisible jusqu'à l'instant où ses mâchoires se referment.","es":"Un emboscador paciente: casi invisible hasta el momento en que sus mandíbulas se cierran.","pt":"Um emboscador paciente: quase invisível até ao instante em que as mandíbulas se fecham.","it":"Un paziente agguatatore: quasi invisibile fino all'istante in cui le sue fauci si chiudono.","de":"Ein geduldiger Lauerjäger: fast unsichtbar, bis seine Kiefer zuschnappen.","nl":"Een geduldige belager: bijna onzichtbaar tot het moment dat zijn kaken dichtklappen.","pl":"Cierpliwy zasadzkowicz: prawie niewidoczny do chwili, gdy jego szczęki się zatrzasną.","ru":"Терпеливый охотник из засады: почти невидим до момента, когда смыкаются его челюсти.","tr":"Sabırlı bir pusucu: çeneleri kapanana kadar neredeyse görünmez."},"elephant":{"fr":"Géant doux à la longue mémoire : protège et soutient tout le troupeau.","es":"Gigante amable con larga memoria: protege y anima a toda la manada.","pt":"Gigante gentil de longa memória: protege e anima toda a manada.","it":"Gigante gentile dalla lunga memoria: protegge e solleva tutto il branco.","de":"Sanfter Riese mit langem Gedächtnis: schützt und stärkt die ganze Herde.","nl":"Zachte reus met een lang geheugen: beschermt en sterkt de hele kudde.","pl":"Łagodny olbrzym o długiej pamięci: chroni i podnosi na duchu całe stado.","ru":"Добрый великан с долгой памятью: защищает и поддерживает всё стадо.","tr":"Uzun hafızalı nazik dev: tüm sürüyü korur ve yüceltir."},"hibou":{"fr":"Un guetteur silencieux : voit chaque ouverture et l'annonce avant qu'il soit trop tard.","es":"Un vigilante silencioso: ve cada hueco y lo avisa antes de que sea tarde.","pt":"Um vigia silencioso: vê cada abertura e avisa antes que seja tarde.","it":"Un osservatore silenzioso: vede ogni apertura e la segnala prima che sia troppo tardi.","de":"Ein stiller Beobachter: sieht jede Lücke und ruft sie aus, bevor es zu spät ist.","nl":"Een stille waker: ziet elke opening en roept hem uit voordat het te laat is.","pl":"Cichy obserwator: widzi każdą lukę i wskazuje ją, zanim będzie za późno.","ru":"Молчаливый наблюдатель: видит каждую лазейку и подсказывает её, пока не поздно.","tr":"Sessiz bir gözcü: her açıklığı görür ve çok geç olmadan haber verir."},"gorille":{"fr":"Une force immense alliée à la tête froide : frappe comme un camion et remarque à peine la riposte.","es":"Fuerza inmensa con la cabeza fría: golpea como un camión y apenas nota la réplica.","pt":"Força imensa com a cabeça fria: bate como um camião e mal repara na resposta.","it":"Forza immensa unita a lucidità: colpisce come un camion e quasi non nota la risposta.","de":"Immense Kraft mit kühlem Kopf: schlägt wie ein Lastwagen und merkt den Gegenschlag kaum.","nl":"Enorme kracht met een koel hoofd: slaat als een vrachtwagen en merkt de tegenaanval amper.","pl":"Ogromna siła i zimna głowa: uderza jak ciężarówka i ledwo zauważa kontrę.","ru":"Огромная сила и холодная голова: бьёт как грузовик и почти не замечает ответа.","tr":"Soğukkanlılıkla birleşen muazzam güç: kamyon gibi vurur, karşılığı pek fark etmez."},"paon":{"fr":"Tout en parade, aucune défense : mais sa présence éblouissante galvanise toute l'équipe.","es":"Todo exhibición, nada de defensa: pero su presencia deslumbrante anima a todo el equipo.","pt":"Só exibição, sem defesa: mas a sua presença deslumbrante anima toda a equipa.","it":"Tutto sfoggio, nessuna difesa: ma la sua presenza abbagliante galvanizza tutta la squadra.","de":"Nur Show, keine Verteidigung: aber seine blendende Präsenz feuert das ganze Team an.","nl":"Allemaal vertoon, geen verdediging: maar zijn verblindende aanwezigheid sterkt het hele team.","pl":"Sam pokaz, żadnej obrony: ale jego olśniewająca obecność dodaje animuszu całemu zespołowi.","ru":"Сплошной показ, никакой защиты: но его ослепительное присутствие вдохновляет всю команду.","tr":"Hepsi gösteriş, savunma yok: ama göz alıcı varlığı tüm takımı toplar."},"renard_voyageur":{"fr":"Un chapeau de voyageur usé et une cape rapiécée — un frappeur pur, première légende de l'Arène.","es":"Un sombrero de viajero maltrecho y una capa remendada: un atacante puro, primera leyenda de la Arena.","pt":"Um chapéu de viajante gasto e uma capa remendada — um atacante puro, a primeira lenda da Arena.","it":"Un cappello da viaggiatore malconcio e un mantello rattoppato — un attaccante puro, prima leggenda dell'Arena.","de":"Ein ramponierter Reisehut und ein geflickter Umhang — ein reiner Angreifer, die erste Legende der Arena.","nl":"Een gehavende reizigershoed en een gelapte mantel — een pure aanvaller, eerste legende van de Arena.","pl":"Zniszczony kapelusz wędrowca i połatana peleryna — czysty napastnik, pierwsza legenda Areny.","ru":"Потрёпанная шляпа странника и залатанный плащ — чистый атакующий, первая легенда Арены.","tr":"Yıpranmış bir gezgin şapkası ve yamalı bir pelerin — saf bir vurucu, Arena'nın ilk efsanesi."},"hibou_sage":{"fr":"Une robe de savant étoilée et de minuscules lunettes rondes — un soutien pur, qui élève toute l'équipe.","es":"Una túnica de erudito estrellada y diminutas gafas redondas: un apoyo puro que eleva a todo el equipo.","pt":"Um manto de erudito estrelado e minúsculos óculos redondos — um suporte puro que eleva toda a equipa.","it":"Una veste da studioso stellata e minuscoli occhialini tondi — un supporto puro che solleva tutta la squadra.","de":"Ein sternenbesetztes Gelehrtengewand und winzige runde Brillengläser — eine reine Unterstützung, die das ganze Team stärkt.","nl":"Een sterrenbezaaide geleerdenmantel en piepkleine ronde brilletjes — een pure support die het hele team opbeurt.","pl":"Gwiaździsta szata uczonego i malutkie okrągłe okulary — czyste wsparcie, które podnosi cały zespół.","ru":"Звёздная мантия учёного и крошечные круглые очки — чистая поддержка, поднимающая всю команду.","tr":"Yıldızlı bir bilgin cübbesi ve minik yuvarlak gözlükler — tüm takımı yükselten saf bir destek."},"loup_gardien":{"fr":"Revêtu de la cape d'une sentinelle usée par le temps — un mur pur, le dernier à tomber.","es":"Cubierto con la capa gastada de un centinela: un muro puro, el último en caer.","pt":"Revestido com a capa gasta de uma sentinela — uma parede pura, o último a cair.","it":"Avvolto nel mantello consumato di una sentinella — un muro puro, l'ultimo a cadere.","de":"Gehüllt in den verwitterten Umhang eines Wächters — eine reine Mauer, der Letzte, der fällt.","nl":"Gehuld in de verweerde mantel van een schildwacht — een pure muur, de laatste die valt.","pl":"Okryty znoszoną peleryną wartownika — czysty mur, ostatni, który upada.","ru":"Одет в потрёпанный плащ часового — чистая стена, падающая последней.","tr":"Yıpranmış bir nöbetçi pelerinine bürünmüş — saf bir duvar, en son düşen."},"blaireau_sorciere":{"fr":"Chapeau pointu, cape en lambeaux — un soutien pur, et le seul capable de ramener un allié du bord du gouffre.","es":"Sombrero puntiagudo, capa hecha jirones: un apoyo puro, y el único capaz de traer a un aliado del borde del abismo.","pt":"Chapéu pontiagudo, capa esfarrapada — um suporte puro, e o único capaz de trazer um aliado de volta da beira do abismo.","it":"Cappello a punta, mantello a brandelli — un supporto puro, e l'unico che può riportare un alleato dall'orlo del baratro.","de":"Spitzer Hut, zerfetzter Umhang — eine reine Unterstützung und die Einzige, die einen Verbündeten vom Abgrund zurückholen kann.","nl":"Puntmuts, aan flarden gescheurde cape — een pure support, en de enige die een bondgenoot van de rand terug kan halen.","pl":"Spiczasty kapelusz, postrzępiona peleryna — czyste wsparcie i jedyny, który potrafi wyciągnąć sojusznika znad krawędzi.","ru":"Остроконечная шляпа, рваный плащ — чистая поддержка и единственная, кто может вернуть союзника с края гибели.","tr":"Sivri şapka, yırtık pelerin — saf bir destek ve bir müttefiki uçurumun kıyısından geri çekebilen tek kişi."},"lapin_citrouille":{"fr":"Coincé dans un costume de citrouille évidée — un frappeur pur au goût inquiétant pour la force vitale.","es":"Embutido en un disfraz de calabaza hueca: un atacante puro con un gusto inquietante por la fuerza vital.","pt":"Apertado num fato de abóbora oca — um atacante puro com um gosto inquietante pela força vital.","it":"Stretto in un costume di zucca svuotata — un attaccante puro con un gusto inquietante per la forza vitale.","de":"Gezwängt in ein ausgehöhltes Kürbiskostüm — ein reiner Angreifer mit beunruhigendem Appetit auf Lebenskraft.","nl":"Gepropt in een uitgeholde pompoenkostuum — een pure aanvaller met een verontrustende smaak voor levenskracht.","pl":"Wciśnięty w kostium z wydrążonej dyni — czysty napastnik z niepokojącym zamiłowaniem do siły życiowej.","ru":"Втиснут в костюм из выдолбленной тыквы — чистый атакующий с тревожной тягой к жизненной силе.","tr":"Oyulmuş bir balkabağı kostümüne sıkışmış — yaşam gücüne tedirgin edici bir iştahı olan saf bir vurucu."},"serpent_squelette":{"fr":"Peint d'un blanc d'os avec un masque de crâne cliquetant — un mur pur qui maudit tout ce qu'il bloque.","es":"Pintada de blanco hueso con una máscara de calavera traqueteante: un muro puro que maldice todo lo que bloquea.","pt":"Pintada de branco-osso com uma máscara de caveira que chocalha — uma parede pura que amaldiçoa tudo o que bloqueia.","it":"Dipinto di bianco osso con una maschera di teschio tintinnante — un muro puro che maledice tutto ciò che blocca.","de":"Knochenweiß bemalt mit klapperndem Schädelmaske — eine reine Mauer, die verflucht, was sie blockt.","nl":"Beenwit geschilderd met een ratelend schedelmasker — een pure muur die vervloekt wat hij blokkeert.","pl":"Pomalowany na kościaną biel, z grzechoczącą maską czaszki — czysty mur, który przeklina to, co blokuje.","ru":"Выкрашена в костяной белый, в гремящей маске черепа — чистая стена, проклинающая всё, что блокирует.","tr":"Kemik beyazı boyanmış, tıkırdayan bir kafatası maskesiyle — engellediği her şeyi lanetleyen saf bir duvar."},"renne_grelot":{"fr":"Une écharpe rouge et un collier à clochette — un frappeur pur assez rapide pour faire deux livraisons à la fois.","es":"Una bufanda roja y un collar de cascabel: un atacante puro tan veloz que hace dos entregas a la vez.","pt":"Um cachecol vermelho e uma coleira com sino — um atacante puro rápido o suficiente para fazer duas entregas ao mesmo tempo.","it":"Una sciarpa rossa e un collare con campanello — un attaccante puro abbastanza veloce da fare due consegne insieme.","de":"Ein roter Schal und ein Glockenhalsband — ein reiner Angreifer, schnell genug für zwei Lieferungen auf einmal.","nl":"Een rode sjaal en een belhalsband — een pure aanvaller die snel genoeg is om twee bezorgingen tegelijk te doen.","pl":"Czerwony szalik i obroża z dzwonkiem — czysty napastnik, dość szybki, by zrobić dwie dostawy naraz.","ru":"Красный шарф и ошейник с колокольчиком — чистый атакующий, достаточно быстрый, чтобы сделать две доставки сразу.","tr":"Kırmızı bir atkı ve çanlı bir tasma — aynı anda iki teslimat yapacak kadar hızlı saf bir vurucu."},"ours_pere_noel":{"fr":"Coincé dans un minuscule bonnet de Père Noël et un grand manteau rouge — un mur pur qui fait riposter chaque coup bloqué.","es":"Embutido en un diminuto gorro de Papá Noel y un gran abrigo rojo: un muro puro que hace que bloquear un golpe devuelva el golpe.","pt":"Apertado num minúsculo gorro de Pai Natal e num grande casaco vermelho — uma parede pura que faz bloquear um golpe devolvê-lo.","it":"Stretto in un minuscolo cappello da Babbo Natale e in un grande cappotto rosso — un muro puro che fa restituire ogni colpo bloccato.","de":"Gezwängt in eine winzige Weihnachtsmütze und einen großen roten Mantel — eine reine Mauer, die jeden geblockten Treffer zurückgibt.","nl":"Gepropt in een piepklein kerstmuts en een grote rode jas — een pure muur die van blokkeren terugslaan maakt.","pl":"Wciśnięty w maleńką czapkę Mikołaja i wielki czerwony płaszcz — czysty mur, który sprawia, że blok oddaje cios.","ru":"Втиснут в крошечный колпак Санты и большое красное пальто — чистая стена, превращающая блок в ответный удар.","tr":"Minik bir Noel Baba şapkasına ve büyük kırmızı bir paltoya sıkışmış — engellemeyi karşı vuruşa çeviren saf bir duvar."},"pingouin_bonnet":{"fr":"Un bonnet tricoté et de minuscules moufles sur les ailerons — un soutien pur qui partage la chaleur avec tout le monde à la fois.","es":"Un gorro de punto y diminutos mitones sobre las aletas: un apoyo puro que comparte su calor con todos a la vez.","pt":"Um gorro de malha e minúsculas luvas sobre as barbatanas — um suporte puro que partilha o calor com todos de uma vez.","it":"Un berretto a maglia e minuscole muffole sulle pinne — un supporto puro che condivide il calore con tutti insieme.","de":"Eine Strickmütze und winzige Fäustlinge über den Flossen — eine reine Unterstützung, die die Wärme mit allen auf einmal teilt.","nl":"Een gebreide muts en kleine wantjes over de flippers — een pure support die de warmte met iedereen tegelijk deelt.","pl":"Dzianinowa czapka i maleńkie rękawiczki na płetwach — czyste wsparcie, które dzieli ciepło ze wszystkimi naraz.","ru":"Вязаная шапочка и крошечные варежки на ластах — чистая поддержка, делящаяся теплом сразу со всеми.","tr":"Yüzgeçlerinde örme bir bere ve minik eldivenler — sıcaklığı herkesle aynı anda paylaşan saf bir destek."},"dragon_imperial":{"fr":"Écailles pourpres et crinière dorée — un frappeur pur de plus en plus féroce à mesure qu'il approche de la chute.","es":"Escamas carmesí y melena dorada: un atacante puro que se vuelve más feroz cuanto más cerca está de caer.","pt":"Escamas carmesim e juba dourada — um atacante puro que fica mais feroz quanto mais perto está de cair.","it":"Squame cremisi e criniera dorata — un attaccante puro che diventa più feroce quanto più è vicino a cadere.","de":"Purpurrote Schuppen und goldene Mähne — ein reiner Angreifer, der umso wilder wird, je näher er dem Fall ist.","nl":"Karmozijnrode schubben en een gouden manen — een pure aanvaller die woester wordt naarmate hij dichter bij vallen is.","pl":"Szkarłatne łuski i złota grzywa — czysty napastnik, który staje się tym dzikszy, im bliżej upadku.","ru":"Багряная чешуя и золотая грива — чистый атакующий, свирепеющий по мере приближения к падению.","tr":"Kırmızı pullar ve altın yele — düşmeye yaklaştıkça daha da vahşileşen saf bir vurucu."},"belier_jade":{"fr":"Un Bélier de jade, animal de l'année, aux cornes serrées — un mur pur qui renvoie les coups à celui qui les a portés.","es":"Un Carnero de jade, cabra del año, con los cuernos bien enrollados: un muro puro que devuelve los golpes a quien los lanzó.","pt":"Um Carneiro de jade, o animal do ano, de cornos bem enrolados — uma parede pura que devolve os golpes a quem os deu.","it":"Un Ariete di giada, animale dell'anno, dalle corna ben avvolte — un muro puro che rimanda i colpi a chi li ha tirati.","de":"Ein Jade-Widder, Tier des Jahres, die Hörner fest gewunden — eine reine Mauer, die Schläge an ihren Urheber zurückschickt.","nl":"Een jade Ram, dier van het jaar, de hoorns strak gedraaid — een pure muur die klappen terugstuurt naar wie ze gaf.","pl":"Jadeitowy Baran, zwierzę roku, ze ściśle zwiniętymi rogami — czysty mur, który odsyła ciosy temu, kto je zadał.","ru":"Нефритовый Баран, животное года, с туго закрученными рогами — чистая стена, отправляющая удары обратно тому, кто их нанёс.","tr":"Boynuzları sıkıca sarılı, yılın hayvanı bir yeşim Koç — darbeleri vuranın üzerine geri gönderen saf bir duvar."},"carpe_koi":{"fr":"Une carpe étincelante qui a remonté la cascade — un soutien pur dont la chance double parfois chaque soin.","es":"Una carpa reluciente que remontó la cascada: un apoyo puro cuya suerte a veces duplica cada curación.","pt":"Uma carpa reluzente que subiu a cascata — um suporte puro cuja sorte às vezes duplica cada cura.","it":"Una carpa scintillante che ha risalito la cascata — un supporto puro la cui fortuna a volte raddoppia ogni cura.","de":"Ein glänzender Karpfen, der den Wasserfall hinaufschwamm — eine reine Unterstützung, deren Glück manchmal jede Heilung verdoppelt.","nl":"Een glanzende karper die de waterval opzwom — een pure support wiens geluk soms elke genezing verdubbelt.","pl":"Lśniący karp, który wpłynął pod wodospad — czyste wsparcie, którego szczęście czasem podwaja każde leczenie.","ru":"Сверкающий карп, поднявшийся по водопаду, — чистая поддержка, чья удача порой удваивает каждое лечение.","tr":"Şelaleyi tırmanan parlak bir sazan — şansı bazen her iyileştirmeyi ikiye katlayan saf bir destek."},"cygne_cupidon":{"fr":"Ailes blanc neige et minuscule arc doré — un frappeur pur dont les flèches affaiblissent un peu la cible et renforcent un peu le Cygne.","es":"Alas blancas como la nieve y un diminuto arco dorado: un atacante puro cuyas flechas debilitan un poco al objetivo y fortalecen un poco al Cisne.","pt":"Asas branco-neve e um minúsculo arco dourado — um atacante puro cujas flechas deixam o alvo um pouco mais fraco e o Cisne um pouco mais forte.","it":"Ali bianco neve e un minuscolo arco dorato — un attaccante puro le cui frecce indeboliscono un po' il bersaglio e rafforzano un po' il Cigno.","de":"Schneeweiße Flügel und ein winziger goldener Bogen — ein reiner Angreifer, dessen Pfeile das Ziel etwas schwächen und den Schwan etwas stärken.","nl":"Sneeuwwitte vleugels en een piepkleine gouden boog — een pure aanvaller wiens pijlen het doelwit wat zwakker en de Zwaan wat sterker maken.","pl":"Śnieżnobiałe skrzydła i maleńki złoty łuk — czysty napastnik, którego strzały osłabiają cel i wzmacniają Łabędzia.","ru":"Снежно-белые крылья и крошечный золотой лук — чистый атакующий, чьи стрелы немного ослабляют цель и немного усиливают Лебедя.","tr":"Kar beyazı kanatlar ve minik altın bir yay — okları hedefi biraz zayıflatıp Kuğu'yu biraz güçlendiren saf bir vurucu."},"loutre_main_dans_la_main":{"fr":"Pattes jointes pour que le courant ne les sépare jamais — un mur pur dont l'étreinte double parfois le bouclier.","es":"Patas entrelazadas para que la corriente nunca las separe: un muro puro cuyo agarre a veces duplica el escudo.","pt":"Patas entrelaçadas para que a corrente nunca as separe — uma parede pura cujo aperto às vezes duplica o escudo.","it":"Zampe intrecciate perché la corrente non le separi mai — un muro puro la cui presa a volte raddoppia lo scudo.","de":"Pfoten ineinander, damit die Strömung sie nie trennt — eine reine Mauer, deren Griff manchmal den Schild verdoppelt.","nl":"Pootjes in elkaar zodat de stroming ze nooit uit elkaar kan trekken — een pure muur wiens greep soms het schild verdubbelt.","pl":"Łapy splecione, by nurt nigdy ich nie rozdzielił — czysty mur, którego uścisk czasem podwaja tarczę.","ru":"Лапы сцеплены, чтобы течение никогда не разлучило их, — чистая стена, чья хватка порой удваивает щит.","tr":"Akıntı asla ayıramasın diye birbirine kenetlenmiş patiler — kavrayışı bazen kalkanı ikiye katlayan saf bir duvar."},"perruche_inseparable":{"fr":"Deux plumes, un seul cœur — un soutien pur qui ne soigne jamais un seul ami.","es":"Dos plumas, un corazón: un apoyo puro que nunca cura a un solo amigo.","pt":"Duas penas, um só coração — um suporte puro que nunca cura apenas um amigo.","it":"Due piume, un solo cuore — un supporto puro che non cura mai un solo amico.","de":"Zwei Federn, ein Herz — eine reine Unterstützung, die nie nur einen Freund heilt.","nl":"Twee veren, één hart — een pure support die nooit maar één vriend geneest.","pl":"Dwa pióra, jedno serce — czyste wsparcie, które nigdy nie leczy tylko jednego przyjaciela.","ru":"Два пера, одно сердце — чистая поддержка, которая никогда не лечит лишь одного друга.","tr":"İki tüy, tek kalp — asla yalnızca bir arkadaşı iyileştirmeyen saf bir destek."},"leopard_glacier":{"fr":"Un léopard des neiges aux yeux bleu givre, l'un des derniers de son espèce — un frappeur pur dont les coups sont souvent critiques.","es":"Un leopardo de las nieves de ojos azul escarcha, uno de los últimos de su especie: un atacante puro cuyos golpes suelen ser críticos.","pt":"Um leopardo-das-neves de olhos azul-gelo, um dos últimos da sua espécie — um atacante puro cujos golpes costumam ser críticos.","it":"Un leopardo delle nevi dagli occhi azzurro ghiaccio, uno degli ultimi della sua specie — un attaccante puro i cui colpi sono spesso critici.","de":"Ein Schneeleopard mit frostblauen Augen, einer der letzten seiner Art — ein reiner Angreifer, dessen Schläge oft kritisch treffen.","nl":"Een sneeuwluipaard met ijsblauwe ogen, een van de laatste van zijn soort — een pure aanvaller wiens slagen vaak kritiek zijn.","pl":"Pantera śnieżna o lodowoniebieskich oczach, jedna z ostatnich swego gatunku — czysty napastnik, którego ciosy często są krytyczne.","ru":"Снежный барс с ледяно-голубыми глазами, один из последних в своём роде, — чистый атакующий, чьи удары часто бывают критическими.","tr":"Buz mavisi gözlü, türünün son örneklerinden bir kar leoparı — vuruşları sıkça kritik olan saf bir vurucu."},"pangolin_blinde":{"fr":"Roulé en boule d'écailles qui se chevauchent — un mur pur qui fait mal à chaque coup bloqué.","es":"Enrollado en una bola de escamas superpuestas: un muro puro que hace que cada golpe bloqueado duela.","pt":"Enrolado numa bola de escamas sobrepostas — uma parede pura que faz doer cada golpe bloqueado.","it":"Arrotolato in una palla di squame sovrapposte — un muro puro che fa male a ogni colpo bloccato.","de":"Zu einer Kugel überlappender Schuppen eingerollt — eine reine Mauer, bei der jeder geblockte Treffer wehtut.","nl":"Opgerold tot een bal van overlappende schubben — een pure muur die elke geblokkeerde treffer laat steken.","pl":"Zwinięty w kulę nachodzących na siebie łusek — czysty mur, który sprawia, że każdy zablokowany cios boli.","ru":"Свёрнут в шар из налегающей чешуи — чистая стена, из-за которой каждый заблокированный удар жалит.","tr":"Üst üste binen pullardan bir topa dönmüş — engellenen her darbeyi acıtan saf bir duvar."},"abeille_reine":{"fr":"Une minuscule couronne dorée et toute une ruche derrière elle — un soutien pur qui galvanise les frappeurs de l'équipe.","es":"Una diminuta corona dorada y toda una colmena detrás: un apoyo puro que anima a los atacantes del equipo.","pt":"Uma minúscula coroa dourada e toda uma colmeia atrás dela — um suporte puro que anima os atacantes da equipa.","it":"Una minuscola corona dorata e un intero alveare alle spalle — un supporto puro che galvanizza gli attaccanti della squadra.","de":"Eine winzige goldene Krone und ein ganzer Bienenstock im Rücken — eine reine Unterstützung, die die Angreifer des Teams anfeuert.","nl":"Een piepkleine gouden kroon en een hele korf achter haar — een pure support die de aanvallers van het team opzweept.","pl":"Maleńka złota korona i cały ul za plecami — czyste wsparcie, które zagrzewa napastników zespołu.","ru":"Крошечная золотая корона и целый улей за спиной — чистая поддержка, воодушевляющая атакующих команды.","tr":"Minik bir altın taç ve arkasında koca bir kovan — takımın vurucularını toplayan saf bir destek."},"guepard_zenith":{"fr":"Un guépard doré par le soleil en pleine course — un frappeur pur conçu pour frapper deux fois avant que quiconque réagisse.","es":"Un guepardo dorado por el sol en plena carrera: un atacante puro hecho para golpear dos veces antes de que nadie reaccione.","pt":"Um chita dourado pelo sol em plena corrida — um atacante puro feito para atacar duas vezes antes que alguém reaja.","it":"Un ghepardo dorato dal sole in piena corsa — un attaccante puro fatto per colpire due volte prima che qualcuno reagisca.","de":"Ein sonnenvergoldeter Gepard im vollen Sprint — ein reiner Angreifer, gebaut, um zweimal zuzuschlagen, bevor jemand reagiert.","nl":"Een zongouden cheeta in volle sprint — een pure aanvaller gebouwd om twee keer te slaan voordat iemand reageert.","pl":"Pozłocony słońcem gepard w pełnym sprincie — czysty napastnik stworzony, by uderzyć dwa razy, zanim ktokolwiek zareaguje.","ru":"Позолоченный солнцем гепард в полном спринте — чистый атакующий, созданный бить дважды, пока никто не успел среагировать.","tr":"Güneşle yaldızlanmış, tam koşuda bir çita — kimse tepki vermeden iki kez vurmak için yaratılmış saf bir vurucu."},"hippopotame_marais":{"fr":"Cuirassé de boue dorée, surgissant du fleuve — un mur pur qui fait regretter chaque coup aux attaquants.","es":"Acorazado en barro dorado y surgiendo del río: un muro puro que hace que los atacantes se arrepientan de cada golpe.","pt":"Blindado em lama dourada e a emergir do rio — uma parede pura que faz os atacantes lamentar cada golpe.","it":"Corazzato di fango dorato, emerge dal fiume — un muro puro che fa pentire gli attaccanti di ogni colpo.","de":"Gepanzert in goldenem Schlamm, dem Fluss entsteigend — eine reine Mauer, die Angreifer jeden Schlag bereuen lässt.","nl":"Gepantserd in vergulde modder en oprijzend uit de rivier — een pure muur die aanvallers elke slag laat betreuren.","pl":"W pancerzu ze złotego błota, wynurzający się z rzeki — czysty mur, przez który napastnicy żałują każdego ciosu.","ru":"Закованный в золотистую грязь, поднимающийся из реки, — чистая стена, из-за которой атакующие жалеют о каждом ударе.","tr":"Yaldızlı çamurdan zırhlı, nehirden yükselen — saldırganlara her darbeyi pişman eden saf bir duvar."},"suricate_sentinelle":{"fr":"En faction sur le rocher le plus haut, la cape au vent — un soutien pur qui protège l'équipe avant que le coup n'arrive.","es":"De guardia en la roca más alta con la capa al viento: un apoyo puro que protege al equipo antes de que caiga el golpe.","pt":"De vigia na rocha mais alta, com a capa ao vento — um suporte puro que protege a equipa antes de o golpe cair.","it":"In vedetta sulla roccia più alta con il mantello al vento — un supporto puro che protegge la squadra prima che il colpo arrivi.","de":"Auf dem höchsten Felsen Wache haltend, den Umhang im Wind — eine reine Unterstützung, die das Team schützt, bevor der Schlag landet.","nl":"Op wacht op de hoogste rots met een cape in de wind — een pure support die het team beschermt voordat de klap landt.","pl":"Na warcie na najwyższej skale, z peleryną na wietrze — czyste wsparcie, które osłania zespół, zanim cios trafi.","ru":"Стоит на страже на самой высокой скале, плащ на ветру, — чистая поддержка, прикрывающая команду до того, как удар достигнет цели.","tr":"En yüksek kayada nöbet tutan, pelerini rüzgârda — darbe inmeden takımı koruyan saf bir destek."},"narval_etoile":{"fr":"Un narval dont la peau est une carte des constellations et dont la défense est une étoile filante — un frappeur pur aux coups souvent critiques.","es":"Un narval cuya piel es un mapa de constelaciones y cuyo colmillo es una estrella fugaz: un atacante puro cuyos golpes suelen ser críticos.","pt":"Um narval cuja pele é um mapa de constelações e cujo dente é uma estrela cadente — um atacante puro cujos golpes são muitas vezes críticos.","it":"Un narvalo la cui pelle è una mappa di costellazioni e il cui dente è una stella cadente — un attaccante puro i cui colpi sono spesso critici.","de":"Ein Narwal, dessen Haut mit Sternbildern bedeckt ist und dessen Stoßzahn eine Sternschnuppe ist — ein reiner Angreifer, dessen Schläge oft kritisch treffen.","nl":"Een narwal wiens huid een sterrenkaart is en wiens slagtand een vallende ster is — een pure aanvaller wiens slagen vaak kritiek zijn.","pl":"Narwal, którego skóra jest mapą gwiazdozbiorów, a kieł spadającą gwiazdą — czysty napastnik, którego ciosy często są krytyczne.","ru":"Нарвал, чья шкура — карта созвездий, а бивень — падающая звезда, — чистый атакующий, чьи удары часто бывают критическими.","tr":"Derisi takımyıldız haritası, dişi düşen bir yıldız olan bir narwhal — vuruşları sıkça kritik olan saf bir vurucu."},"lama_andin":{"fr":"Un lama en poncho étoilé, observant le ciel des hautes Andes — un mur pur qui crache sur quiconque le frappe.","es":"Una llama con poncho bordado de estrellas, mirando el cielo desde los altos Andes: un muro puro que escupe a quien la golpea.","pt":"Uma lama com poncho bordado de estrelas, a observar o céu dos altos Andes — uma parede pura que cospe em quem lhe bate.","it":"Un lama con un poncho ricamato di stelle, che scruta il cielo dalle alte Ande — un muro puro che sputa a chi lo colpisce.","de":"Ein Lama im sternbestickten Poncho, das aus den hohen Anden den Himmel beobachtet — eine reine Mauer, die zurückspuckt, wer sie trifft.","nl":"Een lama in een met sterren geborduurde poncho, de hemel bespiedend vanuit de hoge Andes — een pure muur die terugspuugt naar wie hem raakt.","pl":"Lama w poncho haftowanym gwiazdami, obserwująca niebo z wysokich Andów — czysty mur, który pluje w tego, kto go uderzy.","ru":"Лама в пончо, расшитом звёздами, наблюдающая за небом с высоких Анд, — чистая стена, плюющаяся в того, кто её бьёт.","tr":"Yüksek And Dağları'ndan gökyüzünü izleyen, yıldız işlemeli panço giymiş bir lama — kendisine vuranın yüzüne tüküren saf bir duvar."},"luciole_lune":{"fr":"Une luciole aux ailes de poussière d'étoiles, brillant sur la prairie — un soutien pur dont la lumière soigne toute l'équipe d'un coup.","es":"Una luciérnaga con alas de polvo de estrellas, brillando sobre el prado: un apoyo puro cuya luz cura a todo el equipo a la vez.","pt":"Um pirilampo com asas de pó de estrelas, a brilhar sobre o prado — um suporte puro cuja luz cura toda a equipa de uma vez.","it":"Una lucciola con ali di polvere di stelle, che brilla sul prato — un supporto puro la cui luce cura tutta la squadra insieme.","de":"Ein Glühwürmchen mit Flügeln aus Sternenstaub, das über der Wiese leuchtet — eine reine Unterstützung, deren Licht das ganze Team auf einmal heilt.","nl":"Een vuurvliegje met vleugels van sterrenstof, gloeiend boven de weide — een pure support wiens licht het hele team in één keer heelt.","pl":"Świetlik ze skrzydłami z gwiezdnego pyłu, jaśniejący nad łąką — czyste wsparcie, którego światło leczy cały zespół naraz.","ru":"Светлячок с крыльями из звёздной пыли, сияющий над лугом, — чистая поддержка, чей свет лечит всю команду сразу.","tr":"Yıldız tozundan kanatlarıyla çayırın üzerinde parlayan bir ateş böceği — ışığı tüm takımı bir anda iyileştiren saf bir destek."},"mammouth_ancestral":{"fr":"Un géant hirsute de l'âge de glace aux défenses gravées de runes — un mur inébranlable qui renvoie chaque coup.","es":"Un gigante peludo de la era del hielo con colmillos rúnicos: un muro inamovible que devuelve cada golpe.","pt":"Um gigante peludo da era do gelo com presas rúnicas — uma parede inabalável que devolve cada golpe.","it":"Un gigante irsuto dell'era glaciale con zanne runiche — un muro incrollabile che rimanda ogni colpo.","de":"Ein zotteliger Riese der Eiszeit mit runenverzierten Stoßzähnen — eine unverrückbare Mauer, die jeden Schlag zurückschmettert.","nl":"Een harige reus uit de ijstijd met runen op de slagtanden — een onverzettelijke muur die elke klap terugkaatst.","pl":"Kudłaty olbrzym epoki lodowcowej z runicznymi kłami — nieruchomy mur, który odbija każdy cios.","ru":"Косматый великан ледникового периода с рунами на бивнях — несокрушимая стена, возвращающая каждый удар.","tr":"Buz Çağı'ndan, rünlü dişleri olan tüylü bir dev — her darbeyi geri çarpan sarsılmaz bir duvar."},"phenix":{"fr":"Un oiseau de flamme vive qui brûle plus fort à l'approche de la chute — et peut relever un allié tombé de ses cendres.","es":"Un ave de llama viva que arde con más fuerza cuanto más cerca está de caer, y que puede alzar de las cenizas a un aliado caído.","pt":"Uma ave de chama viva que arde mais forte quanto mais perto está de cair — e que pode erguer das cinzas um aliado caído.","it":"Un uccello di fiamma viva che brucia più forte quanto più è vicino a cadere — e può far rialzare dalle ceneri un alleato caduto.","de":"Ein Vogel aus lebendiger Flamme, der heller brennt, je näher er dem Fall ist — und einen gefallenen Verbündeten aus der Asche erheben kann.","nl":"Een vogel van levende vlam die helderder brandt naarmate hij dichter bij vallen is — en een gevallen bondgenoot uit de as kan doen herrijzen.","pl":"Ptak z żywego płomienia, płonący jaśniej, im bliżej upadku — i potrafiący podnieść poległego sojusznika z popiołów.","ru":"Птица живого пламени, пылающая ярче по мере приближения к падению, — и способная поднять павшего союзника из пепла.","tr":"Düşmeye yaklaştıkça daha parlak yanan canlı alevden bir kuş — ve düşmüş bir müttefiki küllerinden kaldırabilir."},"leviathan":{"fr":"Un serpent de mer couronné de tempête, venu des profondeurs — il entraîne le combat sous les flots, frappe fort tandis que ses anneaux détournent les coups.","es":"Una serpiente marina coronada de tormenta, venida de lo profundo: arrastra el combate bajo el agua, golpeando fuerte mientras sus anillos desvían los golpes.","pt":"Uma serpente marinha coroada de tempestade, vinda das profundezas — arrasta o combate para o fundo, batendo forte enquanto os seus anéis desviam os golpes.","it":"Un serpente marino incoronato di tempesta, venuto dagli abissi — trascina lo scontro sott'acqua, colpendo duro mentre le sue spire deviano i colpi.","de":"Eine sturmgekrönte Seeschlange aus der Tiefe — sie zieht den Kampf unter Wasser, schlägt hart zu, während ihre Windungen Schläge ablenken.","nl":"Een met storm gekroonde zeeslang uit de diepte — hij sleurt het gevecht onder water, slaat hard toe terwijl zijn kronkels klappen afbuigen.","pl":"Morski wąż ukoronowany burzą, z głębin — wciąga walkę pod wodę, uderzając mocno, gdy jego zwoje odbijają ciosy.","ru":"Морской змей в короне из бури, из глубин, — утягивает бой под воду, бьёт сильно, пока его кольца отводят удары.","tr":"Derinlerden gelen, fırtına tacı takmış bir deniz yılanı — savaşı suyun altına çeker, halkaları darbeleri savuşturur, kendisi sert vurur."},"griffon":{"fr":"Mi-lion, mi-aigle, perché au-dessus des nuages — un rapace fulgurant qui frappe deux fois avant que tu clignes des yeux.","es":"Mitad león, mitad águila, posado sobre las nubes: una rapaz relampagueante que golpea dos veces antes de que parpadees.","pt":"Metade leão, metade águia, pousado acima das nuvens — uma ave de rapina relampejante que ataca duas vezes antes de piscares os olhos.","it":"Metà leone, metà aquila, appollaiato sopra le nuvole — un rapace fulmineo che colpisce due volte prima che tu possa sbattere le palpebre.","de":"Halb Löwe, halb Adler, über den Wolken thronend — ein blitzschneller Raubvogel, der zweimal zuschlägt, bevor du blinzelst.","nl":"Half leeuw, half adelaar, neergestreken boven de wolken — een bliksemsnelle roofvogel die twee keer slaat voor je knippert.","pl":"Pół lew, pół orzeł, siedzący ponad chmurami — błyskawiczny ptak drapieżny, który uderza dwa razy, zanim mrugniesz.","ru":"Наполовину лев, наполовину орёл, восседающий над облаками, — молниеносный хищник, бьющий дважды, пока ты моргнёшь.","tr":"Yarı aslan, yarı kartal, bulutların üstünde tüneyen — sen göz kırpmadan iki kez vuran şimşek hızında bir yırtıcı."},"licorne_saisons":{"fr":"Une licorne couronnée des fleurs de toutes les saisons — sa corne soigne toute l'équipe et sa présence la galvanise.","es":"Un unicornio envuelto en las flores de todas las estaciones: su cuerno cura a todo el equipo y su presencia lo anima.","pt":"Um unicórnio envolto nas flores de todas as estações — o seu corno cura toda a equipa e a sua presença anima-a.","it":"Un unicorno avvolto nei fiori di ogni stagione — il suo corno cura tutta la squadra e la sua presenza la galvanizza.","de":"Ein Einhorn, umkränzt von den Blumen aller Jahreszeiten — ihr Horn heilt das ganze Team und ihre Präsenz feuert es an.","nl":"Een eenhoorn omkranst met de bloemen van alle seizoenen — haar hoorn heelt het hele team en haar aanwezigheid sterkt het.","pl":"Jednorożec spowity kwiatami wszystkich pór roku — jej róg leczy cały zespół, a jej obecność go zagrzewa.","ru":"Единорог, увитый цветами всех времён года, — её рог лечит всю команду, а присутствие вдохновляет её.","tr":"Her mevsimin çiçekleriyle sarılı bir tek boynuzlu at — boynuzu tüm takımı iyileştirir, varlığı onu toplar."},"hydre":{"fr":"De nombreuses têtes fouettées par la tempête, chacune avec sa volonté — elle frappe encore et encore, et ce que tu tranches repousse.","es":"Muchas cabezas azotadas por la tormenta, cada una con voluntad propia: golpea una y otra vez, y lo que cortas vuelve a crecer.","pt":"Muitas cabeças fustigadas pela tempestade, cada uma com vontade própria — ataca vezes sem conta, e o que cortas volta a crescer.","it":"Molte teste sferzate dalla tempesta, ciascuna con una volontà propria — colpisce ancora e ancora, e ciò che tagli ricresce.","de":"Viele sturmgepeitschte Köpfe, jeder mit eigenem Willen — sie schlägt immer wieder zu, und was du abschlägst, wächst nach.","nl":"Vele stormgeteisterde koppen, elk met een eigen wil — hij slaat keer op keer toe, en wat je afhakt groeit terug.","pl":"Wiele głów smaganych burzą, każda z własną wolą — uderza raz po raz, a to, co odetniesz, odrasta.","ru":"Множество голов, хлёстанных бурей, у каждой своя воля, — бьёт снова и снова, а то, что ты отрубил, отрастает.","tr":"Fırtınanın kamçıladığı, her biri kendi iradesine sahip birçok baş — tekrar tekrar vurur ve kestiğin yeniden büyür."},"ouroboros":{"fr":"Le serpent qui dévore sa propre queue — la fin du jeu, sans type à craindre ni à exploiter.","es":"La serpiente que devora su propia cola: el final del juego, sin tipo al que temer ni que aprovechar.","pt":"A serpente que devora a própria cauda — o fim do jogo, sem tipo a temer nem a explorar.","it":"Il serpente che divora la propria coda — la fine del gioco, senza tipo da temere né da sfruttare.","de":"Die Schlange, die ihren eigenen Schwanz verschlingt — das Ende des Spiels, ohne Typ, den man fürchten oder ausnutzen könnte.","nl":"De slang die zijn eigen staart verslindt — het einde van het spel, zonder type om te vrezen of te benutten.","pl":"Wąż pożerający własny ogon — koniec gry, bez typu, którego trzeba się bać, ani takiego, który można wykorzystać.","ru":"Змей, пожирающий собственный хвост, — конец игры, без типа, которого стоит бояться или использовать.","tr":"Kendi kuyruğunu yutan yılan — oyunun sonu, korkulacak ya da istismar edilecek hiçbir tür yok."},"pegase":{"fr":"Un cheval ailé né de la lumière des étoiles — sa crinière soigne toute l'équipe et son galop donne à ses alliés la force de frapper plus fort.","es":"Un caballo alado nacido de la luz de las estrellas: su crin cura a todo el equipo y su galope da a los aliados fuerza para golpear más fuerte.","pt":"Um cavalo alado nascido da luz das estrelas — sua crina cura toda a equipe e seu galope dá aos aliados força para atacar mais forte.","it":"Un cavallo alato nato dalla luce delle stelle: la sua criniera cura tutta la squadra e il suo galoppo dà agli alleati la forza di colpire più duro.","de":"Ein geflügeltes Pferd, geboren aus Sternenlicht – seine Mähne heilt das ganze Team und sein Galopp verleiht den Verbündeten mehr Schlagkraft.","nl":"Een gevleugeld paard geboren uit sterrenlicht — zijn manen genezen het hele team en zijn galop geeft bondgenoten de kracht om harder toe te slaan.","pl":"Skrzydlaty koń zrodzony ze światła gwiazd — jego grzywa leczy całą drużynę, a galop dodaje sojusznikom siły do mocniejszych ciosów.","ru":"Крылатый конь, рождённый светом звёзд: его грива лечит всю команду, а галоп даёт союзникам силу бить сильнее.","tr":"Yıldız ışığından doğan kanatlı bir at — yelesi tüm takımı iyileştirir, dörtnalı müttefiklerine daha sert vurma gücü verir."},"kraken":{"fr":"Un colosse des abysses dont les tentacules entraînent tout le combat au fond de la mer — brutal, implacable, impossible à semer.","es":"Un coloso del abismo cuyos tentáculos arrastran todo el combate al fondo del mar: brutal, implacable, imposible de sacudirse.","pt":"Um colosso do abismo cujos tentáculos arrastam toda a luta para o fundo do mar — brutal, implacável, impossível de despistar.","it":"Un colosso degli abissi i cui tentacoli trascinano tutto lo scontro sul fondo del mare: brutale, implacabile, impossibile da scrollarsi di dosso.","de":"Ein Koloss der Tiefe, dessen Tentakel den ganzen Kampf auf den Meeresgrund ziehen – brutal, unerbittlich, nicht abzuschütteln.","nl":"Een kolos uit de diepte wiens tentakels het hele gevecht naar de zeebodem slepen — brutaal, meedogenloos, niet af te schudden.","pl":"Kolos głębin, którego macki wciągają całą walkę na dno morza — brutalny, nieustępliwy, nie do zgubienia.","ru":"Колосс бездны, чьи щупальца утягивают весь бой на морское дно: жестокий, неумолимый, от него не отделаться.","tr":"Dokunaçları tüm savaşı deniz dibine çeken bir uçurum devi — acımasız, amansız, ondan kurtulmak imkânsız."},"minotaure":{"fr":"Le gardien du labyrinthe sans fin — il transforme chaque couloir en mur et renvoie chaque coup droit à son auteur.","es":"El guardián del laberinto sin fin: convierte cada pasillo en un muro y devuelve cada golpe a quien lo lanzó.","pt":"O guardião do labirinto sem fim — transforma cada corredor em parede e devolve cada golpe direto a quem o deu.","it":"Il custode del labirinto senza fine: trasforma ogni corridoio in un muro e rimanda ogni colpo dritto a chi lo ha sferrato.","de":"Der Wächter des endlosen Labyrinths – er macht jeden Gang zur Mauer und schickt jeden Schlag direkt an den Absender zurück.","nl":"De bewaker van het eindeloze labyrint — hij maakt van elke gang een muur en stuurt elke klap recht terug naar de afzender.","pl":"Strażnik niekończącego się labiryntu — zamienia każdy korytarz w mur, a każdy cios odsyła prosto do atakującego.","ru":"Страж бесконечного лабиринта: превращает каждый коридор в стену и возвращает каждый удар прямо обидчику.","tr":"Sonsuz labirentin bekçisi — her koridoru duvara çevirir, her darbeyi doğrudan sahibine geri yollar."},"oiseau_tonnerre":{"fr":"Un rapace aux ailes d'orage qui chevauche la foudre — il frappe depuis les nuages, souvent deux fois avant que le tonnerre n'arrive.","es":"Una rapaz de alas de tormenta que cabalga el rayo: ataca desde las nubes, a menudo dos veces antes de que llegue el trueno.","pt":"Uma ave de rapina de asas de tempestade que cavalga o raio — ataca das nuvens, muitas vezes duas vezes antes de o trovão chegar.","it":"Un rapace dalle ali di tempesta che cavalca il fulmine: colpisce dalle nuvole, spesso due volte prima che arrivi il tuono.","de":"Ein Raubvogel mit Sturmschwingen, der auf dem Blitz reitet – er schlägt aus den Wolken zu, oft zweimal, bevor der Donner eintrifft.","nl":"Een roofvogel met stormvleugels die op de bliksem rijdt — hij slaat toe vanuit de wolken, vaak twee keer voordat de donder komt.","pl":"Drapieżny ptak o burzowych skrzydłach, który jeździ na błyskawicy — uderza z chmur, często dwa razy, zanim nadejdzie grzmot.","ru":"Хищная птица с грозовыми крыльями, оседлавшая молнию: бьёт из облаков, часто дважды, прежде чем долетит гром.","tr":"Fırtına kanatlı, yıldırıma binen bir yırtıcı — bulutlardan saldırır, gök gürültüsü gelmeden çoğu zaman iki kez vurur."},"tortue_monde":{"fr":"Une tortue ancienne qui porte toute une terre sur sa carapace — rien ne la brise, et sa carapace protège tous ceux qui l'entourent.","es":"Una tortuga ancestral que lleva toda una tierra en su caparazón: nada la rompe y su caparazón protege a todos los que la rodean.","pt":"Uma tartaruga ancestral que carrega uma terra inteira no casco — nada a quebra, e seu casco abriga todos ao redor.","it":"Una tartaruga antica che porta un'intera terra sul guscio: nulla la spezza e il suo guscio protegge chiunque le sia vicino.","de":"Eine uralte Schildkröte, die ein ganzes Land auf dem Panzer trägt – nichts bricht sie, und ihr Panzer schützt alle in ihrer Nähe.","nl":"Een eeuwenoude schildpad die een heel land op haar schild draagt — niets breekt haar en haar schild beschermt iedereen in de buurt.","pl":"Prastary żółw niosący na skorupie całą krainę — nic go nie złamie, a jego skorupa chroni wszystkich w pobliżu.","ru":"Древняя черепаха, несущая на панцире целую землю: ничто её не сломит, а панцирь укрывает всех рядом.","tr":"Kabuğunda koca bir toprağı taşıyan kadim bir kaplumbağa — hiçbir şey onu kıramaz, kabuğu yanındaki herkesi korur."},"qilin":{"fr":"Un doux cerf-esprit aux écailles de jade, messager de bonne fortune — sa voix de cloche soigne toute l'équipe et réchauffe les cœurs.","es":"Un dulce ciervo espíritu de escamas de jade, heraldo de la buena fortuna: su voz de campana cura a todo el equipo y anima cada corazón.","pt":"Um gentil cervo-espírito de escamas de jade, arauto da boa sorte — sua voz de sino cura toda a equipe e anima cada coração.","it":"Un dolce cervo-spirito dalle scaglie di giada, araldo di buona fortuna: la sua voce di campana cura tutta la squadra e solleva ogni cuore.","de":"Ein sanfter Geisterhirsch mit Jadeschuppen, Bote des Glücks – seine glockenhelle Stimme heilt das ganze Team und hebt jedes Herz.","nl":"Een zachtaardig geestenhert met jadeschubben, bode van geluk — zijn klokkende stem geneest het hele team en verheft elk hart.","pl":"Łagodny duchowy jeleń o jadeitowych łuskach, zwiastun szczęścia — jego dzwoniący głos leczy całą drużynę i podnosi na duchu.","ru":"Нежный олень-дух с нефритовой чешуёй, вестник удачи: его колокольный голос лечит всю команду и поднимает дух.","tr":"Yeşim pullu nazik bir ruh geyiği, şansın habercisi — çan gibi sesi tüm takımı iyileştirir ve her kalbi ferahlatır."},"sphinx":{"fr":"Un gardien d'énigmes du ciel du désert — il trouble l'esprit de ses attaquants, et beaucoup de leurs coups ratent simplement.","es":"Un guardián de acertijos del cielo del desierto: nubla la mente de sus atacantes y muchos de sus golpes simplemente fallan.","pt":"Um guardião de enigmas do céu do deserto — turva a mente dos atacantes, e muitos de seus golpes simplesmente erram.","it":"Un custode di enigmi del cielo del deserto: annebbia la mente di chi lo attacca e molti colpi vanno semplicemente a vuoto.","de":"Ein Rätselhüter des Wüstenhimmels – er vernebelt die Sinne seiner Angreifer, und viele ihrer Schläge gehen einfach ins Leere.","nl":"Een raadselbewaker van de woestijnhemel — hij vertroebelt de geest van zijn aanvallers en veel van hun slagen missen gewoon.","pl":"Strażnik zagadek pustynnego nieba — mąci umysł napastników, a wiele ich ciosów po prostu chybia.","ru":"Хранитель загадок пустынного неба: туманит разум нападающих, и многие их удары просто летят мимо.","tr":"Çöl göğünün bilmece bekçisi — saldırganlarının zihnini bulandırır, darbelerinin çoğu ıskalar."},"sirene":{"fr":"Une sirène des royaumes engloutis — son chant soigne toute l'équipe et garde la marée de son côté.","es":"Una sirena de los reinos sumergidos: su canto cura a todo el equipo y mantiene la marea de su lado.","pt":"Uma sereia dos reinos submersos — seu canto cura toda a equipe e mantém a maré a seu favor.","it":"Una sirena dei regni sommersi: il suo canto cura tutta la squadra e tiene la marea dalla sua parte.","de":"Eine Sirene der versunkenen Reiche – ihr Gesang heilt das ganze Team und hält die Flut auf ihrer Seite.","nl":"Een zeemeermin uit de verzonken koninkrijken — haar lied geneest het hele team en houdt het tij aan haar kant.","pl":"Syrena zatopionych królestw — jej pieśń leczy całą drużynę i trzyma przypływ po jej stronie.","ru":"Сирена затонувших королевств: её песня лечит всю команду и держит прилив на её стороне.","tr":"Batık krallıkların bir su perisi — şarkısı tüm takımı iyileştirir ve gelgiti onun yanında tutar."},"basilic":{"fr":"Un serpent couronné des vieilles ruines dont le regard change le sang en pierre — chaque morsure affaiblit un peu plus sa proie.","es":"Una serpiente coronada de las viejas ruinas cuya mirada convierte la sangre en piedra: cada mordisco debilita más a su presa.","pt":"Uma serpente coroada das velhas ruínas cujo olhar transforma sangue em pedra — cada mordida deixa a presa mais fraca.","it":"Un serpente coronato delle antiche rovine il cui sguardo trasforma il sangue in pietra: ogni morso indebolisce di più la preda.","de":"Eine gekrönte Schlange alter Ruinen, deren Blick Blut zu Stein macht – jeder Biss schwächt die Beute mehr.","nl":"Een gekroonde slang uit oude ruïnes wier blik bloed in steen verandert — elke beet maakt haar prooi zwakker.","pl":"Ukoronowany wąż dawnych ruin, którego spojrzenie zamienia krew w kamień — każde ukąszenie osłabia ofiarę.","ru":"Коронованный змей древних руин, чей взгляд обращает кровь в камень: каждый укус ослабляет добычу.","tr":"Eski harabelerin taçlı yılanı, bakışı kanı taşa çevirir — her ısırık avını biraz daha zayıflatır."},"wyverne":{"fr":"Un dragon à deux pattes des nuages d'orage — sa queue venimeuse empoisonne, et ses piqués surgissent de nulle part.","es":"Un dragón de dos patas de las nubes de tormenta: su cola ponzoñosa envenena y sus picados surgen de la nada.","pt":"Um dragão de duas patas das nuvens de tempestade — sua cauda venenosa envenena, e seus mergulhos surgem do nada.","it":"Un drago a due zampe delle nubi temporalesche: la coda velenosa avvelena e i suoi affondi arrivano dal nulla.","de":"Ein zweibeiniger Drache der Gewitterwolken – sein Giftstachel vergiftet, und seine Sturzflüge kommen aus dem Nichts.","nl":"Een tweepotige draak van de onweerswolken — zijn angel vergiftigt en zijn duikvluchten komen uit het niets.","pl":"Dwunożny smok burzowych chmur — jego żądło zatruwa, a jego loty nurkowe pojawiają się znikąd.","ru":"Двуногий дракон грозовых туч: его жало отравляет, а пикирования налетают из ниоткуда.","tr":"Gök gürültülü bulutların iki ayaklı ejderi — sokan kuyruğu zehirler, dalışları durup dururken gelir."},"cerbere":{"fr":"Le gardien à trois têtes des portes des enfers — ses chaînes absorbent les coups destinés à ses alliés.","es":"El guardián de tres cabezas de las puertas del inframundo: sus cadenas absorben los golpes dirigidos a sus aliados.","pt":"O guardião de três cabeças dos portões do submundo — suas correntes absorvem os golpes destinados aos aliados.","it":"Il guardiano a tre teste delle porte degli inferi: le sue catene assorbono i colpi destinati ai suoi alleati.","de":"Der dreiköpfige Wächter der Unterweltpforten – seine Ketten fangen die Schläge ab, die seinen Verbündeten gelten.","nl":"De driekoppige bewaker van de poorten van de onderwereld — zijn kettingen vangen de klappen op die voor zijn bondgenoten bedoeld zijn.","pl":"Trójgłowy strażnik bram podziemi — jego łańcuchy przejmują ciosy przeznaczone dla sojuszników.","ru":"Трёхглавый страж врат подземного мира: его цепи принимают на себя удары, предназначенные союзникам.","tr":"Yeraltı kapılarının üç başlı bekçisi — zincirleri müttefiklerine gelen darbeleri üstlenir."},"kelpie":{"fr":"Un cheval d'eau métamorphe des lacs brumeux — il redonne courage à ses alliés et emporte les blessés hors de danger.","es":"Un caballo de agua cambiaformas de los lagos brumosos: levanta el ánimo de sus aliados y saca a los heridos del peligro.","pt":"Um cavalo d'água metamorfo dos lagos nebulosos — anima os aliados e leva os feridos para longe do perigo.","it":"Un cavallo d'acqua mutaforma dei laghi nebbiosi: solleva il morale degli alleati e porta i feriti fuori pericolo.","de":"Ein gestaltwandelndes Wasserpferd der Nebelseen – es hebt die Moral seiner Verbündeten und trägt Verwundete aus der Gefahr.","nl":"Een vormveranderend waterpaard van de mistige meren — het geeft bondgenoten moed en draagt gewonden uit de gevarenzone.","pl":"Zmiennokształtny wodny koń mglistych jezior — podnosi morale sojuszników i wynosi rannych z niebezpieczeństwa.","ru":"Водяной конь-оборотень туманных озёр: поднимает дух союзников и выносит раненых из опасности.","tr":"Sisli göllerin şekil değiştiren su atı — müttefiklerinin moralini yükseltir ve yaralıları tehlikeden uzaklaştırır."},"dragon_celeste":{"fr":"Un dragon blanc et or couvert de cristal, né là où les nuages rencontrent les étoiles — il déborde de tout cadre qui tente de le retenir, et rien ne résiste à son souffle prismatique.","es":"Un dragón blanco y dorado cubierto de cristal, nacido donde las nubes se encuentran con las estrellas: desborda cualquier marco que intente contenerlo y nada resiste su aliento prismático.","pt":"Um dragão branco e dourado coberto de cristal, nascido onde as nuvens encontram as estrelas — ele rompe qualquer moldura que tente contê-lo, e nada resiste ao seu sopro prismático.","it":"Un drago bianco e oro avvolto di cristallo, nato dove le nuvole incontrano le stelle: esce da ogni cornice che cerca di trattenerlo e nulla resiste al suo soffio prismatico.","de":"Ein weiß-goldener Drache, von Kristall umhüllt, geboren dort, wo die Wolken die Sterne berühren – er sprengt jeden Rahmen, der ihn halten will, und nichts hält seinem prismatischen Atem stand.","nl":"Een wit-gouden draak omhuld door kristal, geboren waar de wolken de sterren ontmoeten — hij breekt uit elk kader dat hem wil vasthouden en niets weerstaat zijn prismatische adem.","pl":"Biało-złoty smok spowity kryształem, zrodzony tam, gdzie chmury spotykają gwiazdy — wyrywa się z każdej ramy, która próbuje go zatrzymać, i nic nie oprze się jego pryzmatycznemu oddechowi.","ru":"Бело-золотой дракон в кристаллах, рождённый там, где облака встречаются со звёздами: он вырывается из любой рамы, а его призматическому дыханию ничто не противостоит.","tr":"Kristalle sarılı beyaz-altın bir ejderha, bulutların yıldızlarla buluştuğu yerde doğdu — onu tutmaya çalışan her çerçeveyi aşar, prizmatik nefesine hiçbir şey karşı koyamaz."},"eikthyrnir":{"fr":"Le grand cerf de l'Arbre-Monde, aux bois couronnés d'émeraude et d'or — un rempart vivant qui protège toute l'équipe et renvoie chaque coup à son auteur.","es":"El gran ciervo del Árbol del Mundo, con astas coronadas de esmeralda y oro: un baluarte viviente que protege a todo el equipo y devuelve cada golpe a quien lo lanzó.","pt":"O grande cervo da Árvore do Mundo, com chifres coroados de esmeralda e ouro — um baluarte vivo que protege toda a equipe e devolve cada golpe a quem o deu.","it":"Il grande cervo dell'Albero del Mondo, con corna incoronate di smeraldo e oro: un baluardo vivente che protegge tutta la squadra e rimanda ogni colpo a chi lo ha sferrato.","de":"Der große Hirsch des Weltenbaums, sein Geweih von Smaragd und Gold gekrönt – ein lebendiges Bollwerk, das das ganze Team schützt und jeden Schlag zurücksendet.","nl":"De grote hert van de Wereldboom, zijn gewei gekroond met smaragd en goud — een levend bolwerk dat het hele team beschermt en elke klap terugstuurt.","pl":"Wielki jeleń Drzewa Świata, o porożu ukoronowanym szmaragdem i złotem — żywy bastion, który chroni całą drużynę i odsyła każdy cios.","ru":"Великий олень Мирового древа с рогами, увенчанными изумрудом и золотом: живой бастион, защищающий всю команду и возвращающий каждый удар.","tr":"Dünya Ağacı'nın zümrüt ve altınla taçlanmış boynuzlu büyük geyiği — tüm takımı koruyan, her darbeyi geri gönderen canlı bir kale."},"jormungandr":{"fr":"Le Serpent-Monde, enroulé autour des ruines englouties au fond de la mer — sa morsure venimeuse ne s'arrête jamais, et la marée elle-même obéit à ses anneaux.","es":"La Serpiente del Mundo, enroscada en las ruinas sumergidas del fondo del mar: su mordedura venenosa no cesa y la marea misma obedece a sus anillos.","pt":"A Serpente do Mundo, enrolada nas ruínas submersas no fundo do mar — sua mordida venenosa nunca para, e a própria maré obedece aos seus anéis.","it":"Il Serpente del Mondo, avvolto attorno alle rovine sommerse sul fondo del mare: il suo morso velenoso non si ferma mai e la marea stessa obbedisce alle sue spire.","de":"Die Weltenschlange, um die versunkenen Ruinen am Meeresgrund gewunden – ihr Giftbiss hört nie auf, und selbst die Gezeiten gehorchen ihren Windungen.","nl":"De Wereldslang, gekronkeld rond de verzonken ruïnes op de zeebodem — haar giftige beet houdt nooit op en zelfs het tij gehoorzaamt haar windingen.","pl":"Wąż Świata, owinięty wokół zatopionych ruin na dnie morza — jego jadowite ugryzienie nie ustaje, a sam przypływ słucha jego splotów.","ru":"Мировой змей, обвивший затонувшие руины на дне моря: его ядовитый укус не прекращается, а сам прилив подчиняется его кольцам.","tr":"Deniz dibindeki batık harabelere dolanmış Dünya Yılanı — zehirli ısırığı hiç durmaz, gelgit bile kıvrımlarına itaat eder."}};

function deepMerge(base,over){
  const out=Array.isArray(base)?base.slice():Object.assign({},base);
  for(const [k,v] of Object.entries(over||{})){
    out[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&base&&typeof base[k]==="object"&&!Array.isArray(base[k]))?deepMerge(base[k],v):v;
  }
  return out;
}

function fxChips(fx){
  if(!fx)return"";
  const L=t().fx;const out=[];
  for(const [k,v] of Object.entries(fx)){
    if(k==="reviveFraction"||["dot","vuln","fear","dodge","opening","share","rescue"].includes(k))continue;
    let val="";
    if(k==="revive"&&fx.reviveFraction)val=" "+Math.round(fx.reviveFraction*100)+"%";
    else if(typeof v==="number")val=" "+(["rage","guard","encourage","reflect","lifesteal","thorns","chainHeal"].includes(k)?Math.round(v*100):v)+"%";
    if(L[k])out.push('<span class="fxc">'+L[k]+val+'</span>');
  }
  return out.join("")+newFxChips(fx);
}

function drawGrid(){
  const g=$("#grid");if(!g)return;g.innerHTML="";
  const q=F.q.trim().toLowerCase();
  const list=DATA.animals.filter(a=>
    (F.type==="all"||a.type===F.type)&&
    (F.role==="all"||a.roles.includes(F.role))&&
    (F.from==="all"||originOf(a)===F.from)&&
    (!P||F.own==="all"||(F.own==="own")===ownedSet().has(a.id))&&
    (!q||a.name.toLowerCase().includes(q)||a.id.includes(q)));
  const order={defense:0,soutien:1,attaque:2};
  list.sort((a,b)=>(a.mythic-b.mythic)*-1||order[role(a)]-order[role(b)]||a.name.localeCompare(b.name));
  $("#count").textContent=t().n(list.length);
  if(!list.length){g.outerHTML='<p class="empty" id="grid">'+t().none+'</p>';return}
  list.forEach(a=>g.appendChild(card(a)));
}

function eventList(){
  const ev={};
  for(const a of DATA.animals){if(!a.event||a.event==="start")continue;(ev[a.event]??=[]).push(a)}
  return Object.entries(ev).map(([id,list])=>({id,list,start:list[0].start,end:list[0].end})).sort((x,y)=>new Date(x.start)-new Date(y.start));
}
function renderEvents(){
  const root=$("#v-events");const L=t();
  root.innerHTML='<h2 class="title">'+L.ev_title+'</h2><p class="lead">'+L.ev_lead+'</p>';
  const now=Date.now();
  const evs=eventList();
  const live=evs.filter(e=>new Date(e.start)<=now&&now<=new Date(e.end));
  const next=evs.filter(e=>new Date(e.start)>now);
  const past=evs.filter(e=>new Date(e.end)<now);
  const block=(e,state)=>{
    const d=document.createElement("div");d.className="eblock"+(state==="past"?" past":"");
    let st="";
    if(state==="live")st='<span class="status live">'+L.live+" · "+L.left(dayDiff(e.end))+'</span>';
    else if(state==="next")st='<span class="status soon">'+L.soon(dayDiff(e.start))+'</span>';
    else st='<span class="status">'+L.ended+'</span>';
    d.innerHTML='<div class="ehead"><h3>'+(THEME_EMO[e.id]||"🎉")+" "+L.ev_names[e.id]+'</h3>'+st+
      '<div class="dates">'+fmtDate(e.start)+" → "+fmtDate(e.end)+'</div></div>';
    const g=document.createElement("div");g.className="egrid";
    e.list.forEach(a=>g.appendChild(card(a)));d.appendChild(g);return d;
  };
  const section=(title,arr,state)=>{if(!arr.length)return;const h=document.createElement("div");h.className="group-t";h.textContent=title;root.appendChild(h);arr.forEach(e=>root.appendChild(block(e,state)))};
  section(L.ev_now,live,"live");section(L.ev_next,next,"next");section(L.ev_past,past,"past");
}

/* ---------- "to do now" (profile) ---------- */
function bestAddition(ty){
  const own=ownedSet();const mine=DATA.animals.filter(a=>a.type===ty&&own.has(a.id));
  if(mine.length<3)return null;
  const cur=bestTrios(mine,1)[0];let best=null;
  for(const c of DATA.animals.filter(a=>a.type===ty&&!own.has(a.id)&&availNow(a))){
    const r=bestTrios(mine.concat([c]),1)[0];
    if(r&&r.v>cur.v+0.02&&(!best||r.v-cur.v>best.gain)){
      const slot=r.d.id===c.id?"defense":(r.s.id===c.id?"soutien":(r.a.id===c.id?"attaque":null));
      if(!slot)continue;
      const ids=[r.d,r.s,r.a];
      best={gain:r.v-cur.v,c,slot,out:[cur.d,cur.s,cur.a].find(x=>!ids.some(y=>y.id===x.id))};
    }
  }
  return best;
}
function todoHtml(){
  const L=t();const own=ownedSet();const now=Date.now();const items=[];
  const chests=Object.values(P.chests||{}).reduce((x,y)=>x+(Number(y)||0),0);
  if(chests>0)items.push(L.todo_chests(chests));
  if((P.points||0)>0)items.push(L.todo_points(P.points));
  for(const e of eventList()){
    const st=new Date(e.start).getTime(),en=new Date(e.end).getTime();
    const name=(THEME_EMO[e.id]||"🎉")+" "+(L.ev_names[e.id]||e.id);
    if(st<=now&&now<=en){
      const miss=e.list.filter(a=>!own.has(a.id));
      items.push(miss.length?L.todo_ev(name,Math.max(0,dayDiff(e.end)),miss.length,miss.map(a=>esc(a.name)).join(", ")):L.todo_ev_ok(name));
    }else if(st>now&&dayDiff(e.start)<=21)items.push(L.todo_next(name,dayDiff(e.start)));
  }
  let bm=null;
  for(const id of (DATA.mythics||[])){
    if(own.has(id)||!byId[id])continue;const g=mythicProg(id);
    const r=g.total?g.done/g.total:0;if(!bm||r>bm.r)bm={r,id,g};
  }
  if(bm&&bm.r>0)items.push(L.todo_myth(esc(byId[bm.id].name),bm.g.done,bm.g.total));
  let ba=null,bty=null;
  for(const ty of ["terre","air","eau"]){const b=bestAddition(ty);if(b&&(!ba||b.gain>ba.gain)){ba=b;bty=ty}}
  if(ba)items.push(L.todo_add(esc(ba.c.name),TYPE_EMO[bty]+" "+L.types[bty],L.id_slots[ba.slot],ba.out?esc(ba.out.name):null));
  return '<h3 class="sec">'+L.todo_t+'</h3>'+(items.length?'<ul class="todo">'+items.map(x=>'<li>'+x+'</li>').join("")+'</ul>':'<p class="tip">'+L.todo_none+'</p>');
}

let IDEA_TYPE="terre";
function availNow(a){
  if(a.mythic)return false;
  if(!a.event||a.event==="start")return true;
  const n=Date.now();return n>=Date.parse(a.start)&&n<=Date.parse(a.end);
}
function bestTrios(pool,k){
  const S=DATA.sc,out=[];
  const D=pool,Su=pool,A=pool;
  for(const d of D)for(const s of Su){if(s.id===d.id)continue;for(const a of A){if(a.id===d.id||a.id===s.id)continue;
    out.push({d,s,a,v:S[d.id].defense+S[s.id].soutien+S[a.id].attaque})}}
  out.sort((x,y)=>y.v-x.v);
  // keep trios that differ by at least 2 animals from the ones already kept
  const keep=[];
  for(const c of out){
    if(keep.every(k2=>[c.d.id,c.s.id,c.a.id].filter(id=>[k2.d.id,k2.s.id,k2.a.id].includes(id)).length<=1)){keep.push(c);if(keep.length>=k)break}
  }
  return keep;
}

/* ---------- profile (Supabase) ---------- */
async function fetchProfile(token){
  pState="loading";
  try{
    const res=await fetch(SB_URL+"/rest/v1/rpc/get_profile",{method:"POST",
      headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({p_token:token})});
    if(!res.ok){let m="";try{m=(await res.text()).slice(0,160)}catch(_){}throw new Error("HTTP "+res.status+(m?" — "+m:""))}
    const data=await res.json();
    if(data&&typeof data==="object"&&Array.isArray(data.owned)){P=data;pState="ok";pDetail=""}
    else{P=null;pState="bad";pDetail="token "+String(token).slice(0,6)+"… ("+String(token).length+" car.) — "+(data===null?"aucun profil trouvé pour ce lien":"réponse inattendue");try{localStorage.removeItem(TOKEN_KEY)}catch(e){}}
  }catch(e){P=null;pState="err";pDetail=String(e&&e.message||e)}
}
function storedToken(){try{return localStorage.getItem(TOKEN_KEY)}catch(e){return null}}
function afterProfile(){
  const h=location.hash;show(view);if(h.startsWith("#pet/"))openPet(h.slice(5));
}
async function initProfile(token){
  if(token){try{localStorage.setItem(TOKEN_KEY,token)}catch(e){}SHOP.data=null;SHOP.state="none";SHOP.msg=""}
  const tk=token||storedToken();if(!tk)return;
  if(view==="me")renderMe();
  await fetchProfile(tk);afterProfile();
}
function logout(){try{localStorage.removeItem(TOKEN_KEY)}catch(e){}SHOP.data=null;SHOP.state="none";SHOP.msg="";P=null;pState="none";F.own="all";show(view)}
function ago(iso){
  const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(s<60)return t().ago;
  const rtf=new Intl.RelativeTimeFormat(LOCALE[lang],{numeric:"auto"});
  if(s<3600)return rtf.format(-Math.round(s/60),"minute");
  if(s<86400)return rtf.format(-Math.round(s/3600),"hour");
  return rtf.format(-Math.round(s/86400),"day");
}
function mythicProg(id){
  const own=ownedSet(),st=P.stars||{},now=Date.now(),A=DATA.animals;
  const ended=a=>a.end&&now>new Date(a.end).getTime();
  const required=a=>!a.mythic&&(!a.event||own.has(a.id)||!ended(a));
  const series=ty=>{const l=A.filter(a=>a.type===ty&&required(a));return{done:l.filter(a=>own.has(a.id)&&(st[a.id]||0)>=DATA.stars).length,total:l.length}};
  switch(id){
    case"mammouth_ancestral":return series("terre");
    case"phenix":return series("air");
    case"leviathan":return series("eau");
    case"griffon":{const l=A.filter(a=>!a.mythic&&(!a.event||a.event==="start"));return{done:l.filter(a=>own.has(a.id)).length,total:l.length}}
    case"licorne_saisons":{const all=A.filter(a=>!a.mythic&&a.event&&a.event!=="start");const need=all.filter(a=>own.has(a.id)||!ended(a));return{done:all.filter(a=>own.has(a.id)).length,total:Math.max(need.length,DATA.mythicMin)}}
    case"hydre":return{done:Math.min(DATA.mythicTower,P.towerBest||0),total:DATA.mythicTower};
    case"ouroboros":{const others=["mammouth_ancestral","phenix","leviathan","griffon","licorne_saisons","hydre"];
      const ow=A.filter(a=>a.id!=="ouroboros"&&own.has(a.id)&&a.weapon);
      const forged=ow.filter(a=>(P.items||[]).some(i=>i.tier==="legendary"&&i.animalId===a.id)).length;
      return{done:others.filter(i=>own.has(i)).length+forged,total:others.length+ow.length}}
  }
  return{done:0,total:1};
}
function bar(done,total,color){
  const pc=total?Math.min(100,Math.round(done/total*100)):0;
  return '<div class="pbar" style="--tc:'+(color||"var(--text)")+'" role="progressbar" aria-valuenow="'+done+'" aria-valuemax="'+total+'"><i style="width:'+pc+'%"></i></div>';
}

     '<div><button class="btn" id="rf">'+L.me_refresh+'</button> <button class="btn" id="lo">'+L.me_logout+'</button></div></div>';

  for(const ty of ["terre","air","eau"]){
    const l=A.filter(a=>a.type===ty);const n=l.filter(a=>own.has(a.id)).length;
    h+='<div class="prog"><div class="row"><span>'+TYPE_EMO[ty]+" "+L.types[ty]+'</span><span>'+n+' / '+l.length+'</span></div>'+bar(n,l.length,"var(--"+ty+")")+'</div>';

  const tys=ids.map(i=>byId[i]&&byId[i].type);
  if(tys[0]&&tys.every(x=>x===tys[0]))h+='<p class="hint">'+L.me_trio(Math.round((DATA.trio[tys[0]]-1)*100),L.types[tys[0]])+'</p>';
  else h+='<p class="hint">'+L.me_mixed+'</p>';
  // mythics
  h+='<h3 class="sec">'+L.me_myth+'</h3>';
  for(const id of MYTH_ORDER){
    const a=byId[id];if(!a)continue;
    const got=own.has(id);const p=mythicProg(id);
    h+='<div class="prog'+(got?" done":"")+'"><div class="row"><span>'+a.emoji+" "+esc(a.name)+'</span><span>'+(got?"✅ "+L.me_unlocked:p.done+" / "+p.total)+'</span></div>'+
       (got?"":bar(p.done,p.total,"var(--mythic)")+'<p class="hint" style="margin:8px 0 0">'+L.my_how[id]+'</p>')+'</div>';
  }
  // chests
  const c=P.chests||{};
  h+='<h3 class="sec">'+L.me_chests+'</h3><div class="tiles" style="grid-template-columns:repeat(3,1fr)">'+
    ["bronze","silver","gold"].map((k,i)=>'<div class="tile"><b>'+["🟤","⚪","🟡"][i]+" "+(c[k]||0)+'</b><span>'+L.tiers[k]+'</span></div>').join("")+'</div>';
  // items
  const items=(P.items||[]).slice().sort((x,y)=>["legendary","gold","silver","bronze"].indexOf(x.tier)-["legendary","gold","silver","bronze"].indexOf(y.tier));
  h+='<h3 class="sec">'+L.me_items+' ('+items.length+')</h3>';
  if(!items.length)h+='<p class="hint">'+L.me_noitems+'</p>';
  else{
    h+=itemsListHtml(items);
  }
  root.innerHTML=h;
  $("#rf").onclick=()=>initProfile();$("#lo").onclick=logout;
  root.querySelectorAll("[data-slot]").forEach(el=>{const a=byId[el.dataset.slot];if(a)el.appendChild(card(a))});
