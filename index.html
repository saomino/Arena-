const shopT=()=>SHOP_T[lang]||SHOP_T.en;
const SHOP={data:null,state:"none",msg:"",busy:false,confirm:null};
async function shopRpc(fn,args){
  const res=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!res.ok)throw new Error("HTTP "+res.status);
  return res.json();
}
async function fetchShop(){
  const tk=storedToken();if(!tk){SHOP.state="none";SHOP.data=null;return}
  SHOP.state="loading";
  try{
    const d=await shopRpc("get_shop",{p_token:tk});
    if(d&&Array.isArray(d.items)){SHOP.data=d;SHOP.state="ok"}else{SHOP.data=null;SHOP.state="bad"}
  }catch(e){SHOP.state="err"}
}
function fmtShortDate(iso){return new Intl.DateTimeFormat(LOCALE[lang],{day:"numeric",month:"short"}).format(new Date(iso))}
function famStatus(it){
  const now=Date.now(),f=it.avail_from?new Date(it.avail_from).getTime():null,e=it.avail_to?new Date(it.avail_to).getTime():null;
  if(f&&now<f)return"soon";if(e&&now>e)return"ended";return"open";
}
function famCard(it,d,L){
  const m=FAMS[it.id];if(!m)return"";
  const owned=(d.owned||[]).includes(it.id),on=d.active===it.id;
  const st=!it.enabled?"soon":famStatus(it),ev=m.ev,isEv=it.tier==="event"&&ev;
  const name=m.n;
  let note="";
  if(it.tier==="gift"&&!owned)note='<div class="evnote">'+(it.id==="glitchy"?(lang==="fr"?"Ultra rare : pendant un événement, quand tu es sur la piste d'un animal d'événement en /explore, il peut surgir à la place.":"Ultra rare: during an event, when you are on the trail of an event animal with /explore, it can show up instead."):L.gift_note)+'</div>';
  if(isEv){
    const e=it.avail_to?new Date(it.avail_to).getTime():null;
    if(st==="open"&&e){const n=Math.ceil((e-Date.now())/86400000);note='<div class="evnote">⏳ '+L.until(fmtShortDate(it.avail_to))+" · "+L.leftd(n)+'</div>'}
    else if(st==="soon"&&it.avail_from)note='<div class="evnote">📅 '+L.from(fmtShortDate(it.avail_from))+'</div>';
    else if(st==="ended")note='<div class="evnote">'+L.ended+'</div>';
  }
  let btn;
  if(owned&&on)btn='<button class="btn on" data-act="unequip" data-id="'+it.id+'">'+L.equipped+'</button>';
  else if(owned)btn='<button class="btn" data-act="equip" data-id="'+it.id+'">'+L.equip+'</button>';
  else if(it.tier==="gift")btn='<button class="btn" disabled>'+L.gift_btn+'</button>';
  else if(st==="soon")btn='<button class="btn" disabled>'+L.soon+'</button>';
  else if(st==="ended")btn='<button class="btn" disabled>'+L.ended+'</button>';
  else if(d.diamonds<it.price)btn='<button class="btn" disabled>💎 '+it.price+'</button><div class="need">'+L.miss(it.price-d.diamonds)+'</div>'+bar(d.diamonds,it.price,"var(--mythic)");
  else btn='<button class="btn buy" data-act="buy" data-id="'+it.id+'">'+(SHOP.confirm===it.id?L.confirm:L.buy+" · 💎 "+it.price)+'</button>';
  const dim=!owned&&(st==="soon"||st==="ended");
  const tierLabel=isEv?EVENT_NAME[ev][0]+" "+EVENT_NAME[ev][lang==="fr"?1:2]:(L.tiers[it.tier]||"");
  return '<div class="fcard t-'+it.tier+(dim?" soon":"")+(on?" equipped":"")+(isEv?" isev":"")+'"'+(isEv?' style="--tc:'+EVENT_COLOR[ev]+'"':"")+'>'+
    '<div class="fimg'+(isEv?" scene":"")+'"><img src="'+FAM_IMG[it.id]+'" alt="'+esc(name)+'" loading="lazy"></div>'+
    '<div class="fmeta"><b>'+esc(name)+'</b><span class="ftier">'+tierLabel+'</span></div>'+
    '<p class="fpers">'+m.e+" "+esc(m[lang==="fr"?"fr":"en"])+'</p>'+
    '<p class="fquote">'+(m.q&&!dim?"« "+esc(m.q)+" »":"")+'</p>'+note+
    '<div class="fbuy">'+btn+'</div></div>';
}
function renderShop(){
  const root=$("#v-shop"),L=shopT();
  let h='<h2 class="title">'+L.title+'</h2><p class="lead">'+L.lead+'</p>';
  if(!storedToken()){root.innerHTML=h+'<div class="note"><b>'+L.need_t+'</b><br>'+L.need+'</div>';return}
  if(!SHOP.data){
    if(SHOP.state==="none"){fetchShop().then(()=>{if(view==="shop")renderShop()})}
    if(SHOP.state==="bad"){root.innerHTML=h+'<div class="note"><b>⚠️</b><br>'+L.bad+'</div>';return}
    if(SHOP.state==="err"){root.innerHTML=h+'<div class="note"><b>⚠️</b><br>'+L.err+'</div><button class="btn" data-act="retry">'+L.retry+'</button>';
      root.onclick=e=>{if(e.target.closest("[data-act=retry]")){SHOP.state="none";renderShop()}};return}
    root.innerHTML=h+'<p class="lead">'+L.loading+'</p>';return;
  }
  const d=SHOP.data;
  h+='<div class="wallet"><div><div class="big">💎 '+d.diamonds+'</div><small>'+L.bal+' · '+L.balh+'</small></div><button class="btn" data-act="refresh">'+L.refresh+'</button></div>';
  if(SHOP.msg)h+='<div class="shopmsg" role="status">'+esc(SHOP.msg)+'</div>';
  const fam=(d.items||[]).filter(i=>i.kind==="familier");
  const regular=fam.filter(i=>i.tier!=="event"),events=fam.filter(i=>i.tier==="event");
  const evRank=i=>{const s=famStatus(i);const own=(d.owned||[]).includes(i.id);return s==="open"?0:own?1:s==="soon"?2:3};
  events.sort((x,y)=>evRank(x)-evRank(y)||(new Date(x.avail_from||0)-new Date(y.avail_from||0)));
  h+='<div class="shopgrid">'+regular.map(i=>famCard(i,d,L)).join("")+'</div>';
  if(events.length)h+='<h3 class="sec">'+L.ev_title+'</h3><p class="hint" style="margin-top:-4px">'+L.ev_lead+'</p><div class="shopgrid">'+events.map(i=>famCard(i,d,L)).join("")+'</div>';
  h+='<p class="hint">'+L.hint+'</p>';
  root.innerHTML=h;
  root.onclick=e=>{const b=e.target.closest("[data-act]");if(b&&!b.disabled)shopAct(b.dataset.act,b.dataset.id)};
}
async function shopAct(kind,id){
  if(SHOP.busy)return;const L=shopT(),tk=storedToken();
  if(kind==="refresh"){SHOP.msg="";await fetchShop();if(view==="shop")renderShop();return}
  if(kind==="buy"&&SHOP.confirm!==id){
    SHOP.confirm=id;renderShop();
    setTimeout(()=>{if(SHOP.confirm===id){SHOP.confirm=null;if(view==="shop")renderShop()}},4000);return;
  }
  SHOP.busy=true;SHOP.confirm=null;SHOP.msg="";
  try{
    const r=await shopRpc(kind==="buy"?"buy_item":"equip_item",{p_token:tk,p_item:kind==="unequip"?"":id});
    if(r&&r.ok){await fetchShop();SHOP.msg=kind==="buy"?L.bought:""}
    else SHOP.msg=L.errs[r&&r.error]||L.errs.x;
  }catch(e){SHOP.msg=L.errs.x}
  SHOP.busy=false;if(view==="shop")renderShop();
}

async function loadBattle(id){
  if(!id){BAT={state:"gone",id:null,data:null};renderBattle();return}
  if(BAT.id===id&&BAT.state==="ok"){renderBattle();return}
  BAT={state:"loading",id,data:null};renderBattle();
  try{
    const res=await fetch(SB_URL+"/rest/v1/rpc/get_battle",{method:"POST",
      headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({p_id:id})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const j=await res.json();
    if(BAT.id!==id)return;
    if(j&&j.data&&Array.isArray(j.data.turns))BAT={state:"ok",id,data:j.data,kind:j.kind,at:j.created_at};
    else BAT={state:"gone",id,data:null};
  }catch(e){if(BAT.id===id)BAT={state:"err",id,data:null}}
  renderBattle();
}
function btChart(d){
  const W=640,H=230,x0=44,x1=W-16,y0=16,y1=H-34,n=d.turns.length;
  const xs=i=>x0+(n?(x1-x0)*i/n:0),ys=v=>y1-(y1-y0)*Math.max(0,Math.min(1,v));
  const bp=[[0,1],...d.turns.map((t,i)=>[i+1,d.boss.maxHp?t.bossHp/d.boss.maxHp:0])];
  const tp=[[0,1],...d.turns.map((t,i)=>[i+1,d.teamMax?t.teamHp/d.teamMax:0])];
  const line=(pts,c)=>'<polyline fill="none" stroke="'+c+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(p=>xs(p[0]).toFixed(1)+","+ys(p[1]).toFixed(1)).join(" ")+'"/>'+
    pts.map(p=>'<circle cx="'+xs(p[0]).toFixed(1)+'" cy="'+ys(p[1]).toFixed(1)+'" r="3.6" fill="'+c+'"/>').join("");
  let g="";
  for(const v of [0,.5,1])g+='<line x1="'+x0+'" x2="'+x1+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(x0-8)+'" y="'+(ys(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+Math.round(v*100)+'%</text>';
  for(let i=1;i<=n;i++)g+='<text x="'+xs(i)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+i+'</text>';
  return '<svg class="btchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(btT().chart)+'">'+g+line(bp,"var(--atk)")+line(tp,"var(--sup)")+'</svg>';
}
function btEvent(e,B){
  const e0=e.e||"",out=[];
  const sub=[];
  if(e.c==="attaque")out.push(B.atk(e0,e.a,e.s,e.amt));
  else if(e.c==="defense"){out.push(B.def(e0,e.a,e.s,guardPct(e.amt)));if(e.fx&&e.fx.dodge)sub.push(B.dodgeFx(e.fx.dodge));if(e.fx&&e.fx.share)sub.push(B.shareFx(Math.round(e.fx.share*100)))}
  else{
    const fx=e.fx||{},pure=!!(fx.encourage||fx.guard)&&!fx.revive&&!fx.teamWide;
    if(e.rev)out.push(B.revive(e0,e.a,e.s,e.amt));
    else if(fx.teamWide)out.push(B.teamheal(e0,e.a,e.s,e.amt));
    else if(pure)out.push(B.buff(e0,e.a,e.s));
    else out.push(e.amt>0?B.heal(e0,e.a,e.s,e.amt):B.heal0(e0,e.a,e.s));
    if(fx.encourage)sub.push(B.bd(Math.round(fx.encourage*100)));
    if(fx.guard)sub.push(B.bg(Math.round(fx.guard*100)));
  }
  for(const s of e.st||[])sub.push(B.st(s.k,s.v,s.t));
  return '<li class="bev c-'+e.c+'"><span>'+esc(out[0])+'</span>'+sub.map(x=>'<small>'+esc(x)+'</small>').join("")+'</li>';
}
function renderBattle(){
  const root=$("#v-battle");if(!root)return;
  const B=btT();
  let h='<p style="margin:6px 0 12px"><a href="#animals" class="back">'+B.back+'</a></p>';
  if(BAT.state==="loading"||BAT.state==="idle"){root.innerHTML=h+'<p class="tip">'+B.loading+'</p>';return}
  if(BAT.state==="gone"){root.innerHTML=h+'<p class="tip">'+B.gone+'</p>';return}
  if(BAT.state==="err"){root.innerHTML=h+'<p class="tip">'+B.err+' <button class="chip" id="btretry" type="button">'+B.retry+'</button></p>';
    const b=$("#btretry");if(b)b.onclick=()=>{const id=BAT.id;BAT.state="idle";loadBattle(id)};return}
  const d=BAT.data,boss=d.boss;
  const kindTag=d.kind==="tower"&&d.extra?B.tower(d.extra.floor):"";
  h+='<div class="bthead '+(d.victory?"win":"loss")+'"><div class="bte">'+esc(boss.emoji||"👾")+'</div><div><h2>'+esc(d.label||"")+' <span>vs</span> '+esc(boss.name)+'</h2>'+
     '<div class="btbadges"><span class="pill">'+(d.victory?"🏆 "+B.win:"💀 "+B.loss)+'</span>'+(kindTag?'<span class="pill">🗼 '+esc(kindTag)+'</span>':"")+
     (boss.type?'<span class="pill">'+(TYPE_EMO[boss.type]||"")+" "+((t().types||{})[boss.type]||boss.type)+'</span>':"")+'<span class="pill">❤️ '+boss.maxHp+'</span></div></div></div>';
  const T=d.totals||{};
  h+='<div class="btstats"><div><b>'+T.dmg+'</b><span>'+B.s_dmg+'</span>'+(T.state?'<small>'+B.s_dot(T.state)+'</small>':"")+'</div><div><b>'+T.heal+'</b><span>'+B.s_heal+'</span></div><div><b>'+T.blocked+'</b><span>'+B.s_block+'</span></div><div><b>'+d.turns.length+'</b><span>'+B.s_turns+'</span></div></div>';
  h+='<h3 class="sec">'+B.chart+'</h3><div class="btbox">'+btChart(d)+'<div class="btleg"><span><i style="background:var(--atk)"></i>'+B.c_boss+'</span><span><i style="background:var(--sup)"></i>'+B.c_team+'</span></div><p class="hint" style="margin:8px 0 0">'+B.c_hint+'</p></div>';
  const last=d.turns[d.turns.length-1];
  if(last&&d.team){
    h+='<h3 class="sec">'+B.team+'</h3><div class="btteam">'+d.team.map((f,i)=>{const hp=last.hp?last.hp[i]:0,r=f.maxHp?Math.max(0,hp)/f.maxHp:0;
      return '<div class="btf'+(hp<=0?" ko":"")+'"><span>'+esc(f.emoji)+" "+esc(f.name)+(f.stars?' <em>'+"⭐".repeat(f.stars)+'</em>':"")+(hp<=0?' <b>'+B.ko+'</b>':"")+'</span><div class="bbar"><i style="width:'+Math.round(r*100)+'%"></i></div><small>'+Math.max(0,hp)+" / "+f.maxHp+'</small></div>'}).join("")+'</div>';
  }
  h+='<h3 class="sec">'+B.turns+'</h3><ol class="bttl">';
  d.turns.forEach(tn=>{
    const pct=boss.maxHp?Math.round(100*tn.bossHp/boss.maxHp):0;
    let body="";
    const ev=(tn.ev||[]).map(e=>btEvent(e,B)).join("");
    body+=ev?'<ul class="bevs">'+ev+'</ul>':'<p class="hint" style="margin:6px 0">'+B.none+'</p>';
    if(tn.tick&&tn.tick.length){const n=tn.tick.reduce((s,x)=>s+x.d,0);const parts=[...new Set(tn.tick.map(x=>(STATE_EMO[x.k]||"")+" "+(newFxT()[x.k]||x.k)))].join(" + ");
      body+='<p class="bst">'+esc(B.tick(parts,n))+'</p>'}
    if(tn.hit){const x=tn.hit;
      if(x.dodged)body+='<p class="bhit dodge">'+esc(B.dodged(boss.name,x.emoji+" "+x.name))+'</p>';
      else if(x.dmg>0)body+='<p class="bhit">'+esc(B.hit(boss.name,x.emoji+" "+x.name,x.dmg,x.mit))+(x.down?'<b>'+B.hitdown+'</b>':"")+'</p>';
      else body+='<p class="bhit dodge">'+esc(B.hit(boss.name,x.emoji+" "+x.name,0,x.mit))+'</p>';
      if(x.shared)body+='<p class="bst">'+esc(B.shared(x.shared.emoji+" "+x.shared.by,x.shared.amt))+'</p>';
    }
    h+='<li><div class="bth"><b>'+B.turn(tn.n)+'</b><span class="bbar boss"><i style="width:'+pct+'%"></i></span><small>'+esc(boss.emoji||"")+" "+pct+'%</small></div>'+body+'</li>';
  });
  h+='</ol>';
  h+='<details class="gloss" open><summary>'+B.how_t+'</summary>'+B.how.map(p=>'<p>'+esc(p)+'</p>').join("")+'<dl style="margin-top:10px">'+newFxGloss()+'</dl></details>';
  h+='<p class="hint" style="margin:14px 0 4px">'+B.kept+'</p><button class="copy" id="btcopy" type="button">'+B.share_btn+'</button>';
  root.innerHTML=h;
  const c=$("#btcopy");if(c)c.onclick=()=>{try{navigator.clipboard.writeText(location.href).then(()=>{c.textContent=B.copied})}catch(e){}};
}

function sgPlayer(ids){
  const p={formation:{defenseur:ids[0],soutien:ids[1],attaquant:ids[2]},animaux:{},etoiles:{},items:[],equipped:{},victoires:0};
  ids.forEach((id,i)=>{
    const an=ArenaSim.ANIMALS[id];const cat=SG_ROLES[i][0];
    p.etoiles[id]=SG_MODE==='max'?(DATA.stars||5):Math.max(0,(P.stars&&P.stars[id])||0);
    const lv={};for(const sk of ArenaSim.allSkillsForAnimal(an))lv[sk.id]=SG_MODE==='max'?10:((P.levels&&P.levels[id]&&P.levels[id][sk.id])||1);

}

/* Résultats reproductibles : le même joueur obtient TOUJOURS les mêmes formations.
   Chaque simulation reçoit un hasard "semé" (même graine = mêmes tirages). */
function sgHash(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function sgRng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function sgSeeded(key,fn){
  const orig=Math.random;Math.random=sgRng(sgHash(key));
  try{return fn()}finally{Math.random=orig}
}
/* Vraie montée de la Tour : la vie se reporte d'étage en étage, les animaux KO restent KO,
   et on choisit une relique après chaque étage (même moteur que le bot). Renvoie la moyenne d'étages réussis. */
function sgRelicPick(ch,fighters){
  if(fighters.some(f=>!f.alive)&&ch.includes("phoenix"))return"phoenix";
  const tm=fighters.reduce((x,f)=>x+f.maxHp,0),th=fighters.reduce((x,f)=>x+f.hp,0);
  if(tm>0&&th/tm<.5&&ch.includes("rest"))return"rest";
  const pr=["aegis","edge","drum","bloom","clover","meal","rest","phoenix","purse","map"];
  return pr.find(id=>ch.includes(id))||ch[0];
}
function sgTowerOnce(p){
  let fighters=ArenaSim.makeFighters(p,null);const relics=[];let floor=1,cleared=0;
  while(floor<=120){
    const boss=ArenaSim.floorBoss(floor);
    const r=ArenaSim.simulateCombat(p,{boss,fighters,transformLoadout:l=>ArenaSim.applyRelicsToLoadout(l,relics)});
    fighters=r.fighters;
    if(!r.victory)break;
    cleared=floor;floor++;
    const rid=sgRelicPick(ArenaSim.rollRelicChoices(relics),fighters);
    if(ArenaSim.RELICS[rid].kind==="instant")ArenaSim.applyInstantRelic(rid,fighters);else relics.push(rid);
  }
  return cleared;
}
function sgTower(p,key,N){
  return sgSeeded("T|"+key,()=>{let s=0;for(let i=0;i<N;i++)s+=sgTowerOnce(p);return s/N});
}
function sgDuel(a,b,key,N){
  // part de victoires de a contre b (côtés alternés)
  return sgSeeded("D|"+key,()=>{
    let w=0;
    for(let k=0;k<N;k++){
      const flip=k%2===1;const r=flip?ArenaSim.simulatePvP(b.p,a.p):ArenaSim.simulatePvP(a.p,b.p);
      if(r.winner!=="A"&&r.winner!=="B")w+=.5;else if((r.winner==="A")!==flip)w++;
    }
    return w/N;
  });
}
function sgRefAt(ids,lv,st){
  const p={formation:{defenseur:ids[0],soutien:ids[1],attaquant:ids[2]},animaux:{},etoiles:{},items:[],equipped:{},victoires:0};
  for(const id of ids){const an=ArenaSim.ANIMALS[id];if(!an)return null;p.etoiles[id]=st;p.animaux[id]={competences:{}};for(const sk of ArenaSim.allSkillsForAnimal(an))p.animaux[id].competences[sk.id]=lv}
  return p;
}

const ROLES=[["defense","defenseur"],["soutien","soutien"],["attaque","attaquant"]];
const TOWER_SE=13;            // une montée de Tour ≈ 13 combats de duel (en temps de calcul)
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function seeded(key,fn){const o=Math.random;Math.random=rng(hash(key));try{return fn()}finally{Math.random=o}}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

function create(env){
  const Sim=env.Sim,DATA=env.DATA,byId=env.byId,P=env.P;
  const MAXST=DATA.stars||5;

  /* joueur simulé pour une équipe [défenseur, soutien, attaquant] */
  function makePlayer(ids,mode,over){
    const p={formation:{defenseur:ids[0],soutien:ids[1],attaquant:ids[2]},animaux:{},etoiles:{},items:[],equipped:{},victoires:0};
    ids.forEach((id,i)=>{
      const an=Sim.ANIMALS[id],cat=ROLES[i][0];
      const lvAll=over&&over.lv!=null?over.lv:null,stAll=over&&over.st!=null?over.st:null;
      p.etoiles[id]=stAll!=null?stAll:(mode==="max"?MAXST:Math.max(0,(P.stars&&P.stars[id])||0));
      const lv={};
      for(const sk of Sim.allSkillsForAnimal(an))lv[sk.id]=lvAll!=null?lvAll:(mode==="max"?10:((P.levels&&P.levels[id]&&P.levels[id][sk.id])||1));
      p.animaux[id]={competences:lv};
      if(env.weapons&&mode==="max"&&Sim.createLegendaryItem){const it=Sim.createLegendaryItem(id);if(it){p.items.push(it);p.equipped[id]=it.instanceId}}
      if(mode!=="max"&&!over){
        const iid=P.equipped&&P.equipped[id];const it=iid&&(P.items||[]).find(x=>x.instanceId===iid);
        if(it&&(it.tier==="legendary"?it.animalId===id:it.category===cat)){p.items.push(Object.assign({},it));p.equipped[id]=it.instanceId}
      }
    });
    return p;
  }

  /* --- combats --- */
  function relicPick(ch,fighters){
    if(fighters.some(f=>!f.alive)&&ch.includes("phoenix"))return"phoenix";
    const tm=fighters.reduce((x,f)=>x+f.maxHp,0),th=fighters.reduce((x,f)=>x+f.hp,0);
    if(tm>0&&th/tm<.5&&ch.includes("rest"))return"rest";
    const pr=["aegis","edge","drum","bloom","clover","meal","rest","phoenix","purse","map"];
    return pr.find(id=>ch.includes(id))||ch[0];
  }
  function towerOnce(p){
    let fighters=Sim.makeFighters(p,null);const relics=[];let floor=1,cleared=0;
    while(floor<=120){
      const boss=Sim.floorBoss(floor);
      const r=Sim.simulateCombat(p,{boss,fighters,transformLoadout:l=>Sim.applyRelicsToLoadout(l,relics)});
      fighters=r.fighters;
      if(!r.victory)break;
      cleared=floor;floor++;
      const rid=relicPick(Sim.rollRelicChoices(relics),fighters);
      if(Sim.RELICS[rid].kind==="instant")Sim.applyInstantRelic(rid,fighters);else relics.push(rid);
    }
    return cleared;
  }
  function duelWins(a,b,N){           // victoires de a contre b, côtés alternés (égalité = ½)
    let w=0;
    for(let k=0;k<N;k++){
      const flip=k%2===1;const r=flip?Sim.simulatePvP(b.p,a.p):Sim.simulatePvP(a.p,b.p);
      if(r.winner!=="A"&&r.winner!=="B")w+=.5;else if((r.winner==="A")!==flip)w++;
    }
    return w;
  }

  /* --- équipes de référence (champ d'adversaires FIXE pour comparer toutes les équipes) --- */
  function buildRefs(mode){
    let lv=10,st=MAXST;
    if(mode==="now"){
      const mains=env.own.map(id=>{const l=(P.levels&&P.levels[id])||{};const v=Object.values(l);return{id,lv:v.length?v.reduce((a,b)=>a+b,0)/v.length:1,st:(P.stars&&P.stars[id])||0}}).sort((a,b)=>b.lv+b.st*2-(a.lv+a.st*2)||(a.id<b.id?-1:1)).slice(0,6);
      lv=clamp(Math.round(mains.reduce((a,b)=>a+b.lv,0)/mains.length),1,10);
      st=clamp(Math.round(mains.reduce((a,b)=>a+b.st,0)/mains.length),0,MAXST);
    }
    const lists=[];
    for(const ty of ["terre","air","eau"])(DATA.ideas[ty]||[]).slice(0,4).forEach(r=>lists.push([r.d,r.s,r.a]));
    (env.seeds||[]).slice(0,14).forEach(x=>lists.push(x));
    const out=[],seen=new Set();
    for(const x of lists){
      const k=x.join("|");if(seen.has(k))continue;seen.add(k);
      if(!x.every(id=>Sim.ANIMALS[id]))continue;
      out.push({k,ids:x,p:makePlayer(x,mode,{lv,st})});
    }
    // diversifie l'ordre : types mélangés d'abord (les premières références servent au tri rapide)
    const bucket={terre:[],air:[],eau:[],mix:[]};
    for(const r of out){const t=byId[r.ids[0]].type;bucket[r.ids.every(i=>byId[i].type===t)?t:"mix"].push(r)}
    const o=[];for(let i=0;i<20;i++)for(const b of["terre","air","eau","mix"])if(bucket[b][i])o.push(bucket[b][i]);
    return o;
  }

  /* --- candidats --- */
  function preScore(ids){
    const S=DATA.sc;let v=S[ids[0]].defense+S[ids[1]].soutien+S[ids[2]].attaque;
    const ty=byId[ids[0]].type;if(ty&&ids.every(i=>byId[i].type===ty))v*=(DATA.trio[ty]||1);return v;
  }
  function candidates(maxTeams){
    const own=env.own,ownSet=new Set(own);const all=[];
    for(const d of own)for(const s of own){if(s===d)continue;for(const a of own){if(a===d||a===s)continue;all.push({ids:[d,s,a],pre:preScore([d,s,a])})}}
    if(env.teamFilter){for(let i=all.length-1;i>=0;i--)if(!env.teamFilter(all[i].ids))all.splice(i,1)}
    const total=all.length;
    all.sort((x,y)=>y.pre-x.pre||(x.ids.join()<y.ids.join()?-1:1));
    const chosen=new Map();const add=c=>{if(env.teamFilter&&!env.teamFilter(c.ids))return;const k=c.ids.join("|");if(!chosen.has(k))chosen.set(k,{ids:c.ids.slice(),k,pre:c.pre||0})};
    all.slice(0,maxTeams).forEach(add);
    for(const ty of ["terre","air","eau"])all.filter(c=>c.ids.every(i=>byId[i].type===ty)).slice(0,24).forEach(add);
    const S0=DATA.sc,roleOf=["defense","soutien","attaque"];
    for(const sd of env.seeds||[]){
      const miss=sd.map((x,k)=>ownSet.has(x)?-1:k).filter(k=>k>=0);
      if(!miss.length)add({ids:sd,pre:0});
      else if(miss.length===1){const k=miss[0];own.filter(x=>!sd.includes(x)).sort((x,y)=>S0[y][roleOf[k]]-S0[x][roleOf[k]]||(x<y?-1:1)).slice(0,4).forEach(x=>{const ids=sd.slice();ids[k]=x;add({ids,pre:0})})}
    }
    const cur=env.cur;let curKey=null;
    if(cur&&cur.every(i=>i&&Sim.ANIMALS[i])&&new Set(cur).size===3&&cur.every(i=>ownSet.has(i))){curKey=cur.join("|");add({ids:cur,pre:0})}
    return{teams:[...chosen.values()],total,curKey};
  }

  const cmpScore=(a,b)=>b.score-a.score||(a.k<b.k?-1:1);
  /* note d'une équipe dans une étape : moitié duels, moitié Tour (Tour ramenée à la meilleure équipe de l'étape) */
  function rate(list,duelKey,towerKey){
    let tmax=1;for(const c of list)tmax=Math.max(tmax,c[towerKey]);
    for(const c of list)c.score=.5*c[duelKey]+.5*(c[towerKey]/tmax);
    return tmax;
  }
  const top=(list,n)=>list.slice().sort(cmpScore).slice(0,n);

  /* ===== le calcul, en générateur : chaque yield = un petit morceau (le site rend la main entre deux) ===== */
  function* run(mode,B){
    B=B||60000;
    const refs=buildRefs(mode);
    const R=refs.length||1;
    const maxTeams=env.maxTeams||2400;
    const {teams,total,curKey}=candidates(maxTeams);
    const M=teams.length;
    let sims=0,done=0;
    const plan={s0:clamp(Math.floor(.16*B/M),4,10)};
    const c1=Math.min(R,8)*6+3*TOWER_SE;
    plan.K1=clamp(Math.floor(.18*B/c1),30,700);
    const c2=Math.min(R,8)*20+12*TOWER_SE;
    plan.K2=clamp(Math.floor(.15*B/c2),12,140);
    const LT=!!env.light;plan.K3=Math.min(plan.K2,LT?10:20);plan.K4=Math.min(plan.K3,LT?4:8);
    const totalWork=M*plan.s0+Math.min(M,plan.K1)*c1+Math.min(M,plan.K2)*c2+plan.K3*(plan.K3-1)/2*40+plan.K3*(Math.min(R,8)*40+40*TOWER_SE)+plan.K4*(plan.K4-1)/2*200+plan.K4*(Math.min(R,8)*100+160*TOWER_SE);
    const tick=function*(w){done+=w;sims+=w;yield{done,total:totalWork}};
    const fieldDuel=(c,N,tag,nref)=>{            // victoires moyennes contre le champ fixe
      let w=0,g=0;const use=refs.slice(0,nref||refs.length);
      for(const r of use){w+=seeded("D|"+tag+"|"+r.k,()=>duelWins(c,r,N));g+=N}
      return[w,g];
    };
    const towerAvg=(c,n,tag)=>{let s=0,q=0;for(let j=0;j<n;j++){const v=seeded("T|"+tag+"|"+j,()=>towerOnce(c.p));s+=v;q+=v*v}return[s,q,n]};

    // --- étape 0 : tri rapide de TOUTES les équipes candidates (quelques combats chacune, mêmes adversaires pour toutes)
    for(const c of teams){
      c.p=makePlayer(c.ids,mode);
      let w=0;
      for(let j=0;j<plan.s0;j++)w+=seeded("S0|"+j,()=>duelWins(c,refs[j%R],1));
      c.f0=w/plan.s0;
      yield*tick(plan.s0);
    }
    let s0=teams.slice().sort((a,b)=>b.f0-a.f0||(a.k<b.k?-1:1));
    const keep0=new Map();s0.slice(0,plan.K1).forEach(c=>keep0.set(c.k,c));
    // on ne perd jamais l'équipe actuelle, et on garde les « équipes fortes connues »
    for(const c of teams)if(c.k===curKey||c.pre===0)keep0.set(c.k,c);
    let pool=[...keep0.values()];

    // --- étape 1 : plus de combats contre le champ + 3 montées de Tour
    for(const c of pool){
      const[w,g]=fieldDuel(c,6,"S1",8);c.fw=w;c.fg=g;c.field=w/g;
      const[ts,tq,tn]=towerAvg(c,3,"S1");c.tower=ts/tn;
      yield*tick(g+tn*TOWER_SE);
    }
    rate(pool,"field","tower");
    let k1=top(pool,plan.K2);
    if(curKey&&!k1.some(c=>c.k===curKey)){const cc=pool.find(c=>c.k===curKey);if(cc)k1.push(cc)}

    // --- étape 2 : encore plus précis
    for(const c of k1){
      const[w,g]=fieldDuel(c,16,"S2",14);c.fw=w;c.fg=g;c.field=w/g;
      const[ts,tq,tn]=towerAvg(c,12,"S2");c.tower=ts/tn;
      yield*tick(g+tn*TOWER_SE);
    }
    rate(k1,"field","tower");
    env.lastPool=top(k1,plan.K2).map(c=>({ids:c.ids.slice(),score:c.score}));
    if(env.onPartial){const part=finish(top(k1,plan.K3),curKey,M,total,sims,true,mode);yield{partial:part}}
    let k2=top(k1,plan.K3);
    if(curKey&&!k2.some(c=>c.k===curKey)){const cc=k1.find(c=>c.k===curKey);if(cc)k2.push(cc)}

    // --- étape 3 : tournoi entre les meilleures + montées de Tour
    for(const c of k2){c.rw=0;c.rg=0}
    if(mode==="now"){
      for(let i=0;i<k2.length;i++)for(let j=i+1;j<k2.length;j++){
        const a=k2[i],b=k2[j];const w=seeded("R3|"+a.k+">"+b.k,()=>duelWins(a,b,LT?24:40));
        const n3=LT?24:40;a.rw+=w;b.rw+=n3-w;a.rg+=n3;b.rg+=n3;yield*tick(n3);
      }
    }
    for(const c of k2){
      const[w,g]=fieldDuel(c,24,"S3");c.fw=w;c.fg=g;c.field=w/g;
      const[ts,tq,tn]=towerAvg(c,LT?20:40,"S3");c.tower=ts/tn;
      c.duel=mode==="now"?(c.rg?c.rw/c.rg:c.field):c.field;
      yield*tick(g+tn*TOWER_SE);
    }
    rate(k2,"duel","tower");
    let k3=top(k2,plan.K4);
    if(curKey&&!k3.some(c=>c.k===curKey)){const cc=k2.find(c=>c.k===curKey);if(cc)k3.push(cc)}

    // --- étape 4 : les finalistes, avec beaucoup de combats (c'est ce qui sera affiché)
    for(const c of k3){c.rw=0;c.rg=0;c.tw=0;c.tq=0;c.tn=0}
    if(mode==="now"){
      for(let i=0;i<k3.length;i++)for(let j=i+1;j<k3.length;j++){
        const a=k3[i],b=k3[j];const w=seeded("R4|"+a.k+">"+b.k,()=>duelWins(a,b,LT?100:200));
        const n4=LT?100:200;a.rw+=w;b.rw+=n4-w;a.rg+=n4;b.rg+=n4;yield*tick(n4);
      }
    }
    for(const c of k3){
      const[w,g]=fieldDuel(c,40,"S4");c.fw=w;c.fg=g;c.field=w/g;
      const[ts,tq,tn]=towerAvg(c,LT?70:160,"S4");c.tw=ts;c.tq=tq;c.tn=tn;c.tower=ts/tn;
      if(mode==="now"){c.duel=c.rg?c.rw/c.rg:c.field;c.dn=c.rg||1}else{c.duel=c.field;c.dn=g}
      yield*tick(g+tn*TOWER_SE);
    }
    rate(k3,"duel","tower");
    return finish(k3,curKey,M,total,sims,false,mode);
  }

  function finish(fin,curKey,tested,totalTeams,sims,provisional,mode){
    fin=fin.map(c=>{
      const dn=c.dn||c.fg||1;const duelSE=Math.sqrt(Math.max(.0001,c.duel*(1-c.duel))/dn);
      let tSE=0;if(c.tn>1){const m=c.tw/c.tn;tSE=Math.sqrt(Math.max(0,(c.tq/c.tn-m*m)))/Math.sqrt(c.tn)}
      return{ids:c.ids.slice(),k:c.k,duel:c.duel,duelSE,pve:c.tower,pveSE:tSE,score:c.score};
    });
    const cmp=key=>(a,b)=>b[key]-a[key]||(a.k<b.k?-1:1);
    const byS=fin.slice().sort(cmp("score")),byD=fin.slice().sort(cmp("duel")),byT=fin.slice().sort(cmp("pve"));
    const picks=[];
    const take=(c,key)=>{if(!c)return;const ex=picks.find(p=>p.c.k===c.k);if(ex){ex.keys.push(key);return}picks.push({c,keys:[key]})};
    take(byS[0],"all");take(byD[0],"duel");take(byT[0],"tower");
    for(const c of byS){if(picks.length>=3)break;if(!picks.some(p=>p.c===c))take(c,"alt")}
    const cur=curKey?fin.find(c=>c.k===curKey):null;
    // égalité statistique entre la 1re et la 2e (même marge d'erreur) : on le dit honnêtement
    let tie=null;
    if(byS.length>1){
      const a=byS[0],b=byS[1];
      const se=Math.sqrt(.25*(a.duelSE**2+b.duelSE**2)+.25*((a.pveSE**2+b.pveSE**2)/Math.max(1,a.pve)**2));
      if(a.score-b.score<1.5*se)tie={a:a.k,b:b.k};
    }
    return{picks,cur,rank:cur?byS.indexOf(cur)+1:0,n:fin.length,tested,totalTeams,sims:Math.round(sims),provisional,tie};
  }


  /* ===== PROFIL MESURÉ : on fait combattre l'équipe (vrais combats du moteur) et on relève ce que fait RÉELLEMENT chaque animal ===== */
  /* neutralise tous les types le temps d'un calcul (puis les remet) */
  function typesOff(fn){const A=Sim.ANIMALS,saved={};for(const id in A){saved[id]=A[id].type;A[id].type=null}try{return fn()}finally{for(const id in saved)A[id].type=saved[id]}}
  const RK=["defenseur","soutien","attaquant"];
  function* profile(c,mode,N){
    N=N||400;
    const refs=buildRefs(mode),R=refs.length||1;
    const pl=makePlayer(c.ids,mode);
    const names=c.ids.map(id=>Sim.ANIMALS[id].name);
    const S={n:0,win:0,turns:0,maxHp:0,hpEnd:0,withKo:0,role:[0,1,2].map(()=>({dmg:0,heal:0,shield:0,first:0,fall:0,rev:0,fightsFall:0})),byType:{},loadout:null,ref:R};
    for(let k=0;k<N;k++){
      const ref=refs[k%R];const flip=(Math.floor(k/R)%2)===1;
      const r=seeded("P|"+c.k+"|"+mode+"|"+k,()=>flip?Sim.simulatePvP(ref.p,pl):Sim.simulatePvP(pl,ref.p));
      const me=flip?"B":"A";
      const won=r.winner==="draw"?.5:(r.winner===me?1:0);
      S.n++;S.win+=won;S.turns+=r.turns.length;S.maxHp+=r["max"+me];S.hpEnd+=r["hpFinal".replace("Final","")+me+"Final"]/(r["max"+me]||1);
      const ty=ref.ids.every(i=>byId[i].type===byId[ref.ids[0]].type)?byId[ref.ids[0]].type:"mix";
      const bt=S.byType[ty]||(S.byType[ty]={w:0,g:0});bt.w+=won;bt.g++;
      if(!S.loadout)S.loadout=r["loadout"+me].map(e=>({role:e.role,name:e.skill.name,cat:e.skill.category,rate:Math.round(e.rate),power:e.power,fx:e.skill.effect||null,boosted:!!e.boosted,legendary:!!e.legendary,item:!!e.item}));
      let prev=[true,true,true],firstDone=false;const fellThis=[false,false,false];
      for(const t of r.turns){
        for(const e of t["events"+me]){
          const i=names.indexOf(e.animal);if(i<0)continue;const q=S.role[i];
          if(e.category==="attaque")q.dmg+=e.amount;else if(e.category==="defense")q.shield+=e.amount;else q.heal+=e.amount;
          if(e.revived)q.rev++;
        }
        const snap=t["fighters"+me];
        const newly=[];
        snap.forEach(f=>{const i=RK.indexOf(f.role);if(i>=0&&prev[i]&&!f.alive){newly.push(i);prev[i]=false;S.role[i].fall++;fellThis[i]=true}});
        if(newly.length&&!firstDone){firstDone=true;S.withKo++;newly.forEach(i=>S.role[i].first+=1/newly.length)}
      }
    }
    // effet des TYPES : même équipe, mêmes adversaires, mêmes tirages, mais en neutralisant temporairement tous les types
    // (plus de bonus de trio, plus d'avantage air > terre > eau > air, côté joueur comme côté adversaires et boss)
    {
      const cc={ids:c.ids,k:c.k,p:pl};const use=refs.slice(0,12);const NT=20;
      const measure=tag=>{let w=0,g=0;for(const r of use){w+=seeded("TI|"+tag+"|"+c.k+"|"+r.k,()=>duelWins(cc,r,14));g+=14}
        let ts=0;for(let j=0;j<NT;j++)ts+=seeded("TIT|"+tag+"|"+c.k+"|"+j,()=>towerOnce(cc.p));return{duel:w/g,tower:ts/NT}};
      const withT=measure("x");yield 0;
      const off=typesOff(()=>measure("x"));
      S.typeFx={withDuel:withT.duel,withTower:withT.tower,offDuel:off.duel,offTower:off.tower};
    }
    // (les soins « vol de vie » ne sont pas dans les événements du moteur)
    const tot=S.role.reduce((a,q)=>a+q.dmg,0)||1;
    const out={n:S.n,win:S.win/S.n,turns:S.turns/S.n,maxHp:S.maxHp/S.n,hpEnd:S.hpEnd/S.n,ref:R,
      byType:Object.fromEntries(Object.entries(S.byType).map(([k,v])=>[k,{win:v.w/v.g,n:v.g}])),
      loadout:S.loadout,typeFx:S.typeFx,
      roles:S.role.map((q,i)=>({id:c.ids[i],dmgShare:q.dmg/tot,dmg:q.dmg/S.n,heal:q.heal/S.n,shield:q.shield/S.n,firstPct:S.withKo?q.first/S.withKo:0,fallPct:q.fall/S.n,rev:q.rev/S.n}))};
    return out;
  }
  /* duel direct entre deux équipes (même moteur, côtés alternés) */
  function h2h(a,b,N,mode){
    const A={ids:a.ids,k:a.k,p:makePlayer(a.ids,mode)},Bt={ids:b.ids,k:b.k,p:makePlayer(b.ids,mode)};
    return seeded("H|"+a.k+">"+b.k+"|"+mode,()=>duelWins(A,Bt,N))/N;
  }
  return{run,profile,h2h,makePlayer,candidates,buildRefs,duelWins,towerOnce,seeded,hash};
}
return{create,ROLES,seeded,hash,rng};
})();

/* décrit les effets d'UNE compétence ; renvoie {parts:[...],used:Set(clés lues)} — toute clé non lue est signalée par l'audit */
function describe(cat,fx,L){
  const D=T[L]||T.en,parts=[],used=new Set();fx=fx||{};
  const u=k=>{used.add(k);return fx[k]};
  if(cat==="attaque"){
    if(fx.doubleChance)parts.push(D.dbl(u("doubleChance")));
    if(fx.critChance)parts.push(D.crit(u("critChance")));
    if(fx.rage)parts.push(D.rage(pc(u("rage"))));
    if(fx.lifesteal)parts.push(D.ls(pc(u("lifesteal"))));
    if(fx.dot)parts.push(D.dot(D[fx.dot.kind]||fx.dot.kind,pc(fx.dot.frac),fx.dot.turns)),used.add("dot");
  }else if(cat==="defense"){
    if(fx.fortify)parts.push(D.fort(u("fortify")));
    if(fx.opening){parts.push(D.open);used.add("opening")}
    if(fx.dodge)parts.push(D.dodge(u("dodge")));
    if(fx.share)parts.push(D.share(pc(u("share"))));
    if(fx.reflect)parts.push(D.refl(pc(u("reflect"))));
    if(fx.thorns)parts.push(D.thorn(pc(u("thorns"))));
  }else{
    const pure=!!(fx.encourage||fx.guard)&&!fx.revive&&!fx.teamWide;
    if(fx.revive){parts.push(D.revive(pc(fx.reviveFraction||.4)));used.add("revive");used.add("reviveFraction")}
    else if(fx.teamWide){parts.push(D.healAll);used.add("teamWide")}
    else if(!pure)parts.push(D.heal);
    if(!pure){
      if(fx.critHeal)parts.push(D.critH(u("critHeal")));
      if(fx.rescue)parts.push(D.resc(u("rescue")));
      if(fx.chainHeal)parts.push(D.chain(pc(u("chainHeal"))));
      if(fx.lifesteal)parts.push(D.lsS(pc(u("lifesteal"))));
    }
    if(fx.encourage)parts.push(D.enc(pc(u("encourage"))));
    if(fx.guard)parts.push(D.grd(pc(u("guard"))));
    if(pure&&fx.lifesteal)used.add("lifesteal");
  }
  // effets sur l'ennemi : possibles quelle que soit la catégorie
  if(fx.vuln){parts.push(D.vuln(pc(fx.vuln.pct),fx.vuln.turns));used.add("vuln")}
  if(fx.fear){parts.push(D.fear(pc(fx.fear.pct),fx.fear.turns));used.add("fear")}
  return{parts,used};
}
/* clés des données qui ne sont lues par aucune description (sert à l'audit) */
function unhandled(cat,fx,L){const r=describe(cat,fx,L);return Object.keys(fx||{}).filter(k=>!r.used.has(k)&&!((cat==="attaque"&&k==="dot")))}

function explain(c,mode,ctx){
  const L=T[ctx.lang]?ctx.lang:"en",D=T[L],out=[];const prof=c.prof;
  const A=c.ids;const types=A.map(i=>ctx.type(i));
  const same=types[0]&&types.every(x=>x===types[0]);
  const nT=new Set(types.filter(Boolean)).size;const discP=ctx.discord?Math.round((1-(ctx.discord[nT]||1))*100):0;
  out.push(same?D.trio(ctx.typeEmo(types[0])+" "+ctx.typeName(types[0]),Math.round((ctx.trio(types[0])-1)*100)):D.mixed(discP));
  if(prof){
    out.push(D.win(pc(prof.win),prof.n,num(prof.turns,L),mode));
    if(ctx.h2h!=null)out.push(D.h2h(pc(ctx.h2h),ctx.h2hN));
    if(prof.typeFx){const f=prof.typeFx;out.push(D.tfx(same?D.tfxTrio(Math.round((ctx.trio(types[0])-1)*100)):D.tfxMixed(discP),pc(f.withDuel),pc(f.offDuel),Math.round(f.withTower),Math.round(f.offTower)))}
  }
  A.forEach((id,i)=>{
    const cat=ROLE_CAT[i];const st=ctx.stars(id,mode);
    let h=ctx.catEmo(cat)+" <b>"+D.role[cat]+"</b> — "+ctx.esc(ctx.name(id))+(st?" "+"⭐".repeat(st):"");
    const lines=[];
    const sk=prof?prof.loadout.filter(l=>l.role==="defenseur"?i===0:l.role==="soutien"?i===1:i===2):[];
    // 1) ce qu'on a mesuré
    if(prof){
      const r=prof.roles[i],m=[];
      m.push(r.dmgShare>.005?D.dshare(pc(r.dmgShare)):D.nodmg);
      m.push(r.heal>.5?D.heals(Math.round(r.heal),Math.round(100*r.heal/Math.max(1,prof.maxHp))):D.noheal);
      m.push(r.shield>.5?D.shd(Math.round(r.shield)):D.noshd);
      if(r.rev>.02)m.push(D.revn(num(r.rev,L)));
      lines.push("<b>"+D.meas+" :</b> "+m.join(" · ")+".");
    }
    // 2) bonus de rôle réel
    if(prof){
      const nb=sk.filter(l=>l.cat===cat).length;
      lines.push(nb?D.fit(nb,D.catn[cat]):D.nofit(D.catn[cat]));
    }
    // 3) effets réels de ses compétences (toutes sont utilisées en combat)
    if(prof){
      const items=[],plainBy={attaque:0,defense:0};
      for(const l of sk){
        const d=describe(l.cat,l.fx,L);
        if(!d.parts.length&&!l.legendary){plainBy[l.cat]=(plainBy[l.cat]||0)+1;continue}
        if(!d.parts.length&&l.legendary){d.parts.push(D.dmgLeg[l.cat])}
        const wp=l.legendary?"🗡️ ":"";
        items.push({cat:l.cat,txt:wp+"<i>"+ctx.esc(l.name)+"</i> ("+l.rate+" % de déclenchement) : "+d.parts.join(" ; ")});
        if(L!=="fr")items[items.length-1].txt=wp+"<i>"+ctx.esc(l.name)+"</i> ("+l.rate+"% trigger): "+d.parts.join("; ");
      }
      items.sort((a,b)=>(b.cat===cat)-(a.cat===cat));
      if(items.length)lines.push("<b>"+D.skills+" :</b><br>• "+items.slice(0,6).map(x=>x.txt).join("<br>• "));
      for(const k of ["attaque","defense"])if(plainBy[k])lines.push(D.plain(plainBy[k],k)+".");
    }
    out.push(h+"<br><span class='sgsub'>"+lines.join("<br>")+"</span>");
  });
  if(prof){
    const tw=Object.entries(prof.byType).filter(([k,v])=>v.n>=20).sort((a,b)=>b[1].win-a[1].win);
    if(tw.length>=2){
      out.push("<b>"+D.vsT+" :</b> "+tw.map(([k,v])=>D.tn[k]+" "+pc(v.win)+" %").join(" · ")+". "+D.best+" : "+D.tn[tw[0][0]]+" · "+D.worst+" : "+D.tn[tw[tw.length-1][0]]+".");
    }
    const worst=prof.roles.map((r,i)=>({i,p:r.firstPct})).sort((a,b)=>b.p-a.p)[0];
    if(worst&&worst.p>.4)out.push(D.weak(ctx.esc(ctx.name(A[worst.i])),pc(worst.p)));
  }
  if(same){out.push(D.edge(ctx.typeEmo(types[0]),ctx.typeEmo(ctx.beats(types[0]))))}
  return out;
}
return{describe,unhandled,explain,T};

let SG_B=0;
function sgStart(){
  if(!P||!simReady())return;
  const own=[...ownedSet()].filter(id=>byId[id]&&ArenaSim.ANIMALS[id]).sort();
  const sig=sgSig();
  if(own.length<3){SG={state:"done",sig,res:{few:true,owned:own.length},prog:0,total:0};renderIdeas();return}
  const f=P.formation||{};
  const base={Sim:ArenaSim,DATA,byId,P,seeds:SG_SEEDS,weapons:true};      // weapons : le « potentiel » compte l'arme légendaire de chaque animal
  const eng=SGE.create(Object.assign({},base,{own,cur:[f.defenseur,f.soutien,f.attaquant]}));
  // la vitesse de l'appareil règle le nombre de combats (≈ 8 s par partie) — mesurée UNE fois, pour que deux calculs successifs donnent le même résultat
  let B=0;
  try{B=+localStorage.getItem("sgB")||0}catch(e){}
  if(!SG_B&&!B){try{const q=eng.makePlayer(own.slice(0,3),"now"),t0=performance.now();eng.duelWins({p:q},{p:q},80);const ms=Math.max(.02,(performance.now()-t0)/80);const raw=8000/ms;B=raw>=60000?60000:raw>=45000?45000:30000;try{localStorage.setItem("sgB",String(B))}catch(e){}}catch(e){B=45000}}
  if(SG_B)B=SG_B;else{if(!B)B=45000;SG_B=B}
  SG={state:"run",sig,res:null,prog:0,total:100};
  const modes=["now","max"];
  // meilleure équipe de chaque TYPE (trio complet, avec le bonus de type) parmi tes animaux de ce type
  const types=["terre","air","eau"].filter(ty=>own.filter(i=>byId[i].type===ty).length>=3).map(ty=>({ty,eng:SGE.create(Object.assign({},base,{own:own.filter(i=>byId[i].type===ty),cur:null,maxTeams:1500,light:true}))}));
  // une passe par type et par mode (« maintenant » et « potentiel »)
  const tasks=[...modes.map(m=>({k:"mode",m,w:1})),...modes.flatMap(m=>types.map(x=>({k:"type",ty:x.ty,m,eng:x.eng,w:.18}))),{k:"prof",w:.9}];
  const totalW=tasks.reduce((a,t)=>a+t.w,0);
  const results={types:{},typesNow:{}};let ti=0,doneW=0;
  // dernière étape : pour chaque équipe affichée, des centaines de vrais combats pour MESURER ce que fait chaque animal (c'est là-dessus que s'appuient les explications)
  function* profAll(){
    const jobs=[];
    for(const m of modes){const R=results[m];R.picks.forEach((p,i)=>jobs.push({m,p,i,R,e:eng}));if(R.cur&&!R.picks.some(p=>p.c.k===R.cur.k))jobs.push({m,p:{c:R.cur},i:-1,R,e:eng})}
    for(const x of types)for(const m of modes){const R=(m==="max"?results.types:results.typesNow)[x.ty];if(R&&R.picks.length)jobs.push({m,p:R.picks[0],i:0,R,e:x.eng})}
    let n=0;
    for(const j of jobs){
      const g=j.e.profile(j.p.c,j.m,300);let r;
      while(!(r=g.next()).done)yield n/jobs.length;
      j.p.c.prof=r.value;
      if(j.i>0){j.p.c.h2h=j.e.h2h(j.p.c,j.R.picks[0].c,300,j.m);j.p.c.h2hN=300}
      n++;yield n/jobs.length;
    }
  }
  const startTask=t=>t.k==="mode"?eng.run(t.m,B):t.k==="type"?t.eng.run(t.m,Math.round(B*.18)):profAll();
  let gen=startTask(tasks[0]);
  const finish=()=>{SG={state:"done",sig,res:Object.assign({},results,{tested:results.now.tested,owned:own.length}),prog:0,total:0};if(view==="ideas")renderIdeas()};
  const step=()=>{
    if(SG.sig!==sig||SG.state!=="run")return;
    const t0=performance.now();
    while(performance.now()-t0<40){
      const t=tasks[ti],r=gen.next();
      if(r.done){
        if(t.k==="mode")results[t.m]=r.value;else if(t.k==="type")(t.m==="max"?results.types:results.typesNow)[t.ty]=r.value;
        doneW+=t.w;ti++;
        if(ti>=tasks.length){finish();return}
        gen=startTask(tasks[ti]);continue;
      }
      const v=r.value;const fr=t.k==="prof"?Math.min(1,+v||0):(v&&v.total?Math.min(1,v.done/v.total):0);
      SG.prog=Math.round(100*(doneW+fr*t.w)/totalW);
    }
    sgProgress();
    setTimeout(step,0);
  };
  renderIdeas();
  setTimeout(step,20);
}

function sgFinish(fin,curKey,n){
  fin=fin.map(c=>({ids:c.ids.slice(),k:c.k,duel:c.g2?c.w2/c.g2:0,pve:c.pve2,score:0}));
  for(const c of fin)c.score=.5*c.duel+.5*Math.min(1,c.pve/45);
  const cmp=(key)=>(a,b)=>b[key]-a[key]||(a.k<b.k?-1:1);
  const byS=fin.slice().sort(cmp("score"));
  const byD=fin.slice().sort(cmp("duel"));
  const byT=fin.slice().sort(cmp("pve"));
  const picks=[];
  const take=(c,key)=>{if(!c)return;const ex=picks.find(p=>p.c.k===c.k);if(ex){ex.keys.push(key);return}picks.push({c,keys:[key]})};
  take(byS[0],"all");take(byD[0],"duel");take(byT[0],"tower");
  for(const c of byS){if(picks.length>=3)break;if(!picks.some(p=>p.c===c))take(c,"alt")}
  const cur=curKey?fin.find(c=>c.k===curKey):null;
  return{picks,cur,rank:cur?byS.indexOf(cur)+1:0,n:fin.length};
}

  h+=sgTypesHtml(R.typesNow,"now");
  // 2) potentiel
  h+='<h3 class="sec" style="margin-top:18px">'+T.maxT+'</h3><p class="hint" style="margin:-2px 0 6px">'+T.maxH+'</p>'+sgCards(R.max,"max");
  h+=sgTypesHtml(R.types,"max");
  h+='<button class="btn2" id="sgGo">'+T.again+'</button></div>';
  return h;
}
function sgTypesHtml(Rs,mode){
  const tys=["terre","air","eau"].filter(ty=>Rs&&Rs[ty]&&Rs[ty].picks.length);
  if(!tys.length)return"";
  const fr=lang==="fr",now=mode==="now";
  let h='<h3 class="sec" style="margin-top:18px">'+(now?(fr?"🧬 MAINTENANT, type par type":"🧬 RIGHT NOW, type by type"):(fr?"🧬 Le POTENTIEL, type par type":"🧬 POTENTIAL, type by type"))+'</h3><p class="hint" style="margin:-2px 0 6px">'+(now?(fr?"La meilleure équipe de chaque type (trio complet = bonus de type) avec tes animaux d'aujourd'hui, tes niveaux, tes étoiles et tes armes équipées.":"The best team of each type (full trio = type bonus) with your animals as they are today: your levels, stars and equipped weapons."):(fr?"La meilleure équipe de chaque type (trio complet = bonus de type), parmi tes animaux, au niveau 10, 5⭐ et avec leurs armes légendaires.":"The best team of each type (full trio = type bonus) among your animals, at level 10, 5⭐ and with their legendary weapons."))+'</p>';
  for(const ty of tys){
    const Rt=Rs[ty];const first=Rt.picks[0];
    h+='<h4 style="margin:12px 0 4px">'+TYPE_EMO[ty]+' '+esc(((t().types)||{})[ty]||ty)+'</h4>'+sgCards({picks:[first],tie:null},mode);
    const alts=Rt.picks.slice(1).filter(p=>p.keys.some(k=>k==="duel"||k==="tower"));
    if(alts.length)h+='<p class="hint">'+alts.map(p=>(p.keys.includes("duel")?"⚔️ "+(fr?"En duel":"In duels"):"🗼 "+(fr?"Pour la Tour":"For the Tower"))+" : "+p.c.ids.map(i=>esc(byId[i].name)).join(" / ")+" ("+Math.round(p.c.duel*100)+"% ±"+Math.max(1,Math.round(196*(p.c.duelSE||0)))+", "+(fr?"étage":"floor")+" "+Math.round(p.c.pve)+")").join("<br>")+'</p>';
  }
  return h;
}
function sgBind(root){
  const b=root.querySelector("#sgGo");if(b)b.onclick=()=>{SG.state="idle";sgStart()};
}

/* ---------- routing ---------- */
function go(h){location.hash="#"+h}
function route(){
  const h=(location.hash||"#animals").slice(1);
  if(h.startsWith("battle/")){
    const d=$("#dlg");if(d.open)d.close();
    show("battle");loadBattle(h.slice(7).trim());return;
  }
  if(h.startsWith("me/")){
    const token=h.slice(3).trim();
    history.replaceState(null,"","#me");
    show("me");initProfile(token);return;
  }
  if(h.startsWith("builder/")){
    const ids=h.slice(8).split(",");
    BUILD={d:byId[ids[0]]?ids[0]:null,s:byId[ids[1]]?ids[1]:null,a:byId[ids[2]]?ids[2]:null};
    show("builder");return;
  }
  if(h.startsWith("pet/")){
    if(!$("#v-"+view).innerHTML)show(view);
    openPet(h.slice(4));return;
  }
  const d=$("#dlg");if(d.open)d.close();
  show(VIEWS.includes(h)?h:(h==="strategy"?"ideas":"animals"));
}
function show(v){
  view=v;
  for(const k of VIEWS)$("#v-"+k).hidden=k!==v;
  renderNav();
  ({animals:renderAnimals,events:renderEvents,mythics:renderMythics,types:renderTypes,ideas:renderIdeas,builder:renderBuilder,weapons:renderWeapons,me:renderMe,shop:renderShop,battle:renderBattle})[v]();
  addSub(v);
  if(!location.hash.startsWith("#pet/"))window.scrollTo({top:0});
}
function applyLang(){
  document.documentElement.lang=lang;
  $("#sub").textContent=t().sub;$("#foot").textContent=t().foot+(DATA_STAMP?" "+t().synced(new Intl.DateTimeFormat(LOCALE[lang],{day:"numeric",month:"short"}).format(new Date(DATA_STAMP))):"");
  const ls=$("#langsel");if(ls)ls.value=lang;
  document.title="Arena — "+(lang==="fr"?"Bestiaire":"Bestiary");
}
(function(){
  const ls=$("#langsel");
  ls.innerHTML=LANG_LIST.map(([c,n])=>'<option value="'+c+'">'+n+'</option>').join("");ls.value=lang;
  ls.onchange=()=>{
    lang=ls.value;try{localStorage.setItem("arena-lang",lang)}catch(e){}
    applyLang();const h=location.hash;show(view);if(h.startsWith("#pet/"))openPet(h.slice(5));
  };
})();
window.addEventListener("hashchange",route);
applyLang();route();
if(!location.hash.startsWith("#me/")&&storedToken())initProfile();
syncData();
</script>
</body>
