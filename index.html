herisson:"De Europese egel kreeg in 2024 van de IUCN de status Bijna bedreigd. Wegen, robotmaaiers, pesticiden en verdwijnende heggen drukken de aantallen.",
poulpe:"Een octopus heeft drie harten en blauw bloed. Ongeveer tweederde van zijn neuronen zit in zijn armen, die deels zelf kunnen 'beslissen'.",
chauve_souris:"Vleermuizen vormen ongeveer een vijfde van alle zoogdiersoorten. Een schimmelziekte, het witte-neussyndroom, heeft er in Noord-Amerika miljoenen gedood.",
dauphin:"De Yangtze-dolfijn (baiji) werd in 2006 functioneel uitgestorven verklaard, slachtoffer van visserij, scheepvaart en vervuiling: een van de eerste grote walvisachtigen die door de mens verloren gingen.",
tortue:"Zes van de zeven soorten zeeschildpadden worden bedreigd. Visnetten, plastic en strandverlichting (die jongen in de war brengt) horen bij de oorzaken.",
rhinoceros:"Er zijn nog ongeveer 27.000 neushoorns, tegen zo'n 500.000 een eeuw geleden. Ze worden gestroopt voor hun hoorn, die slechts uit keratine bestaat, net als onze nagels.",
crabe:"Elk jaar trekken tientallen miljoenen kerstkrabben op Christmas Island van het bos naar de zee om zich voort te planten: een van de grootste landmigraties. De Japanse reuzenkrab kan meer dan 3,5 m overspannen.",
requin:"Ongeveer 37% van de haai- en roggensoorten wordt met uitsterven bedreigd. Naar schatting worden jaarlijks tientallen miljoenen haaien gevangen, vaak voor hun vinnen.",
crocodile:"Krokodilachtigen overleefden de massa-extinctie die de dinosauriërs wegvaagde. De zoutwaterkrokodil van Australië, in de jaren 70 teruggebracht tot ongeveer 3.000, telt nu weer meer dan 100.000 dieren.",
elephant:"In 2021 zette de IUCN de Afrikaanse savanneolifant op Bedreigd en de boololifant op Ernstig bedreigd. Boololifanten verloren in dertig jaar meer dan 80% van hun aantal, vooral door ivoorstroperij.",
hibou:"Uilen vliegen bijna geruisloos dankzij hun gefranjerde veren. Ze leven op elk continent behalve Antarctica.",
gorille:"Berggorilla's gingen in 2018 van Ernstig bedreigd naar Bedreigd na tientallen jaren bescherming: er zijn er iets meer dan 1.000. Andere gorilla's blijven bedreigd door stroperij, ziekte en ontbossing.",
paon:"De blauwe pauw is de nationale vogel van India. Zijn verwant, de groene pauw van Zuidoost-Azië, is bedreigd. Alleen het mannetje heeft de beroemde sleep, die uit veren bestaat en niet uit de staart zelf.",
renard_voyageur:"Een poolvos liep in 76 dagen ongeveer 3.500 km van Spitsbergen naar Canada over het zee-ijs: een van de langste ooit gevolgde tochten voor een dier van zijn formaat.",
hibou_sage:"De laplanduil hoort een woelmuis onder meer dan 50 cm sneeuw en duikt erop af om hem te vangen.",
loup_gardien:"In 1995 werden wolven herintroduceerd in Yellowstone, 70 jaar na hun verdwijning. Hun terugkeer veranderde het gedrag van de elanden, daarna de vegetatie en zelfs enkele rivieren: een beroemde 'trofische cascade'.",
blaireau_sorciere:"Dassenburchten worden generatie na generatie uitgegraven en uitgebreid: sommige worden al meer dan een eeuw bewoond.",
lapin_citrouille:"Het Europese konijn staat op het Iberisch schiereiland als Bedreigd te boek (IUCN, 2018) door ziektes (myxomatose en konijnenpest). Toch is de Iberische lynx er bijna volledig van afhankelijk voor voedsel.",
serpent_squelette:"Sommige slangen hebben tot 400 wervels, elk met een paar ribben. Geen poten, maar wel het skelet van een kunstenaar in lenigheid.",
renne_grelot:"De kuddes toendrarendieren en kariboes zijn in twee à drie decennia met ongeveer 56% geslonken, doordat de opwarming hun voedselaanbod verstoort.",
ours_pere_noel:"Er zijn nog zo'n 26.000 ijsberen, gelabeld als Kwetsbaar. Ze jagen op zeehonden vanaf het zee-ijs, dat elke zomer verder terugtrekt.",
pingouin_bonnet:"De keizerspinguïn staat als Bijna bedreigd te boek. In 2022 en 2023 stierven bijna alle kuikens in verschillende kolonies in de Bellingshausenzee: het zee-ijs brak op voordat ze konden zwemmen.",
dragon_imperial:"In keizerlijk China was de vijfklauwige draak voorbehouden aan de keizer. De Chinese draak, verbonden met water en regen, brengt geluk, anders dan de westerse draak.",
belier_jade:"Schapen waren een van de eerste gedomesticeerde dieren, zo'n 10.000 jaar geleden in het Nabije Oosten. In de Chinese dierenriem delen geit, schaap en ram één teken.",
carpe_koi:"Koi zijn karpers die sinds de 19e eeuw in Japan op kleur worden gefokt. Ze kunnen meer dan 50 jaar leven en hun naam roept in Japan ook geluk op.",
cygne_cupidon:"Knobbelzwanen vormen paren die vaak levenslang bij elkaar blijven, vandaar hun romantische symboliek.",
loutre_main_dans_la_main:"Zeeotters houden elkaars poot vast tijdens het slapen om niet uit elkaar te drijven. Door de pelsjacht waren er in 1911 minder dan 2.000; nu zijn het er tienduizenden.",
perruche_inseparable:"Agaporniden zijn vernoemd naar de sterke band tussen partners. Er zijn negen soorten, allemaal afkomstig uit Afrika en Madagaskar.",
leopard_glacier:"Er zijn nog zo'n 4.000–6.500 sneeuwluipaarden in Centraal-Azië. Ze staan als Kwetsbaar te boek en worden bedreigd door stroperij, conflicten met herders en krimpend leefgebied.",
pangolin_blinde:"Het schubdier is het meest gesmokkelde wilde zoogdier ter wereld, voor zijn schubben en vlees. Alle acht soorten zijn beschermd.",
abeille_reine:"Een honingbijkoningin kan tot 2.000 eitjes per dag leggen. Ongeveer één op de tien Europese wilde bijensoorten wordt met uitsterven bedreigd, terwijl ze een groot deel van onze gewassen bestuiven.",
guepard_zenith:"De jachtluipaard is het snelste landdier, met meer dan 100 km/u op topsnelheid. Er zijn er nog zo'n 7.000 in het wild en hij is uit het grootste deel van Azië verdwenen.",
hippopotame_marais:"Er zijn nog zo'n 115.000–130.000 nijlpaarden in Afrika, gelabeld als Kwetsbaar. Ze worden bejaagd voor vlees en voor het ivoor van hun hoektanden.",
suricate_sentinelle:"Stokstaartjes zetten een schildwacht op een hoog punt terwijl de anderen foerageren, en die waarschuwt met verschillende roepen naargelang het gevaar (arend, slang…).",
narval_etoile:"De 'hoorn' van de narwal is eigenlijk een tand, een slagtand tot 3 m die gevoelig is voor zijn omgeving. In de middeleeuwen werd hij als eenhoornhoorn verkocht.",
lama_andin:"Lama's worden al zo'n 5.000 jaar in de Andes gehouden. Ze droegen karavaanlasten lang voordat paarden Amerika bereikten.",
luciole_lune:"Lichtvervuiling verstoort de signalen waarmee vuurvliegjes elkaar vinden. Een studie uit 2021 schat dat ongeveer één op de zeven Noord-Amerikaanse soorten bedreigd is.",
mammouth_ancestral:"De laatste wolharige mammoeten leefden tot ongeveer 4.000 jaar geleden op Wrangeleiland in het noordpoolgebied: ongeveer toen de Egyptische piramides werden gebouwd.",
phenix:"De feniks herrijst uit zijn as. De mythe komt uit het oude Egypte (de Bennu-vogel) en Griekenland en staat voor vernieuwing.",
leviathan:"De Leviathan is een zeemonster uit de Bijbel (Job en Psalmen). Zijn naam is een woord geworden voor alles wat gigantisch is.",
griffon:"De griffioen, half adelaar en half leeuw, bewaakte schatten in Griekse verhalen. Een hypothese zegt dat dinosaurusfossielen uit de Gobi hem kunnen hebben geïnspireerd.",
licorne_saisons:"De eerste beschrijving van de eenhoorn komt van de Griekse arts Ctesias, rond 400 v.Chr., die schreef over een gehoornde wilde ezel uit India. In de middeleeuwen waren 'eenhoornhoorns' in werkelijkheid narwaltanden.",
hydre:"De Hydra van Lerna, wiens koppen aangroeien, wordt door Herakles verslagen in zijn twaalf werken. In het echt is de hydra een piepklein zoetwaterdier dat zijn hele lichaam kan herstellen.",
ouroboros:"De slang die in zijn eigen staart bijt is een van de oudste symbolen ter wereld. Hij komt al voor in het oude Egypte en staat voor een eindeloze kringloop, het leven dat zichzelf vernieuwt."
};
FACTS_X.pl={pegase:"W mitologii greckiej Pegaz narodził się z krwi Meduzy, gdy Perseusz ściął jej głowę. Bohater Bellerofont dosiadł go później, by pokonać Chimerę. Zeus w końcu zamienił go w gwiazdozbiór.",kraken:"Kraken pochodzi z opowieści skandynawskich żeglarzy: wielki morski potwór, który miał wciągać statki na dno. Wielu uważa, że zainspirowały go prawdziwe kalmary olbrzymie.",minotaure:"Minotaur, pół człowiek, pół byk, był uwięziony w Labiryncie króla Minosa na Krecie. Bohater Tezeusz zabił go dzięki nici Ariadny.",oiseau_tonnerre:"Ptak Gromu to gigantyczny duch-ptak w tradycjach kilku rdzennych ludów Ameryki Północnej. Uderzenia jego skrzydeł tworzą grzmot, a z oczu wystrzeliwują błyskawice.",tortue_monde:"W kilku starożytnych tradycjach (hinduskiej, chińskiej, w niektórych opowieściach rdzennych Amerykanów) świat spoczywa na grzbiecie olbrzymiego żółwia.",qilin:"Qilin to łagodna istota z tradycji chińskiej. Mówiono, że jego pojawienie się zapowiada mądrego władcę lub narodziny mędrca. Jest podobno tak dobry, że nie deptze nawet żywej trawy.",sphinx:"W mitologii greckiej Sfinks zadawał podróżnym zagadkę i pożerał tych, którzy nie odgadli. Edyp znalazł odpowiedź: człowiek, który rano chodzi na czterech nogach, w południe na dwóch, a wieczorem na trzech.",sirene:"W mitologii greckiej syreny wabiły żeglarzy swoim śpiewem. Odyseusz kazał przywiązać się do masztu okrętu, aby słuchać ich bezpiecznie.",basilic:"Bazyliszek wywodzi się z greckiego słowa oznaczającego „małego króla”. W średniowiecznych bestiariuszach zabijał spojrzeniem lub oddechem. Jedynym znanym jego wrogiem była łasica.",wyverne:"Wywerna to dwunożny smok, spotykany głównie w europejskiej heraldyce, na herbach. Jej nazwa pochodzi od starofrancuskiego słowa oznaczającego „żmiję”.",cerbere:"W mitologii greckiej Cerber strzegł bram Podziemi: żadna żywa dusza nie mogła wejść, a żadna zmarła wyjść. Herakles pochwycił go podczas swojej dwunastej pracy.",kelpie:"Kelpie to zmiennokształtny duch wody ze szkockiego folkloru, często koń nad jeziorami i rzekami. Kto wsiądzie mu na grzbiet, nie może już zejść.",dragon_celeste:"W tradycji chińskiej niebiański smok (Tianlong) strzeże pałaców bogów na niebie.",eikthyrnir:"W mitologii nordyckiej jeleń Eikthyrnir stoi na dachu Walhalli i zjada liście drzewa Læraðr. Z jego rogów kapie woda, która zasila wiele rzek.",jormungandr:"W mitologii nordyckiej Jörmungandr to Wąż Świata, tak długi, że opasuje cały świat i gryzie własny ogon. Thorowi pisane jest stoczyć z nim walkę podczas Ragnaröku.",
tigre:"Sto lat temu żyło około 100 000 dzikich tygrysów. Dziś jest ich mniej niż 6 000 – przez kłusownictwo i utratę siedlisk. Mimo to w Indiach i Nepalu ich liczba w ostatnich latach rośnie.",
lion:"W Afryce pozostało około 20 000–25 000 dzikich lwów, czyli o ok. 40% mniej w ciągu dwudziestu lat. IUCN uznaje go za gatunek narażony.",
chien:"Pies był pierwszym zwierzęciem udomowionym przez człowieka, co najmniej 15 000 lat temu, na długo przed rolnictwem.",
chat:"Koty udomowiono około 10 000 lat temu na Bliskim Wschodzie, prawdopodobnie dlatego, że łowiły gryzonie przy pierwszych spichlerzach.",
boeuf:"Bydło pochodzi od tura, którego ostatni osobnik zdechł w Polsce w 1627 roku. Obecnie na świecie jest ponad miliard sztuk bydła.",
renard:"Lis rudy to najbardziej rozpowszechniony dziki drapieżnik na świecie: od Arktyki po Bliski Wschód, a nawet w miastach.",
ours:"Niedźwiedź brunatny zniknął z wielu części zachodniej Europy. Dzięki ochronie i reintrodukcjom (jak w Pirenejach) wraca, choć niektóre populacje pozostają bardzo kruche.",
loup:"Wytępiony w XX wieku w większości zachodniej Europy, wilk wrócił do Francji w 1992 roku z Włoch, przez góry Mercantour.",
aigle:"W Stanach Zjednoczonych bielik amerykański spadł w 1963 roku do mniej niż 500 par lęgowych, m.in. przez pestycyd DDT. Po jego zakazie jest ich ponad 70 000 par.",
serpent:"Istnieje około 3 900 gatunków węży, a niebezpieczna jest tylko mniejszość. Mimo to ukąszenia powodują dziesiątki tysięcy zgonów rocznie, głównie w Azji Południowej i Afryce.",
herisson:"Jeż europejski został w 2024 roku uznany przez IUCN za gatunek bliski zagrożenia. Liczebność zmniejszają drogi, roboty koszące, pestycydy i znikające żywopłoty.",
poulpe:"Ośmiornica ma trzy serca i niebieską krew. Około dwóch trzecich jej neuronów leży w ramionach, które mogą częściowo „decydować” same.",
chauve_souris:"Nietoperze to około jedna piąta wszystkich gatunków ssaków. Choroba grzybicza, zespół białego nosa, zabiła miliony z nich w Ameryce Północnej.",
dauphin:"Delfin chiński (baiji) został uznany za funkcjonalnie wymarłego w 2006 roku, ofiara rybołówstwa, ruchu statków i zanieczyszczeń: jeden z pierwszych dużych waleni utraconych przez człowieka.",
tortue:"Sześć z siedmiu gatunków żółwi morskich jest zagrożonych. Wśród przyczyn są sieci rybackie, plastik i oświetlenie plaż (które dezorientuje młode).",
rhinoceros:"Na świecie pozostało około 27 000 nosorożców, wobec około 500 000 sto lat temu. Kłusuje się je dla rogu, który jest tylko keratyną, jak nasze paznokcie.",
crabe:"Co roku dziesiątki milionów krabów czerwonych z Wyspy Bożego Narodzenia wędruje z lasu do morza, by się rozmnażać: to jedna z największych wędrówek zwierząt lądowych. Japoński krab pająkowaty może mieć ponad 3,5 m rozpiętości.",
requin:"Około 37% gatunków rekinów i płaszczek jest zagrożonych wyginięciem. Szacuje się, że co roku łowi się dziesiątki milionów rekinów, często dla płetw.",
crocodile:"Krokodyle przetrwały wymieranie, które zgładziło dinozaury. Krokodyl różańcowy z Australii, wytępiony w latach 70. do ok. 3 000 osobników, odbudował liczebność do ponad 100 000.",
elephant:"W 2021 roku IUCN uznała słonia afrykańskiego sawannowego za gatunek zagrożony, a leśnego za krytycznie zagrożony. Słonie leśne straciły ponad 80% populacji w trzy dekady, głównie przez kłusownictwo na kość słoniową.",
hibou:"Sowy latają niemal bezszelestnie dzięki frędzlowanym piórom. Żyją na każdym kontynencie poza Antarktydą.",
gorille:"Goryle górskie w 2018 roku przeszły z kategorii krytycznie zagrożonych do zagrożonych po dziesięcioleciach ochrony: pozostało nieco ponad 1 000. Inne goryle nadal zagrażają kłusownictwo, choroby i wycinka lasów.",
paon:"Paw indyjski jest ptakiem narodowym Indii. Jego krewniak, paw zielony z Azji Południowo-Wschodniej, jest zagrożony. Tylko samiec ma słynny tren, zbudowany z piór, a nie z samego ogona.",
renard_voyageur:"Pewien lis polarny przeszedł około 3 500 km w 76 dni, ze Svalbardu do Kanady po lodzie morskim: jedna z najdłuższych śledzonych wędrówek zwierzęcia tej wielkości.",
hibou_sage:"Puszczyk uralski słyszy nornika ukrytego pod ponad 50 cm śniegu, po czym nurkuje w śnieg, by go złapać.",
loup_gardien:"W 1995 roku wprowadzono wilki z powrotem do Yellowstone, 70 lat po ich zniknięciu. Ich powrót zmienił zachowanie jeleni, potem roślinność, a nawet bieg niektórych rzek: słynna „kaskada troficzna”.",
blaireau_sorciere:"Nory borsuków są kopane i rozbudowywane przez kolejne pokolenia: niektóre zamieszkuje się od ponad stu lat.",
lapin_citrouille:"Królik europejski jest uznany za gatunek zagrożony na Półwyspie Iberyjskim (IUCN, 2018) z powodu chorób (myksomatozy i krwotocznej choroby królików). Tymczasem ryś iberyjski żywi się nim niemal wyłącznie.",
serpent_squelette:"Niektóre węże mają do 400 kręgów, a każdy z nich niesie parę żeber. Bez nóg, ale ze szkieletem kontorsjonisty.",
renne_grelot:"Stada reniferów tundrowych i karibu skurczyły się o ok. 56% w dwie–trzy dekady, bo ocieplenie klimatu zaburza ich zaopatrzenie w pokarm.",
ours_pere_noel:"Pozostało około 26 000 niedźwiedzi polarnych, uznawanych za gatunek narażony. Polują na foki z lodu morskiego, który co lato się cofa.",
pingouin_bonnet:"Pingwin cesarski jest uznany za gatunek bliski zagrożenia. W latach 2022 i 2023 prawie wszystkie pisklęta w kilku koloniach na Morzu Bellingshausena zginęły: lód morski pękł, zanim zdążyły pływać.",
dragon_imperial:"W cesarskich Chinach pięciopazurzasty smok był zarezerwowany dla cesarza. Chiński smok, związany z wodą i deszczem, przynosi szczęście, inaczej niż smok zachodni.",
belier_jade:"Owce były jednymi z pierwszych udomowionych zwierząt, około 10 000 lat temu na Bliskim Wschodzie. W chińskim zodiaku koza, owca i baran dzielą jeden znak.",
carpe_koi:"Koi to karpie hodowane w Japonii od XIX wieku dla barw. Mogą żyć ponad 50 lat, a ich nazwa kojarzy się w Japonii także ze szczęściem.",
cygne_cupidon:"Łabędzie nieme tworzą pary, które często zostają ze sobą na całe życie, stąd ich romantyczna symbolika.",
loutre_main_dans_la_main:"Wydry morskie trzymają się za łapki podczas snu, by się nie rozdzielić. Polowano na nie dla futra – w 1911 roku było ich mniej niż 2 000; dziś są dziesiątki tysięcy.",
perruche_inseparable:"Papużki nierozłączki mają nazwę od silnej więzi między partnerami. Istnieje dziewięć gatunków, wszystkie pochodzą z Afryki i Madagaskaru.",
leopard_glacier:"W Azji Środkowej pozostało około 4 000–6 500 irbisów. Uznane za gatunek narażony, zagrażają im kłusownictwo, konflikty z pasterzami i kurczące się siedliska.",
pangolin_blinde:"Łuskowiec to najczęściej przemycane dzikie ssaki na świecie – dla łusek i mięsa. Wszystkie osiem gatunków jest chronionych.",
abeille_reine:"Królowa pszczoły miodnej może składać do 2 000 jaj dziennie. Około jeden na dziesięć europejskich gatunków dzikich pszczół jest zagrożony wyginięciem, a zapylają dużą część naszych upraw.",
guepard_zenith:"Gepard to najszybsze zwierzę lądowe, z prędkością maksymalną ponad 100 km/h. Na wolności zostało około 7 000 i zniknął z większości Azji.",
hippopotame_marais:"W Afryce pozostało około 115 000–130 000 hipopotamów, uznawanych za gatunek narażony. Poluje się na nie dla mięsa i kości słoniowej z kłów.",
suricate_sentinelle:"Surykatki wystawiają wartownika na wzniesieniu, gdy inne żerują, a on ostrzega różnymi okrzykami zależnie od zagrożenia (orzeł, wąż…).",
narval_etoile:"„Róg” narwala to w rzeczywistości ząb, ciosa do 3 m długości, wrażliwa na otoczenie. W średniowieczu sprzedawano ją jako róg jednorożca.",
lama_andin:"Lamy są udomowione w Andach od około 5 000 lat. Nosiły ładunki karawan na długo przed tym, jak konie dotarły do Ameryki.",
luciole_lune:"Zanieczyszczenie światłem zakłóca sygnały, którymi świetliki szukają się nawzajem. Badanie z 2021 roku szacuje, że zagrożony jest około co siódmy gatunek w Ameryce Północnej.",
mammouth_ancestral:"Ostatnie mamuty włochate żyły na Wyspie Wrangla na Arktyce do około 4 000 lat temu: mniej więcej wtedy, gdy budowano egipskie piramidy.",
phenix:"Feniks odradza się z popiołów. Mit pochodzi ze starożytnego Egiptu (ptak Bennu) i Grecji, a symbolizuje odrodzenie.",
leviathan:"Lewiatan to morski potwór z Biblii (Księga Hioba i Psalmy). Jego imię stało się określeniem wszystkiego, co gigantyczne.",
griffon:"Gryf, pół orzeł, pół lew, strzegł skarbów w greckich opowieściach. Jedna z hipotez mówi, że mogły go zainspirować skamieniałości dinozaurów z pustyni Gobi.",
licorne_saisons:"Pierwszy opis jednorożca pochodzi od greckiego lekarza Ktezjasza, około 400 r. p.n.e., który pisał o rogatym dzikim ośle z Indii. W średniowieczu „rogi jednorożca” były w rzeczywistości ciosami narwali.",
hydre:"Hydra lernejska, której głowy odrastają, zostaje pokonana przez Heraklesa w jego dwunastu pracach. W rzeczywistości hydra to maleńkie zwierzę słodkowodne zdolne zregenerować całe ciało.",
ouroboros:"Wąż gryzący własny ogon to jeden z najstarszych symboli świata. Pojawia się już w starożytnym Egipcie i oznacza nieskończony cykl, życie odnawiające się samo."
};
FACTS_X.ru={pegase:"В греческой мифологии Пегас родился из крови Медузы, когда Персей отрубил ей голову. Позже герой Беллерофонт оседлал его, чтобы победить Химеру. В конце концов Зевс превратил его в созвездие.",kraken:"Кракен родом из рассказов скандинавских моряков: гигантское морское чудовище, которое якобы утягивало корабли на дно. Многие считают, что его породили настоящие гигантские кальмары.",minotaure:"Минотавр, наполовину человек, наполовину бык, был заперт в Лабиринте царя Миноса на Крите. Герой Тесей убил его с помощью нити Ариадны.",oiseau_tonnerre:"Громовая птица — гигантская птица-дух в преданиях нескольких коренных народов Северной Америки. Взмахи её крыльев рождают гром, а из глаз вылетают молнии.",tortue_monde:"Во многих древних преданиях (индуистских, китайских, у некоторых коренных народов Америки) мир покоится на спине гигантской черепахи.",qilin:"Цилинь — доброе существо китайской традиции. Говорили, что его появление предвещает мудрого правителя или рождение мудреца. Он настолько добр, что, по преданию, не наступает даже на живую траву.",sphinx:"В греческой мифологии Сфинкс загадывал путникам загадку и пожирал тех, кто не мог её разгадать. Эдип нашёл ответ: человек, который утром ходит на четырёх ногах, днём на двух, а вечером на трёх.",sirene:"В греческой мифологии сирены завлекали моряков пением. Одиссей велел привязать себя к мачте корабля, чтобы безопасно послушать их.",basilic:"Василиск происходит от греческого слова «маленький царь». В средневековых бестиариях он убивал взглядом или дыханием. Единственным его известным врагом была ласка.",wyverne:"Виверна — двуногий дракон, которого чаще всего видят в европейской геральдике, на гербах. Её название происходит от старофранцузского слова «гадюка».",cerbere:"В греческой мифологии Цербер охранял врата подземного царства: ни одна живая душа не входила, ни одна мёртвая не выходила. Геракл поймал его в своём двенадцатом подвиге.",kelpie:"Келпи — оборотень-дух воды из шотландского фольклора, чаще всего конь у озёр и рек. Кто сядет ему на спину, уже не сможет слезть.",dragon_celeste:"В китайской традиции небесный дракон (Тяньлун) охраняет дворцы богов на небесах.",eikthyrnir:"В скандинавской мифологии олень Эйктюрнир стоит на крыше Вальхаллы и щиплет листья дерева Лэрад. С его рогов капает вода, питающая многие реки.",jormungandr:"В скандинавской мифологии Ёрмунганд — Мировой змей, такой длинный, что опоясывает весь мир и кусает себя за хвост. Тору суждено сразиться с ним в Рагнарёк.",
tigre:"Сто лет назад в дикой природе жило около 100 000 тигров. Сегодня их меньше 6 000 из-за браконьерства и потери среды обитания. Тем не менее в Индии и Непале их численность в последние годы растёт.",
lion:"В Африке осталось около 20 000–25 000 диких львов — примерно на 40% меньше за двадцать лет. МСОП относит его к уязвимым видам.",
chien:"Собака стала первым животным, одомашненным человеком, не менее 15 000 лет назад — задолго до земледелия.",
chat:"Кошек одомашнили около 10 000 лет назад на Ближнем Востоке, вероятно потому, что они ловили грызунов у первых зернохранилищ.",
boeuf:"Крупный рогатый скот произошёл от тура, последняя особь которого умерла в Польше в 1627 году. Сегодня в мире более миллиарда голов скота.",
renard:"Рыжая лиса — самый широко распространённый дикий хищник в мире: от Арктики до Ближнего Востока, и даже в городах.",
ours:"Бурый медведь исчез во многих частях Западной Европы. Благодаря охране и реинтродукции (как в Пиренеях) он возвращается, хотя некоторые популяции остаются очень хрупкими.",
loup:"Истреблённый в XX веке почти по всей Западной Европе, волк вернулся во Францию в 1992 году из Италии через горы Меркантур.",
aigle:"В США белоголовый орлан в 1963 году сократился до менее чем 500 гнездящихся пар, в том числе из-за пестицида ДДТ. После его запрета пар стало более 70 000.",
serpent:"Существует около 3 900 видов змей, и опасна лишь меньшая часть. Всё же укусы уносят десятки тысяч жизней в год, в основном в Южной Азии и Африке.",
herisson:"Обыкновенный ёж в 2024 году получил в МСОП статус «близкий к угрожаемому». Численность снижают дороги, газонокосилки-роботы, пестициды и исчезающие живые изгороди.",
poulpe:"У осьминога три сердца и голубая кровь. Около двух третей его нейронов находятся в щупальцах, которые отчасти могут «решать» сами.",
chauve_souris:"Летучие мыши составляют около пятой части всех видов млекопитающих. Грибковое заболевание — синдром белого носа — убило миллионы из них в Северной Америке.",
dauphin:"Китайский речной дельфин (байцзи) в 2006 году был объявлен функционально вымершим — жертва рыболовства, судоходства и загрязнения: один из первых крупных китообразных, утраченных из-за человека.",
tortue:"Шесть из семи видов морских черепах находятся под угрозой. Среди причин — рыболовные сети, пластик и освещение пляжей (оно дезориентирует детёнышей).",
rhinoceros:"В мире осталось около 27 000 носорогов против примерно 500 000 сто лет назад. Их убивают ради рога, который состоит лишь из кератина, как наши ногти.",
crabe:"Каждый год десятки миллионов красных крабов острова Рождества мигрируют из леса к морю для размножения — одна из крупнейших миграций наземных животных. Гигантский японский краб-паук может достигать размаха более 3,5 м.",
requin:"Около 37% видов акул и скатов находятся под угрозой исчезновения. По оценкам, ежегодно вылавливают десятки миллионов акул, часто ради плавников.",
crocodile:"Крокодилы пережили вымирание, уничтожившее динозавров. Гребнистый крокодил Австралии, истреблённый в 1970-х до примерно 3 000 особей, восстановился до более чем 100 000.",
elephant:"В 2021 году МСОП отнёс саванного африканского слона к исчезающим, а лесного — к находящимся на грани исчезновения. Лесные слоны потеряли более 80% численности за три десятилетия, в основном из-за браконьерства ради слоновой кости.",
hibou:"Совы летят почти бесшумно благодаря бахромчатым перьям. Они обитают на всех континентах, кроме Антарктиды.",
gorille:"Горные гориллы в 2018 году перешли из категории «на грани исчезновения» в «исчезающие» после десятилетий охраны: осталось чуть больше 1 000. Другим гориллам по-прежнему угрожают браконьерство, болезни и вырубка лесов.",
paon:"Обыкновенный павлин — национальная птица Индии. Его родственник, зелёный павлин Юго-Восточной Азии, находится под угрозой. Знаменитый шлейф есть только у самца, и состоит он из перьев, а не из самого хвоста.",
renard_voyageur:"Песец прошёл около 3 500 км за 76 дней — со Шпицбергена до Канады по морскому льду: одно из самых длинных отслеженных путешествий для животного его размера.",
hibou_sage:"Бородатая неясыть слышит полёвку под слоем снега более 50 см, а затем ныряет в снег, чтобы её поймать.",
loup_gardien:"В 1995 году волков вернули в Йеллоустоун через 70 лет после их исчезновения. Их возвращение изменило поведение оленей, затем растительность и даже русла некоторых рек: знаменитый «трофический каскад».",
blaireau_sorciere:"Барсучьи норы роют и расширяют поколение за поколением: некоторые заселены более века.",
lapin_citrouille:"Европейский кролик на Пиренейском полуострове признан исчезающим видом (МСОП, 2018) из-за болезней (миксоматоза и геморрагическая болезнь кроликов). Между тем иберийская рысь почти полностью зависит от него в питании.",
serpent_squelette:"У некоторых змей до 400 позвонков, и каждый несёт пару рёбер. Ног нет, зато скелет — как у акробата.",
renne_grelot:"Стада тундровых северных оленей и карибу сократились примерно на 56% за два–три десятилетия: потепление нарушает их кормовую базу.",
ours_pere_noel:"Осталось около 26 000 белых медведей, они считаются уязвимым видом. Они охотятся на тюленей со льда, который каждое лето отступает.",
pingouin_bonnet:"Императорский пингвин относится к видам, близким к угрожаемым. В 2022 и 2023 годах почти все птенцы в нескольких колониях моря Беллинсгаузена погибли: морской лёд раскололся раньше, чем они научились плавать.",
dragon_imperial:"В императорском Китае пятипалый дракон принадлежал только императору. Китайский дракон, связанный с водой и дождём, приносит удачу — в отличие от западного.",
belier_jade:"Овцы — одни из первых одомашненных животных, около 10 000 лет назад на Ближнем Востоке. В китайском зодиаке коза, овца и баран делят один знак.",
carpe_koi:"Кои — это карпы, которых в Японии выводят с XIX века ради окраса. Они могут жить более 50 лет, а их название в Японии связано и с удачей.",
cygne_cupidon:"Лебеди-шипуны образуют пары, которые часто остаются вместе на всю жизнь, отсюда их романтическая символика.",
loutre_main_dans_la_main:"Морские выдры держатся за лапы во сне, чтобы их не разнесло. Из-за охоты за мехом в 1911 году их осталось менее 2 000; сегодня их десятки тысяч.",
perruche_inseparable:"Неразлучники получили имя за крепкую привязанность партнёров. Существует девять видов, все родом из Африки и Мадагаскара.",
leopard_glacier:"В Центральной Азии осталось около 4 000–6 500 снежных барсов. Они считаются уязвимыми: им угрожают браконьерство, конфликты с пастухами и сокращение мест обитания.",
pangolin_blinde:"Панголин — самое контрабандное дикое млекопитающее в мире: ради чешуи и мяса. Все восемь видов охраняются.",
abeille_reine:"Матка медоносной пчелы может откладывать до 2 000 яиц в день. Около одного из десяти видов диких пчёл Европы находится под угрозой исчезновения, хотя они опыляют значительную часть наших культур.",
guepard_zenith:"Гепард — самое быстрое наземное животное, быстрее 100 км/ч на пике скорости. В дикой природе осталось около 7 000, и он исчез почти из всей Азии.",
hippopotame_marais:"В Африке осталось около 115 000–130 000 бегемотов, они считаются уязвимым видом. На них охотятся ради мяса и слоновой кости клыков.",
suricate_sentinelle:"Сурикаты выставляют часового на возвышении, пока остальные кормятся, и он предупреждает разными сигналами в зависимости от опасности (орёл, змея…).",
narval_etoile:"«Рог» нарвала — на самом деле зуб, бивень до 3 м, чувствительный к окружающей среде. В Средние века его продавали как рог единорога.",
lama_andin:"Лам одомашнили в Андах около 5 000 лет назад. Они возили караванные грузы задолго до того, как лошади попали в Америку.",
luciole_lune:"Световое загрязнение сбивает сигналы, которыми светлячки находят друг друга. Исследование 2021 года оценивает, что под угрозой примерно каждый седьмой вид Северной Америки.",
mammouth_ancestral:"Последние шерстистые мамонты жили на острове Врангеля в Арктике примерно до 4 000 лет назад — примерно тогда, когда строились египетские пирамиды.",
phenix:"Феникс возрождается из пепла. Миф пришёл из Древнего Египта (птица Бенну) и Греции и символизирует обновление.",
leviathan:"Левиафан — морское чудовище из Библии (книги Иова и Псалмов). Его имя стало словом для всего гигантского.",
griffon:"Грифон, наполовину орёл, наполовину лев, охранял сокровища в греческих сказаниях. По одной гипотезе, его могли вдохновить окаменелости динозавров из пустыни Гоби.",
licorne_saisons:"Первое описание единорога принадлежит греческому врачу Ктесию, около 400 г. до н. э.: он писал о рогатом диком осле из Индии. В Средние века «рога единорога» были на деле бивнями нарвалов.",
hydre:"Лернейская гидра, у которой отрастают головы, побеждена Гераклом в его двенадцати подвигах. В реальности гидра — крошечное пресноводное животное, способное восстанавливать всё тело.",
ouroboros:"Змея, кусающая свой хвост, — один из древнейших символов мира. Он встречается уже в Древнем Египте и означает бесконечный цикл, жизнь, обновляющую саму себя."
};
FACTS_X.tr={pegase:"Yunan mitolojisinde Pegasus, Perseus Medusa'nın başını kestiğinde onun kanından doğdu. Kahraman Bellerophon daha sonra Khimaira'yı yenmek için ona bindi. Zeus sonunda onu bir takımyıldıza dönüştürdü.",kraken:"Kraken, İskandinav denizcilerinin anlattığı hikâyelerden gelir: gemileri dibe çektiği söylenen dev bir deniz canavarı. Birçok kişi, gerçek dev kalamarlardan esinlendiğini düşünür.",minotaure:"Yarı insan yarı boğa olan Minotor, Girit'te Kral Minos'un Labirenti'ne hapsedilmişti. Kahraman Theseus onu Ariadne'nin ipi sayesinde öldürdü.",oiseau_tonnerre:"Gök Gürültüsü Kuşu, Kuzey Amerika'daki birçok yerli halkın geleneğinde dev bir ruh kuşudur. Kanat çırpışı gök gürültüsünü yapar, gözlerinden şimşekler çıkar.",tortue_monde:"Birçok eski gelenekte (Hint, Çin, bazı Kızılderili anlatıları) dünya dev bir kaplumbağanın sırtında durur.",qilin:"Qilin, Çin geleneğinde nazik bir yaratıktır. Görünmesinin bilge bir hükümdarı ya da bir bilgenin doğumunu haber verdiği söylenirdi. O kadar iyidir ki efsaneye göre canlı otun üstüne bile basmaz.",sphinx:"Yunan mitolojisinde Sfenks yolculara bir bilmece sorar, cevaplayamayanları yutardı. Oidipus cevabı buldu: sabah dört ayakla, öğlen iki ayakla, akşam üç ayakla yürüyen insan.",sirene:"Yunan mitolojisinde sirenler şarkılarıyla denizcileri kendilerine çekerdi. Odysseus, onları güvenle dinleyebilmek için kendini geminin direğine bağlattı.",basilic:"Basilisk, Yunanca «küçük kral» anlamına gelen sözcükten gelir. Ortaçağ hayvan kitaplarında bakışıyla ya da nefesiyle öldürürdü. Bilinen tek düşmanı gelincikti.",wyverne:"Wyvern, daha çok Avrupa hanedan armalarında görülen iki ayaklı bir ejderhadır. Adı, Eski Fransızca'da «engerek» anlamına gelen sözcükten gelir.",cerbere:"Yunan mitolojisinde Kerberos, Yeraltı'nın kapılarını bekler; hiçbir canlı girmez, hiçbir ölü çıkamazdı. Herakles onu on ikinci görevinde yakaladı.",kelpie:"Kelpie, İskoç halk inanışlarında şekil değiştiren bir su ruhudur; çoğu zaman göllerin ve nehirlerin yanında bir at olur. Sırtına binen kişi bir daha inemez.",dragon_celeste:"Çin geleneğinde göksel ejderha (Tianlong), gökyüzündeki tanrıların saraylarını korur.",eikthyrnir:"İskandinav mitolojisinde geyik Eikthyrnir, Valhalla'nın çatısında durur ve Læraðr ağacının yapraklarını yer. Boynuzlarından birçok nehri besleyen sular damlar.",jormungandr:"İskandinav mitolojisinde Jörmungandr, tüm dünyayı sarıp kendi kuyruğunu ısıracak kadar uzun olan Dünya Yılanı'dır. Thor, Ragnarök'te onunla savaşmaya mahkûmdur.",
tigre:"Yüz yıl önce yaklaşık 100.000 vahşi kaplan vardı. Bugün kaçak avcılık ve yaşam alanı kaybı yüzünden 6.000'den azı kaldı. Buna rağmen Hindistan ve Nepal'de sayılar son yıllarda artıyor.",
lion:"Afrika'da yaklaşık 20.000–25.000 vahşi aslan kaldı; yirmi yılda kabaca %40 düşüş. IUCN onu Savunmasız olarak listeliyor.",
chien:"Köpek, insanın evcilleştirdiği ilk hayvandı; en az 15.000 yıl önce, tarımdan çok daha önce.",
chat:"Kediler yaklaşık 10.000 yıl önce Yakın Doğu'da evcilleştirildi; muhtemelen ilk tahıl depolarının çevresinde kemirgenleri avladıkları için.",
boeuf:"Sığırlar, son bireyi 1627'de Polonya'da ölen yaban öküzünden (ur) gelir. Bugün dünyada bir milyardan fazla sığır var.",
renard:"Kızıl tilki, dünyanın en yaygın yabani etoburudur: Kuzey Kutbu'ndan Orta Doğu'ya, hatta şehirlerde bile yaşar.",
ours:"Boz ayı Batı Avrupa'nın birçok yerinden kayboldu. Koruma ve yeniden salımlar (Pireneler'de olduğu gibi) sayesinde geri dönüyor, ancak bazı popülasyonlar çok kırılgan.",
loup:"20. yüzyılda Batı Avrupa'nın çoğunda yok edilen kurt, 1992'de İtalya'dan Mercantour dağları üzerinden Fransa'ya geri döndü.",
aigle:"ABD'de kel kartal, 1963'te kısmen DDT böcek ilacı yüzünden 500'den az yuvalayan çifte düştü. Yasaklanmasından sonra artık 70.000'den fazla çift var.",
serpent:"Yaklaşık 3.900 yılan türü var ve yalnızca azınlığı tehlikeli. Yine de ısırıklar yılda on binlerce ölüme yol açıyor, çoğunlukla Güney Asya ve Afrika'da.",
herisson:"Avrupa kirpisi 2024'te IUCN tarafından Tehdide Yakın olarak listelendi. Yollar, robot çim biçerler, böcek ilaçları ve kaybolan çitler sayıyı düşürüyor.",
poulpe:"Ahtapotun üç kalbi ve mavi kanı vardır. Nöronlarının yaklaşık üçte ikisi kollarındadır ve kollar kısmen kendi başlarına 'karar verebilir'.",
chauve_souris:"Yarasalar tüm memeli türlerinin yaklaşık beşte birini oluşturur. Beyaz burun sendromu denen bir mantar hastalığı Kuzey Amerika'da milyonlarcasını öldürdü.",
dauphin:"Yangtze nehir yunusu (baiji) 2006'da işlevsel olarak soyu tükenmiş ilan edildi; balıkçılığın, gemi trafiğinin ve kirliliğin kurbanı: insan yüzünden kaybedilen ilk büyük deniz memelilerinden biri.",
tortue:"Yedi deniz kaplumbağası türünden altısı tehdit altında. Balık ağları, plastik ve yavruları şaşırtan plaj aydınlatmaları nedenler arasında.",
rhinoceros:"Dünyada yaklaşık 27.000 gergedan kaldı; yüz yıl önce yaklaşık 500.000'di. Tırnaklarımız gibi sadece keratinden oluşan boynuzları için avlanıyorlar.",
crabe:"Her yıl on milyonlarca Christmas Adası kırmızı yengeci, üremek için ormandan denize göç eder: en büyük kara hayvanı göçlerinden biri. Dev Japon örümcek yengeci 3,5 m'den fazla açıklığa ulaşabilir.",
requin:"Köpekbalığı ve vatoz türlerinin yaklaşık %37'si yok olma tehdidi altında. Her yıl on milyonlarca köpekbalığının, çoğunlukla yüzgeçleri için avlandığı tahmin ediliyor.",
crocodile:"Timsahgiller dinozorları yok eden kitlesel yok oluştan sağ çıktı. 1970'lerde yaklaşık 3.000'e düşürülen Avustralya tuzlusu su timsahı, bugün 100.000'in üzerine çıktı.",
elephant:"2021'de IUCN, Afrika savan filini Tehlikede, orman filini Kritik Tehlikede olarak listeledi. Orman fillerinin sayısı otuz yılda %80'den fazla düştü; çoğunlukla fildişi kaçakçılığı yüzünden.",
hibou:"Baykuşlar saçaklı tüyleri sayesinde neredeyse sessiz uçar. Antarktika dışındaki her kıtada yaşarlar.",
gorille:"Dağ gorilleri, onlarca yıllık korumanın ardından 2018'de Kritik Tehlikede'den Tehlikede'ye geçti: 1.000'in biraz üzerinde kaldı. Diğer goriller hâlâ kaçak avcılık, hastalık ve ormansızlaşma tehdidi altında.",
paon:"Hint tavus kuşu Hindistan'ın ulusal kuşudur. Akrabası olan Güneydoğu Asya'nın yeşil tavus kuşu tehlikede. Ünlü uzun kuyruk süsü yalnızca erkekte bulunur ve kuyruğun kendisi değil, tüylerden oluşur.",
renard_voyageur:"Bir kutup tilkisi, deniz buzu üzerinden Svalbard'dan Kanada'ya 76 günde yaklaşık 3.500 km yürüdü: bu boyuttaki bir hayvan için takip edilen en uzun yolculuklardan biri.",
hibou_sage:"Büyük gri baykuş, 50 cm'den kalın kar altındaki bir tarla faresini duyabilir ve yakalamak için karın içine dalar.",
loup_gardien:"1995'te kurtlar, kaybolduktan 70 yıl sonra Yellowstone'a yeniden salındı. Dönüşleri önce geyiklerin davranışını, sonra bitki örtüsünü, hatta bazı nehirleri değiştirdi: ünlü bir 'trofik kaskad'.",
blaireau_sorciere:"Porsuk yuvaları nesilden nesile kazılıp genişletilir: bazıları yüz yıldan uzun süredir kullanılıyor.",
lapin_citrouille:"Avrupa tavşanı, hastalıklar (miksomatoz ve tavşan kanamalı hastalığı) nedeniyle İber Yarımadası'nda Tehlikede olarak listeleniyor (IUCN, 2018). Oysa İber vaşağı beslenmesi için neredeyse tamamen ona bağlı.",
serpent_squelette:"Bazı yılanların 400'e kadar omurgası vardır ve her biri bir çift kaburga taşır. Bacak yok ama akrobat iskeleti var.",
renne_grelot:"Tundra ren geyiği ve karibu sürüleri, ısınan iklim besin kaynaklarını bozduğu için iki üç on yılda yaklaşık %56 azaldı.",

dragon_imperial:"Imparatorluk Çin'inde beş pençeli ejderha imparatora ayrılmıştı. Su ve yağmurla ilişkili Çin ejderhası, Batı ejderhasının aksine şans getirir.",
belier_jade:"Koyunlar, yaklaşık 10.000 yıl önce Yakın Doğu'da evcilleştirilen ilk hayvanlar arasındaydı. Çin zodyağında keçi, koyun ve koç tek bir burcu paylaşır.",
carpe_koi:"Koi, Japonya'da 19. yüzyıldan beri renkleri için yetiştirilen sazanlardır. 50 yıldan fazla yaşayabilirler ve adları Japonya'da şansı da çağrıştırır.",
cygne_cupidon:"Kuğular çoğu zaman ömür boyu birlikte kalan çiftler oluşturur; romantik sembolizmleri buradan gelir.",
loutre_main_dans_la_main:"Deniz su samurları uyurken birbirinden ayrılmamak için ellerini tutar. Kürkleri için avlanıp 1911'de 2.000'in altına düştüler; bugün on binlerce var.",

guepard_zenith:"Çita, en yüksek hızda 100 km/s'yi aşan en hızlı kara hayvanıdır. Doğada yaklaşık 7.000 kaldı ve Asya'nın çoğundan kayboldu.",
hippopotame_marais:"Afrika'da yaklaşık 115.000–130.000 su aygırı kaldı ve Savunmasız olarak listeleniyor. Etleri ve köpek dişlerinin fildişi için avlanıyorlar.",

luciole_lune:"Işık kirliliği, ateşböceklerinin birbirini bulmak için yaktığı sinyalleri karıştırır. 2021'de bir çalışma, Kuzey Amerika türlerinin yaklaşık yedide birinin tehdit altında olduğunu tahmin ediyor.",

griffon:"Yarı kartal yarı aslan olan grifon, Yunan anlatılarında hazineleri korurdu. Bir hipoteze göre Gobi Çölü'ndeki dinozor fosilleri onlara ilham vermiş olabilir.",
licorne_saisons:"Tek boynuzlu atın ilk tanımı, MÖ 400 civarında Yunan hekim Ktesias'a aittir; Hindistan'dan boynuzlu yabani bir eşek anlatır. Orta Çağ'da 'tek boynuz'lar aslında narval dişleriydi.",

ted by humans, at least 15,000 years ago, long before farming."],"chat":["Les chats ont été domestiqués il y a environ 10 000 ans au Proche-Orient, probablement parce qu'ils chassaient les rongeurs dans les premières réserves de grains.","Cats were domesticated about 10,000 years ago in the Near East, probably because they hunted rodents around the first grain stores."],"boeuf":["Les bovins descendent de l'aurochs, dont le dernier individu est mort en Pologne en 1627. Il existe aujourd'hui plus d'un milliard de bovins dans le monde.","Cattle descend from the aurochs, whose last individual died in Poland in 1627. There are now over a billion cattle worldwide."],"renard":["Le renard roux est le carnivore sauvage le plus répandu au monde : on le trouve de l'Arctique au Moyen-Orient, et même en pleine ville.","The red fox is the most widespread wild carnivore in the world: from the Arctic to the Middle East, and even in cities."],"ours":["L'ours brun a disparu de nombreuses régions d'Europe de l'Ouest. Grâce à la protection et aux réintroductions (comme dans les Pyrénées), il fait son retour, mais certaines populations restent très fragiles.","The brown bear vanished from many parts of western Europe. Thanks to protection and reintroductions (as in the Pyrenees) it is coming back, though some populations remain very fragile."],"loup":["Exterminé de la plus grande partie de l'Europe de l'Ouest au XXᵉ siècle, le loup est revenu en France en 1992, depuis l'Italie, par le massif du Mercantour.","Wiped out across most of western Europe in the 20th century, the wolf returned to France in 1992 from Italy, through the Mercantour mountains."],"aigle":["Aux États-Unis, les pygargues à tête blanche étaient tombés à moins de 500 couples nicheurs en 1963, victimes notamment du pesticide DDT. Après son interdiction, ils sont plus de 70 000 couples aujourd'hui.","In the United States, bald eagles fell to fewer than 500 nesting pairs in 1963, hit notably by the pesticide DDT. After it was banned, there are now over 70,000 pairs."],"serpent":["Il existe environ 3 900 espèces de serpents, et seule une minorité est dangereuse. Les morsures causent pourtant encore des dizaines de milliers de morts par an, surtout en Asie du Sud et en Afrique.","There are about 3,900 snake species, and only a minority are dangerous. Bites still cause tens of thousands of deaths a year, mostly in South Asia and Africa."],"herisson":["Le hérisson d'Europe a été classé « quasi menacé » par l'UICN en 2024. Routes, tondeuses robots, pesticides et haies disparues font chuter ses effectifs.","The European hedgehog was listed as Near Threatened by the IUCN in 2024. Roads, robot mowers, pesticides and vanishing hedgerows are driving numbers down."],"poulpe":["Le poulpe a trois cœurs et du sang bleu. Environ deux tiers de ses neurones se trouvent dans ses bras, qui peuvent « décider » en partie par eux-mêmes.","An octopus has three hearts and blue blood. About two thirds of its neurons are in its arms, which can partly 'decide' for themselves."],"chauve_souris":["Les chauves-souris représentent environ un cinquième de toutes les espèces de mammifères. Une maladie fongique, le syndrome du nez blanc, a tué plusieurs millions d'individus en Amérique du Nord.","Bats make up about a fifth of all mammal species. A fungal disease, white-nose syndrome, has killed millions of them in North America."],"dauphin":["Le dauphin du fleuve Yangtsé (baiji) a été déclaré fonctionnellement éteint en 2006, victime de la pêche, du trafic fluvial et de la pollution : l'un des premiers grands cétacés disparus à cause des humains.","The Yangtze river dolphin (baiji) was declared functionally extinct in 2006, a victim of fishing, boat traffic and pollution: one of the first large cetaceans lost because of humans."],"tortue":["Six des sept espèces de tortues marines sont classées menacées. Les filets de pêche, le plastique et l'éclairage des plages (qui désoriente les nouveau-nés) sont parmi les causes.","Six of the seven sea turtle species are listed as threatened. Fishing nets, plastic and beach lighting (which disorients hatchlings) are among the causes."],"rhinoceros":["Il reste environ 27 000 rhinocéros dans le monde, contre environ 500 000 il y a un siècle. Ils sont braconnés pour leur corne, qui ne contient pourtant que de la kératine, comme nos ongles.","About 27,000 rhinos remain in the world, versus roughly 500,000 a century ago. They are poached for their horn, which is just keratin, like our fingernails."],"crabe":["Chaque année, des dizaines de millions de crabes rouges de l'île Christmas migrent de la forêt vers la mer pour se reproduire : l'une des plus grandes migrations d'animaux terrestres. Le crabe-araignée géant du Japon, lui, dépasse 3,5 m d'envergure.","Every year tens of millions of Christmas Island red crabs migrate from forest to sea to breed: one of the largest land-animal migrations. The giant Japanese spider crab can span over 3.5 m."],"requin":["Environ 37 % des espèces de requins et de raies sont menacées d'extinction. On estime que des dizaines de millions de requins sont pêchés chaque année, souvent pour leurs ailerons.","About 37% of shark and ray species are threatened with extinction. Tens of millions of sharks are estimated to be caught every year, often for their fins."],"crocodile":["La lignée des crocodiliens a survécu à l'extinction qui a emporté les dinosaures. Le crocodile marin d'Australie, chassé jusqu'à environ 3 000 individus dans les années 1970, est depuis remonté à plus de 100 000.","Crocodilians survived the extinction that wiped out the dinosaurs. Australia's saltwater crocodile, hunted down to about 3,000 in the 1970s, has since recovered to over 100,000."],"elephant":["L'UICN a classé l'éléphant de savane d'Afrique « en danger » et l'éléphant de forêt « en danger critique » en 2021. Les éléphants de forêt auraient perdu plus de 80 % de leurs effectifs en trois décennies, surtout à cause du braconnage pour l'ivoire.","In 2021 the IUCN listed the African savanna elephant as Endangered and the forest elephant as Critically Endangered. Forest elephants lost more than 80% of their numbers in three decades, mostly to ivory poaching."],"hibou":["Les hiboux et chouettes volent presque sans bruit grâce à leurs plumes frangées. On en trouve sur tous les continents, sauf l'Antarctique.","Owls fly almost silently thanks to their fringed feathers. They live on every continent except Antarctica."],"gorille":["Les gorilles de montagne sont passés d'« en danger critique » à « en danger » en 2018, grâce à des décennies de protection : on en compte un peu plus de 1 000. Les autres gorilles restent menacés par le braconnage, les maladies et la déforestation.","Mountain gorillas moved from Critically Endangered to Endangered in 2018 after decades of protection: a little over 1,000 remain. Other gorillas are still threatened by poaching, disease and deforestation."],"paon":["Le paon bleu est l'oiseau national de l'Inde. Son cousin, le paon vert d'Asie du Sud-Est, est en danger d'extinction. Seul le mâle a la fameuse traîne, faite de plumes, pas de la queue elle-même.","The Indian peafowl is India's national bird. Its cousin, the green peafowl of Southeast Asia, is Endangered. Only the male has the famous train, made of feathers rather than the tail itself."],"renard_voyageur":["Un renard arctique a parcouru environ 3 500 km en 76 jours, de l'archipel du Svalbard jusqu'au Canada, en traversant la banquise : l'un des plus longs voyages jamais suivis pour un animal de cette taille.","An Arctic fox walked about 3,500 km in 76 days, from Svalbard to Canada across sea ice: one of the longest journeys ever tracked for an animal its size."],"hibou_sage":["La chouette lapone peut repérer à l'oreille un campagnol caché sous plus de 50 cm de neige, puis plonger pour l'attraper.","The great grey owl can hear a vole hidden under more than 50 cm of snow, then plunge in to catch it."],"loup_gardien":["En 1995, des loups ont été réintroduits dans le parc de Yellowstone, 70 ans après leur disparition. Le retour du prédateur a modifié le comportement des cerfs, donc la végétation, donc même certaines rivières : un exemple célèbre de « cascade écologique ».","In 1995 wolves were reintroduced to Yellowstone, 70 years after they disappeared. Their return changed how elk behave, then the vegetation, and even some rivers: a famous 'trophic cascade'."],"blaireau_sorciere":["Les terriers de blaireaux (les « sets ») sont creusés et agrandis par des générations successives : certains sont occupés depuis plus d'un siècle.","Badger setts are dug and extended by generation after generation: some have been occupied for over a century."],"lapin_citrouille":["Le lapin de garenne est classé « en danger » dans la péninsule Ibérique (UICN, 2018) à cause de maladies (myxomatose et fièvre hémorragique virale). Or le lynx ibérique en dépend presque entièrement pour se nourrir.","The European rabbit is listed as Endangered in the Iberian peninsula (IUCN, 2018) because of diseases (myxomatosis and rabbit haemorrhagic disease). Yet the Iberian lynx depends on it almost entirely for food."],"serpent_squelette":["Certains serpents ont jusqu'à 400 vertèbres, chacune portant une paire de côtes. Pas de pattes, mais un squelette de contorsionniste.","Some snakes have up to 400 vertebrae, each carrying a pair of ribs. No legs, but a contortionist's skeleton."],"renne_grelot":["Les populations de rennes et de caribous de la toundra ont chuté d'environ 56 % en deux à trois décennies, avec le réchauffement du climat, qui bouleverse la nourriture disponible.","Tundra reindeer and caribou herds have dropped by about 56% in two to three decades, as a warming climate upsets their food supply."],"ours_pere_noel":["Il reste environ 26 000 ours polaires, classés « vulnérables ». Ils dépendent de la banquise pour chasser le phoque, et elle recule chaque été.","About 26,000 polar bears remain, listed as Vulnerable. They rely on sea ice to hunt seals, and it retreats every summer."],"pingouin_bonnet":["Le manchot empereur est classé « quasi menacé ». En 2022 et 2023, presque tous les poussins de plusieurs colonies de la mer de Bellingshausen sont morts : la banquise s'était brisée avant qu'ils sachent nager.","The emperor penguin is listed as Near Threatened. In 2022 and 2023, nearly all chicks in several Bellingshausen Sea colonies died: the sea ice broke up before they could swim."],"dragon_imperial":["Légende : dans la Chine impériale, le dragon à cinq griffes était réservé à l'empereur. Le dragon chinois, lié à l'eau et à la pluie, porte bonheur, à l'inverse du dragon occidental.","Legend: in imperial China the five-clawed dragon was reserved for the emperor. The Chinese dragon, tied to water and rain, brings luck, unlike the Western dragon."],"belier_jade":["Le mouton fait partie des premiers animaux domestiqués, il y a environ 10 000 ans, au Proche-Orient. Dans le zodiaque chinois, la chèvre, le mouton et le bélier partagent un même signe.","Sheep were among the first animals domesticated, about 10,000 years ago in the Near East. In the Chinese zodiac, goat, sheep and ram share a single sign."],"carpe_koi":["Les koi sont des carpes élevées au Japon depuis le XIXᵉ siècle pour leurs couleurs. Ils peuvent vivre plus de 50 ans, et leur nom évoque aussi la chance au Japon.","Koi are carp bred in Japan since the 19th century for their colours. They can live over 50 years, and their name also evokes luck in Japan."],"cygne_cupidon":["Les cygnes tuberculés forment des couples souvent fidèles toute leur vie, d'où leur symbole romantique.","Mute swans form pairs that often stay together for life, hence their romantic symbolism."],"loutre_main_dans_la_main":["Les loutres de mer se tiennent par la patte en dormant pour ne pas dériver. Chassées pour leur fourrure, elles étaient tombées à moins de 2 000 en 1911 : elles se comptent aujourd'hui en dizaines de milliers.","Sea otters hold paws while sleeping so they don't drift apart. Hunted for fur, they fell below 2,000 in 1911; today they number in the tens of thousands."],"perruche_inseparable":["Les inséparables doivent leur nom au lien très fort entre partenaires. Il en existe neuf espèces, toutes originaires d'Afrique et de Madagascar.","Lovebirds are named for the strong bond between partners. There are nine species, all native to Africa and Madagascar."],"leopard_glacier":["Il reste environ 4 000 à 6 500 panthères des neiges, en Asie centrale. Classées « vulnérables », elles sont menacées par le braconnage, les conflits avec les éleveurs et le recul de leur habitat.","About 4,000–6,500 snow leopards remain in Central Asia. Listed as Vulnerable, they are threatened by poaching, conflict with herders and shrinking habitat."],"pangolin_blinde":["Le pangolin est le mammifère sauvage le plus braconné au monde, pour ses écailles et sa viande. Ses huit espèces sont toutes protégées.","The pangolin is the most trafficked wild mammal in the world, for its scales and meat. All eight species are protected."],"abeille_reine":["Une reine abeille peut pondre jusqu'à 2 000 œufs par jour. Environ une espèce d'abeille sauvage européenne sur dix est menacée d'extinction, alors que ces insectes pollinisent une grande part de nos cultures.","A queen honeybee can lay up to 2,000 eggs a day. About one in ten European wild bee species is threatened with extinction, yet they pollinate a large share of our crops."],"guepard_zenith":["Le guépard est l'animal terrestre le plus rapide, plus de 100 km/h en pointe. Il en reste environ 7 000 à l'état sauvage, et il a disparu de la plus grande partie de l'Asie.","The cheetah is the fastest land animal, over 100 km/h at top speed. About 7,000 remain in the wild, and it has vanished from most of Asia."],"hippopotame_marais":["Il reste environ 115 000 à 130 000 hippopotames en Afrique, classés « vulnérables ». On les chasse pour la viande et l'ivoire de leurs canines.","About 115,000–130,000 hippos remain in Africa, listed as Vulnerable. They are hunted for meat and for the ivory of their canines."],"suricate_sentinelle":["Chez les suricates, un individu monte la garde debout sur un point haut pendant que les autres cherchent à manger, et prévient les autres par des cris différents selon le danger (aigle, serpent…).","Meerkats post a sentinel standing on a high spot while the others forage, and it warns with different calls depending on the danger (eagle, snake…)."],"narval_etoile":["La « corne » du narval est en réalité une dent, une défense qui peut atteindre 3 m et qui est sensible aux changements du milieu. Au Moyen Âge, on la vendait comme corne de licorne.","The narwhal's 'horn' is actually a tooth, a tusk that can reach 3 m and is sensitive to its surroundings. In the Middle Ages it was sold as unicorn horn."],"lama_andin":["Les lamas sont domestiqués dans les Andes depuis environ 5 000 ans. Ils portaient les charges des caravanes, bien avant l'arrivée du cheval en Amérique.","Llamas have been domesticated in the Andes for about 5,000 years. They carried caravan loads long before horses reached the Americas."],"luciole_lune":["La pollution lumineuse brouille les signaux des lucioles, qui s'envoient des éclairs pour se trouver. Une étude de 2021 estime qu'environ une espèce nord-américaine sur sept est menacée.","Light pollution scrambles fireflies' signals, which they flash to find each other. A 2021 study estimates about one in seven North American species is threatened."],"mammouth_ancestral":["Les derniers mammouths laineux ont vécu sur l'île Wrangel, en Arctique, jusqu'il y a environ 4 000 ans : à l'époque où l'on construisait les pyramides d'Égypte.","The last woolly mammoths lived on Wrangel Island in the Arctic until about 4,000 years ago: around the time the Egyptian pyramids were being built."],"phenix":["Légende : le phénix renaît de ses cendres. Le mythe vient de l'Égypte ancienne (l'oiseau Bénou) et de la Grèce, et symbolise le renouveau.","Legend: the phoenix is reborn from its ashes. The myth comes from ancient Egypt (the Bennu bird) and Greece, and stands for renewal."],"leviathan":["Légende : le Léviathan est un monstre marin qui apparaît dans la Bible (livres de Job et des Psaumes). Son nom est devenu un mot pour parler de tout ce qui est gigantesque.","Legend: the Leviathan is a sea monster from the Bible (books of Job and Psalms). Its name has become a word for anything gigantic."],"griffon":["Légende : le griffon, moitié aigle, moitié lion, gardait des trésors dans les récits grecs. Selon une hypothèse, les fossiles de dinosaures du désert de Gobi auraient inspiré ces récits.","Legend: the griffin, half eagle and half lion, guarded treasure in Greek tales. One hypothesis says dinosaur fossils from the Gobi desert may have inspired them."],"licorne_saisons":["Légende : la première description de la licorne vient d'un médecin grec, Ctésias, vers 400 av. J.-C., qui parle d'un âne sauvage à corne venu d'Inde. Au Moyen Âge, les « cornes de licorne » étaient en réalité des défenses de narval.","Legend: the first description of the unicorn comes from a Greek physician, Ctesias, around 400 BC, who wrote of a horned wild ass from India. In the Middle Ages 'unicorn horns' were really narwhal tusks."],"hydre":["Légende : l'hydre de Lerne, à plusieurs têtes qui repoussent, est vaincue par Héraclès lors de ses douze travaux. Dans la vraie nature, l'hydre est un petit animal d'eau douce capable de régénérer son corps entier.","Legend: the Lernaean Hydra, whose heads grow back, is defeated by Heracles in his twelve labours. In real life the hydra is a tiny freshwater animal able to regenerate its whole body."],"ouroboros":["Légende : le serpent qui se mord la queue est l'un des plus anciens symboles du monde. On le trouve déjà dans l'Égypte ancienne, et il représente le cycle sans fin, la vie qui se renouvelle.","Legend: the snake biting its own tail is one of the oldest symbols in the world. It appears as early as ancient Egypt and stands for an endless cycle, life renewing itself."],"pegase":["Légende : Dans la mythologie grecque, Pégase est né du sang de Méduse quand Persée lui a coupé la tête. Le héros Bellérophon l'a ensuite monté pour vaincre la Chimère. Zeus l'a finalement transformé en constellation.","Legend: In Greek mythology, Pegasus sprang from the blood of Medusa when Perseus beheaded her. The hero Bellerophon later rode him to defeat the Chimera. Zeus finally turned him into a constellation."],"kraken":["Légende : Le Kraken vient des récits des marins scandinaves : un monstre marin géant qui entraînait les navires au fond de l'eau. Beaucoup pensent qu'il s'est inspiré des calmars géants, bien réels.","Legend: The Kraken comes from Scandinavian sailors' tales: a giant sea monster said to drag ships to the bottom. Many believe it was inspired by real giant squid."],"minotaure":["Légende : Le Minotaure, mi-homme mi-taureau, était enfermé dans le Labyrinthe du roi Minos, en Crète. Le héros Thésée l'a tué grâce au fil d'Ariane.","Legend: The Minotaur, half man and half bull, was locked in the Labyrinth of King Minos on Crete. The hero Theseus killed it with the help of Ariadne's thread."],"oiseau_tonnerre":["Légende : L'Oiseau-Tonnerre est un esprit-oiseau géant dans les traditions de plusieurs peuples autochtones d'Amérique du Nord. Le battement de ses ailes fait le tonnerre, et des éclairs jaillissent de ses yeux.","Legend: The Thunderbird is a giant spirit bird in the traditions of several Native peoples of North America. The beat of its wings makes thunder, and lightning flashes from its eyes."],"tortue_monde":["Légende : Dans plusieurs traditions anciennes (hindoue, chinoise, certains récits amérindiens), le monde repose sur le dos d'une tortue géante.","Legend: In several ancient traditions (Hindu, Chinese, some Native American stories), the world rests on the back of a giant turtle."],"qilin":["Légende : Le qilin est une créature douce de la tradition chinoise. On disait que son apparition annonçait un souverain sage ou la naissance d'un sage. Il serait si bon qu'il ne marche même pas sur l'herbe vivante.","Legend: The qilin is a gentle creature of Chinese tradition. Its appearance was said to announce a wise ruler or the birth of a sage. It is so kind that it supposedly never treads on living grass."],"sphinx":["Légende : Dans la mythologie grecque, le Sphinx posait une énigme aux voyageurs et dévorait ceux qui échouaient. Œdipe a trouvé la réponse : l'Homme, qui marche à quatre pattes le matin, sur deux le midi et sur trois le soir.","Legend: In Greek myth, the Sphinx asked travelers a riddle and devoured those who failed. Oedipus found the answer: Man, who crawls on four legs in the morning, walks on two at noon and on three in the evening."],"sirene":["Légende : Dans la mythologie grecque, les sirènes attiraient les marins par leur chant. Ulysse s'est fait attacher au mât de son navire pour l'écouter sans danger.","Legend: In Greek mythology, sirens lured sailors with their songs. Odysseus had himself tied to the mast of his ship so he could listen safely."],"basilic":["Légende : Basilic vient du grec « petit roi ». Dans les bestiaires du Moyen Âge, il tuait par son regard ou son souffle. Son seul ennemi connu était la belette.","Legend: Basilisk comes from the Greek for \"little king\". In medieval bestiaries it killed with its gaze or its breath. Its only known enemy was the weasel."],"wyverne":["Légende : La wyverne est un dragon à deux pattes que l'on voit surtout dans l'héraldique européenne, sur les blasons. Son nom vient de l'ancien français pour « vipère ».","Legend: The wyvern is a two-legged dragon seen mostly in European heraldry, on coats of arms. Its name comes from the Old French word for \"viper\"."],"cerbere":["Légende : Dans la mythologie grecque, Cerbère gardait les portes des Enfers : aucune âme vivante n'y entrait, aucune âme morte n'en sortait. Héraclès l'a capturé lors de son douzième travail.","Legend: In Greek myth, Cerberus guarded the gates of the Underworld: no living soul could enter and no dead soul could leave. Heracles captured him as his twelfth labour."],"kelpie":["Légende : Le kelpie est un esprit de l'eau métamorphe du folklore écossais, souvent un cheval près des lacs et des rivières. Celui qui monte sur son dos ne peut plus en descendre.","Legend: The kelpie is a shape-shifting water spirit from Scottish folklore, often a horse near lakes and rivers. Whoever climbs on its back cannot get off again."],"dragon_celeste":["Légende : Dans la tradition chinoise, le dragon céleste (Tianlong) garde les palais des dieux dans le ciel.","Legend: In Chinese tradition, the celestial dragon (Tianlong) guards the palaces of the gods in the sky."],"eikthyrnir":["Légende : Dans la mythologie nordique, le cerf Eikthyrnir se tient sur le toit du Valhalla et broute les feuilles de l'arbre Læraðr. De ses bois coulent les eaux qui nourrissent de nombreux fleuves.","Legend: In Norse myth, the stag Eikthyrnir stands on the roof of Valhalla and eats the leaves of the tree Læraðr. From his antlers drip the waters that feed many rivers."],"jormungandr":["Légende : Dans la mythologie nordique, Jörmungandr est le Serpent-Monde, si long qu'il entoure toute la Terre et se mord la queue. Thor est destiné à l'affronter lors du Ragnarök.","Legend: In Norse myth, Jörmungandr is the World Serpent, so long that it circles the whole world and bites its own tail. Thor is fated to fight it at Ragnarök."]},"discord":{"2":0.85,"3":0.75}};
